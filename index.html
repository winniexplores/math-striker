<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Math Striker</title>
  <meta name="description" content="A vertical arcade shooter where your score is your health and the enemies are numbers.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-fullscreen">
  <meta name="theme-color" content="#02060f">
  <style>
/* Center the portrait canvas and scale it to the window, keeping 2:3 aspect. */
* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: #02060f;
  overflow: hidden;
  overscroll-behavior: none;       /* no pull-to-refresh while dragging */
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}

main {
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
}

canvas {
  display: block;
  height: min(100dvh, 150vw);
  aspect-ratio: 2 / 3;
  background: #040a18;
  box-shadow: 0 0 60px rgba(77, 210, 255, 0.18);
  touch-action: none; /* stop page scroll/zoom gestures on the canvas */
}

noscript {
  position: fixed;
  inset: 0;
  display: grid;
  place-items: center;
  color: #fff;
  font-family: monospace;
}

/* "Use your phone" screen shown on computers */
#desktop-notice {
  text-align: center;
  color: #d3e0f5;
  font-family: "Courier New", ui-monospace, monospace;
  padding: 24px;
}
#desktop-notice[hidden] { display: none; }
#desktop-notice h1 { font-size: 40px; margin: 0 0 24px; color: #4dd2ff; text-shadow: 0 0 18px #4dd2ff; }
#desktop-notice h1 span { color: #ff6bd6; text-shadow: 0 0 18px #ff6bd6; }
#desktop-notice p { font-size: 18px; margin: 8px 0; }
canvas[hidden] { display: none; }

/* Overlays: "open in your browser" prompt and leaderboard name box */
input { -webkit-user-select: text; user-select: text; } /* body blocks selection; typing needs it */

.overlay {
  position: fixed;
  inset: 0;
  z-index: 10;
  display: grid;
  place-items: center;
  padding: 20px;
  background: rgba(2, 6, 15, 0.94);
  color: #d3e0f5;
  font-family: "Courier New", ui-monospace, monospace;
  overflow-y: auto;
}
.overlay[hidden] { display: none; }

.card {
  width: min(420px, 100%);
  padding: 24px 20px;
  text-align: center;
  background: #07142a;
  border: 2px solid #4dd2ff;
  border-radius: 16px;
  box-shadow: 0 0 30px rgba(77, 210, 255, 0.25);
}
.card h2 { margin: 0 0 12px; font-size: 21px; letter-spacing: 1px; color: #ffd75e; text-shadow: 0 0 12px #ffd75e; }
.card p { margin: 10px 0; font-size: 15px; line-height: 1.45; }
.card p.big { margin: 4px 0 12px; font-size: 44px; font-weight: bold; color: #fff; text-shadow: 0 0 14px #4dd2ff; }
.card p.link { word-break: break-all; font-size: 13px; color: #5dffb0; -webkit-user-select: text; user-select: text; }
.card p.link[hidden] { display: none; }

.btn {
  display: block;
  width: 100%;
  margin: 12px 0 0;
  padding: 14px 10px;
  font: bold 16px "Courier New", ui-monospace, monospace;
  color: #fff;
  text-align: center;
  text-decoration: none;
  background: #0c2142;
  border: 2px solid #4dd2ff;
  border-radius: 12px;
  cursor: pointer;
}
.btn[hidden] { display: none; }
.btn.primary { color: #5dffb0; border-color: #5dffb0; }
.btn.ghost { color: #9fb6d8; border-color: #5b7497; background: transparent; }

.card input {
  width: 100%;
  padding: 14px 10px;
  font: bold 20px "Courier New", ui-monospace, monospace; /* 16px+ stops iPhone zooming in */
  text-align: center;
  color: #fff;
  background: #020a18;
  border: 2px solid #4dd2ff;
  border-radius: 12px;
  outline: none;
}
.card input:focus { border-color: #ffd75e; }

  </style>
</head>
<body>
  <main>
    <canvas id="game" width="480" height="720" aria-label="Math Striker game canvas"></canvas>
    <section id="desktop-notice" hidden>
      <h1>MATH <span>STRIKER</span></h1>
      <p>This game is built for <strong>phones</strong>.</p>
      <p>Open this page on your phone to play.</p>
    </section>
  </main>
  <!-- Shown inside Messenger / Facebook / Instagram's built-in browser -->
  <section id="inapp-notice" class="overlay" hidden>
    <div class="card">
      <h2>OPEN IN YOUR BROWSER</h2>
      <p>You opened this link inside <strong id="inapp-app">Messenger</strong>. Its built-in browser can break sound, fullscreen and your saved scores.</p>
      <p id="inapp-help"></p>
      <a id="inapp-open" class="btn primary" href="#" hidden>OPEN IN CHROME</a>
      <button id="inapp-copy" class="btn" type="button">COPY LINK</button>
      <p id="inapp-link" class="link" hidden></p>
      <button id="inapp-continue" class="btn ghost" type="button">CONTINUE ANYWAY</button>
    </div>
  </section>

  <!-- Shown after a game when the score makes the leaderboard -->
  <section id="name-entry" class="overlay" hidden>
    <form id="name-form" class="card" autocomplete="off">
      <h2>NEW LEADERBOARD SCORE!</h2>
      <p class="big" id="name-score">0</p>
      <p>Type your name for the leaderboard:</p>
      <input id="name-input" type="text" maxlength="12" placeholder="YOUR NAME" autocomplete="off" autocapitalize="words" spellcheck="false" enterkeyhint="done">
      <button class="btn primary" type="submit">SAVE SCORE</button>
      <button id="name-skip" class="btn ghost" type="button">SKIP</button>
    </form>
  </section>

  <noscript>Math Striker needs JavaScript enabled.</noscript>
  <script>
/* ====================================================================
   MATH STRIKER - everything in one file.
   Tip: use Ctrl+F (or the search icon) to jump to a "FILE:" marker below.
   FILE: config.js   = numbers, pilots, lives, obstacles, leaderboard settings
   FILE: stages.js   = the 4 stages
   FILE: entities.js = how numbers/bullets/power-ups look
   FILE: draw.js     = ship shapes
   FILE: ui.js       = menu, score bar, buttons, leaderboard screen
   FILE: leaderboard.js = high-score saving (and the optional online board)
   FILE: inapp.js    = the open-in-your-browser check for Messenger etc.
   ==================================================================== */
/* ======================= FILE: config.js ======================= */
const __mod_config = (() => {
  // =============================================================================

  // =============================================================================

  const CONFIG = {
    // --- Canvas (logical resolution; CSS scales it to fit the window) ----------

    stageClearBonus: 20,      // bonus score = this * stage number (1..4)
    maxBombs: 5,

    // --- Math rules -------------------------------------------------------------
    maxScore: 999999,         // the score can never go above this
    dangerPerStage: 0.35,     // enemy "-n" bullets hurt (1 + this*stagesCleared) times more
    hazardPercent: 0.04,      // a size-9 bullet also takes this share of your CURRENT score

    powerupDuration: { abs: 8, pi: 8, sq: 8 }, // seconds

    touch: {

    combo: { window: 2.2, milestone: 5, bonus: 4, maxBonus: 30 }, // chain kills/pickups within `window` secs
    graze: { margin: 15, reward: 2, cooldown: 0.18 },             // near-miss "CLOSE CALL" bonus
    gates: { first: 15, interval: [20, 28], w: 128, h: 62, reward: 30, speed: 92 },
    formations: { first: 10, interval: [8, 13] },

    slowmo: { lastLifeSecs: 0.9, lastLifeScale: 0.35, deathScale: 0.4, deathSecs: 0.7 },

    // The board keeps ONE row per player name: your best score of the season.
    // A tier is reached when your best score this season reaches `min`.
    ranked: {
      tiers: [
        { name: 'BRONZE',   min: 0,    color: '#d79b64' },
        { name: 'SILVER',   min: 400,  color: '#d6dde8' },

      ],
      nameMax: 12,

    },


    // --- Lives & obstacles --------------------------------------------------------
    // Obstacles are orange METEORS and striped WALLS. They cannot be shot and they
    // cost one life. Your score is still your health: score 0 = game over too.
    startLives: 3,
    maxLives: 3,              // lives can never go above this (heart pickups stop here)
    invulnSecs: 2,            // after losing a life you cannot lose another for this long
    scoreZeroCostsLife: false,// true: score hitting 0 costs a life and refills half your
                              //       starting score, instead of ending the run at once
    lifePickupInterval: [30, 45], // seconds between heart drops (only when below max lives)
    obstacles: {
      meteorRadius: 24,

      wallGap: 150,           // width of the safe gap in a wall (your ship is ~40 wide)
    },

  };

  // -----------------------------------------------------------------------------
  // Playable pilots.
  //   startScore  : your running score IS your health, so this is starting HP

  const CHARACTERS = [
    {

      stats: { Defense: 5, Mobility: 2, Burst: 2 },

      name: 'CALCULA',
      role: 'Female Pilot',
      color: '#ff6bd6',
      blurb: ['Fast and fierce.', 'Twin shots plus a', '5-way burst with 2x', 'damage every 6th volley.'],
      stats: { Defense: 2, Mobility: 5, Burst: 5 },
      startScore: 100,
      lossScale: 1.0,
      speed: 340,
      fireCooldown: 0.15,

  return { CONFIG, CHARACTERS };
})();

/* ======================= FILE: rng.js ======================= */
const __mod_rng = (() => {
  // =============================================================================
  // rng.js  -  small random helpers.
  //   mulberry32(seed)  a seedable random generator: same seed = same sequence
  //   hash53(text)      a quick text hash (NOT secure, just stable)
  // =============================================================================

  function mulberry32(seed) {
    let a = seed | 0;
    return () => {
      a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  /** cyrb53: stable 53-bit hash of a string, returned as a hex string. */
  function hash53(str, seed = 0) {
    let h1 = 0xdeadbeef ^ seed;
    let h2 = 0x41c6ce57 ^ seed;
    for (let i = 0; i < str.length; i++) {
      const ch = str.charCodeAt(i);
      h1 = Math.imul(h1 ^ ch, 2654435761);
      h2 = Math.imul(h2 ^ ch, 1597334677);
    }
    h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
    h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
    return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(16).padStart(14, '0');
  }

  /** Pick one item from a list with the given random function. */
  const pickOne = (rng, list) => list[Math.floor(rng() * list.length)];
  return { mulberry32, hash53, pickOne };
})();

/* ======================= FILE: stages.js ======================= */
const __mod_stages = (() => {
  // =============================================================================
  // stages.js  -  data-driven stage definitions.
  //
  // To add a stage or rebalance one, edit this table. No game logic changes.
  //
  // Each stage applies ITS OWN operation to your score (see mathRules.js).
  // Each `table` entry describes an operand that can spawn:
  //   { kind: 'int',  sign: +1|-1, min, max, weight }   random whole number, e.g. +7 or -4
  //   { kind: 'int',  values: [2,3,5],         weight } explicit whole numbers (may be 0 or negative)
  //   { kind: 'frac', pairs: [[1,2],[3,4]],    weight } fractions between 0 and 1
  // Whether an operand is GOOD (raises your score), BAD (lowers it) or DEADLY is worked
  // out by the stage operation, so the same table format works for every stage.
  //
  // shooterChance : chance a hostile integer carries a gun (fires -n bullets)
  // shooterVolley : bullets per shot (fan spread)
  // fallSpeed     : [min, max] pixels per second
  // obstacles     : { interval: [min, max] seconds between orange rocks/walls, wallChance: 0..1 }
  // =============================================================================

  const STAGES = [
    {
      id: 1,
      op: '+',
      name: 'ADDITION',
      hue: 200,
      tagline: 'S + x : positives raise you, negatives lower you.',
      spawnInterval: 0.62,
      fallSpeed: [70, 120],
      shooterChance: 0.12,
      shooterVolley: 1,
      obstacles: { interval: [9, 13], wallChance: 0 }, // seconds between rocks/walls, share that are walls
      table: [
        { kind: 'int', sign: +1, min: 1, max: 9, weight: 5 },
        { kind: 'int', sign: -1, min: 1, max: 9, weight: 3.5 },
      ],
    },
    {
      id: 2,
      op: '−',
      name: 'SUBTRACTION',
      hue: 285,
      tagline: 'S − x : positives drain you, negatives RAISE you.',
      spawnInterval: 0.56,
      fallSpeed: [75, 125],
      shooterChance: 0.55,
      shooterVolley: 3,
      obstacles: { interval: [8, 12], wallChance: 0.2 }, // seconds between rocks/walls, share that are walls
      table: [
        { kind: 'int', sign: -1, min: 1, max: 6, weight: 3 },   // S − (−n) = S + n  (good)
        { kind: 'int', sign: +1, min: 2, max: 9, weight: 4 },   // S − n             (bad)
      ],
    },
    {
      id: 3,
      op: '×',
      name: 'MULTIPLICATION',
      hue: 40,
      tagline: 'S × x : ×2+ grows, fractions shrink. ×0 and ×negative = DEATH.',
      spawnInterval: 0.54,
      fallSpeed: [80, 135],
      shooterChance: 0,
      shooterVolley: 1,
      obstacles: { interval: [7, 11], wallChance: 0.3 }, // seconds between rocks/walls, share that are walls
      table: [
        { kind: 'int', values: [2, 2, 3, 5], weight: 2.8 },                        // good
        { kind: 'frac', pairs: [[1, 2], [1, 3], [2, 3], [3, 4]], weight: 2.2 },    // bad: shrinks you
        { kind: 'int', values: [0], weight: 0.8 },                                 // S × 0 = 0: death
        { kind: 'int', values: [-2, -3], weight: 0.7 },                            // different signs: death
      ],
    },
    {
      id: 4,
      op: '÷',
      name: 'DIVISION & FRACTIONS',
      hue: 340,
      tagline: 'S ÷ x : fractions RAISE you, whole numbers shrink you. ÷0 = −1 life.',
      spawnInterval: 0.52,
      fallSpeed: [85, 140],
      shooterChance: 0,
      shooterVolley: 2,
      obstacles: { interval: [6.5, 10], wallChance: 0.35 }, // seconds between rocks/walls, share that are walls
      table: [
        { kind: 'frac', pairs: [[1, 2], [1, 3], [1, 4], [2, 3]], weight: 2.8 },    // good: ÷(1/2) doubles you
        { kind: 'int', values: [2, 3, 4], weight: 2.6 },                           // bad: shrinks you
        { kind: 'int', values: [0], weight: 0.8 },                                 // ÷0 is undefined: −1 life
        { kind: 'int', values: [-2, -3], weight: 0.7 },                            // different signs: death
      ],
    },
  ];
  return { STAGES };
})();

/* ======================= FILE: draw.js ======================= */
const __mod_draw = (() => {
  // =============================================================================
  // draw.js  -  small canvas helpers shared by entities and UI.
  // =============================================================================

  const { CONFIG } = __mod_config;

  /**
   * Draw centered/aligned text with an optional neon glow.
   * opts: size, color, align, baseline, weight, glow (blur radius, 0 = none)
   */
  function drawText(ctx, str, x, y, opts = {}) {
    const { size = 16, color = '#ffffff', align = 'center', baseline = 'middle', weight = 'bold', glow = 0 } = opts;
    ctx.font = `${weight} ${size}px ${CONFIG.font}`;
    ctx.textAlign = align;
    ctx.textBaseline = baseline;
    ctx.fillStyle = color;
    if (glow > 0) {
      ctx.shadowColor = color;
      ctx.shadowBlur = glow;
    }
    ctx.fillText(str, x, y);
    ctx.shadowBlur = 0;
  }

  /** A heart shape centred on (x, y). `s` is its size; filled = life left, outline = life lost. */
  function drawHeart(ctx, x, y, s, color, filled = true) {
    ctx.save();
    ctx.translate(x, y);
    ctx.beginPath();
    ctx.moveTo(0, s * 0.95);
    ctx.bezierCurveTo(-s * 1.7, -s * 0.1, -s * 0.8, -s * 1.3, 0, -s * 0.4);
    ctx.bezierCurveTo(s * 0.8, -s * 1.3, s * 1.7, -s * 0.1, 0, s * 0.95);
    ctx.closePath();
    if (filled) {
      ctx.shadowColor = color;
      ctx.shadowBlur = 10;
      ctx.fillStyle = color;
      ctx.fill();
    } else {
      ctx.strokeStyle = color;
      ctx.globalAlpha = 0.4;
      ctx.lineWidth = 1.8;
      ctx.stroke();
    }
    ctx.restore();
  }

  /** Trace (but do not fill) a rounded rectangle path. Works in every browser. */
  function pathRoundRect(ctx, x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  /**
   * Draw a pilot's ship. Used for the in-game player and the character-select cards.
   * Axiom = broad armored fighter, Calcula = sleek swept-wing fighter.
   */
  function drawShip(ctx, character, x, y, scale = 1, t = 0) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);

    // engine flame (flickers with time)
    const flame = 10 + 6 * Math.sin(t * 40);
    ctx.fillStyle = '#ffb347';
    ctx.shadowColor = '#ff7b00';
    ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.moveTo(-5, 12);
    ctx.lineTo(0, 12 + flame);
    ctx.lineTo(5, 12);
    ctx.closePath();
    ctx.fill();

    // hull
    ctx.shadowColor = character.color;
    ctx.shadowBlur = 14;
    ctx.fillStyle = character.color;
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    if (character.id === 'axiom') {
      ctx.moveTo(0, -24); ctx.lineTo(9, -6); ctx.lineTo(20, 8); ctx.lineTo(20, 16);
      ctx.lineTo(8, 10); ctx.lineTo(0, 14); ctx.lineTo(-8, 10); ctx.lineTo(-20, 16);
      ctx.lineTo(-20, 8); ctx.lineTo(-9, -6);
    } else {
      ctx.moveTo(0, -26); ctx.lineTo(6, -4); ctx.lineTo(22, 18); ctx.lineTo(7, 11);
      ctx.lineTo(0, 16); ctx.lineTo(-7, 11); ctx.lineTo(-22, 18); ctx.lineTo(-6, -4);
    }
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.stroke();

    // cockpit
    ctx.fillStyle = '#0b1b33';
    ctx.beginPath();
    ctx.ellipse(0, -4, 3.5, 6, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }
  return { drawText, drawHeart, pathRoundRect, drawShip };
})();

/* ======================= FILE: audio.js ======================= */
const __mod_audio = (() => {
  // =============================================================================
  // audio.js  -  tiny synthesized sound effects (no audio files needed).
  // Browsers only allow audio after a user gesture, so main.js calls unlock()
  // on the first key press / click. Everything is a no-op if WebAudio is missing
  // (for example when the smoke test runs in Node).
  // =============================================================================

  // name -> oscillator recipe. `slide` is the pitch change (Hz) over the duration.
  const PRESETS = {
    shoot:    { freq: 880, slide: -420, dur: 0.05, type: 'square',   gain: 0.20 },
    kill:     { freq: 320, slide: -140, dur: 0.09, type: 'triangle', gain: 0.45 },
    pickup:   { freq: 620, slide: 420,  dur: 0.10, type: 'sine',     gain: 0.55 },
    hit:      { freq: 150, slide: -90,  dur: 0.20, type: 'sawtooth', gain: 0.55 },
    power:    { freq: 480, slide: 720,  dur: 0.28, type: 'sine',     gain: 0.60 },
    bomb:     { freq: 110, slide: -70,  dur: 0.55, type: 'sawtooth', gain: 0.70 },
    stage:    { freq: 440, slide: 440,  dur: 0.40, type: 'triangle', gain: 0.55 },

    s0:   { bpm: 116, root: 130.8, scale: [0, 2, 4, 7, 9],           bass: [0, 4, 8, 12],     wave: 'triangle' },

    s3:   { bpm: 134, root: 138.6, scale: [0, 1, 4, 5, 7, 8, 11],    bass: [0, 4, 8, 12],     wave: 'square' },
    boss: { bpm: 150, root: 98.0,  scale: [0, 1, 3, 5, 7, 8, 10],    bass: [0, 2, 4, 6, 8, 10, 12, 14], wave: 'sawtooth' },

      if (!ctx) return;

        this.nextTime += stepDur;

    _note(th, i, when, stepDur) {

    }

    _tone(freq, type, when, dur, gain) {
      const ctx = this.sfx.ctx;
      const osc = ctx.createOscillator();
      const amp = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, when);

      amp.gain.exponentialRampToValueAtTime(g, when + 0.01);
      amp.gain.exponentialRampToValueAtTime(0.0001, when + dur);
      osc.connect(amp).connect(ctx.destination);
      osc.start(when);
      osc.stop(when + dur + 0.02);
    }
  }
  return { THEMES, Sfx, Music };
})();

const __mod_input = (() => {
  // =============================================================================
  // input.js  -  keyboard handling with "held" and "just pressed" queries.
  //
  //   input.isDown('left')      -> true every frame the key is held
  //   input.wasPressed('bomb')  -> true only on the frame the key went down
  //
  // Game.update() calls input.endFrame() once per frame to clear the edge set.
  // =============================================================================

  // Logical action -> physical key codes (KeyboardEvent.code, layout independent)
  const KEYMAP = {
    left: ['ArrowLeft', 'KeyA'],
    right: ['ArrowRight', 'KeyD'],
    up: ['ArrowUp', 'KeyW'],
    down: ['ArrowDown', 'KeyS'],
    shoot: ['Space'],
    bomb: ['KeyB'],
    confirm: ['Enter', 'Space'],
    pause: ['KeyP', 'Escape'],
    back: ['Escape'],
    mute: ['KeyM'],
    pick1: ['Digit1'],
    pick2: ['Digit2'],
    pick3: ['Digit3'],
  };

  // Keys whose default browser behaviour (page scroll) must be suppressed.
  const PREVENT_DEFAULT = new Set(['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space']);

  /** True when a key event comes from a text box (the leaderboard name field). */
  const isTyping = (e) => /^(INPUT|TEXTAREA)$/.test(e.target?.tagName || '');

  class Input {
    /** @param {EventTarget} target  usually `window`; any EventTarget works (tests pass a stub) */
    constructor(target = globalThis) {
      this.held = new Set();
      this.justPressed = new Set();
      // One-finger drag state, fed by main.js. dx/dy accumulate until the Player uses them.
      this.touch = { active: false, id: null, lastX: 0, lastY: 0, dx: 0, dy: 0 };

      if (target && target.addEventListener) {
        target.addEventListener('keydown', (e) => this.handleKeyDown(e));
        target.addEventListener('keyup', (e) => this.handleKeyUp(e));
        // Losing focus would otherwise leave keys "stuck" down.
        target.addEventListener('blur', () => { this.held.clear(); this.touchEnd(this.touch.id); });
      }
    }

    handleKeyDown(e) {
      if (isTyping(e)) return; // the player is typing a name: leave the keys alone
      if (PREVENT_DEFAULT.has(e.code) && e.preventDefault) e.preventDefault();
      if (!this.held.has(e.code)) this.justPressed.add(e.code); // ignore auto-repeat
      this.held.add(e.code);
    }

    handleKeyUp(e) {
      if (isTyping(e)) return;
      this.held.delete(e.code);
    }

    // ---- touch drag (x, y in canvas coordinates) -----------------------------

    touchStart(id, x, y) {
      if (this.touch.active) return; // ignore extra fingers
      Object.assign(this.touch, { active: true, id, lastX: x, lastY: y, dx: 0, dy: 0 });
    }

    touchMove(id, x, y) {
      const t = this.touch;
      if (!t.active || id !== t.id) return;
      t.dx += x - t.lastX;
      t.dy += y - t.lastY;
      t.lastX = x;
      t.lastY = y;
    }

    touchEnd(id) {
      const t = this.touch;
      if (t.active && id === t.id) Object.assign(t, { active: false, id: null, dx: 0, dy: 0 });
    }

    isDown(action) {
      return KEYMAP[action].some((code) => this.held.has(code));
    }

    wasPressed(action) {
      return KEYMAP[action].some((code) => this.justPressed.has(code));
    }

    endFrame() {
      this.justPressed.clear();
    }
  }
  return { KEYMAP, Input };
})();

const __mod_upgrades = (() => {
  // =============================================================================
  // upgrades.js  -  the "pick 1 of 3" cards you get after every boss.
  // Persistent effects live in a `mods` object shared by MathRules and Player.
  // Instant effects (bombs, repair, heart) are applied through the game.
  // =============================================================================

  const { CONFIG } = __mod_config;

  const DEFAULT_MODS = () => ({
    damage: 1,      // multiplies shot damage
    cooldown: 1,    // multiplies the time between shots (lower = faster)
    loss: 1,        // multiplies every point you lose
    powerTime: 1,   // multiplies power-up duration
    magnet: 0,      // passive pickup-pull radius, in pixels
    graze: 1,       // multiplies the CLOSE CALL reward
  });

  const UPGRADES = [
    { id: 'dmg',    icon: '✦', name: 'POWER SHOTS',  desc: 'Shots hit 25% harder.',               max: 3, apply: (m) => { m.damage *= 1.25; } },
    { id: 'rate',   icon: '≫', name: 'RAPID FIRE',   desc: 'Shoot 18% faster.',                   max: 3, apply: (m) => { m.cooldown *= 0.82; } },
    { id: 'armor',  icon: '▣', name: 'THICK SKIN',   desc: 'Take 12% less score damage.',         max: 3, apply: (m) => { m.loss *= 0.88; } },
    { id: 'power',  icon: 'π', name: 'LONG POWER',   desc: 'Power-ups last 35% longer.',          max: 3, apply: (m) => { m.powerTime *= 1.35; } },
    { id: 'magnet', icon: '◎', name: 'LUCKY MAGNET', desc: 'Pickups drift toward you.',           max: 3, apply: (m) => { m.magnet += 55; } },
    { id: 'graze',  icon: '⚡', name: 'DAREDEVIL',    desc: 'CLOSE CALL bonus is doubled.',        max: 2, apply: (m) => { m.graze *= 2; } },
    { id: 'bombs',  icon: '◉', name: 'BOMB CACHE',   desc: `Refill Prime Bombs to ${CONFIG.maxBombs}.`, max: 99, instant: 'bombs' },
    { id: 'repair', icon: '+', name: 'REPAIR',       desc: 'Gain 40 score right now.',            max: 99, instant: 'repair' },
    { id: 'heart',  icon: '♥', name: 'EXTRA LIFE',   desc: '+1 life (or +60 score if full).',     max: 99, instant: 'heart' },
  ];

  const upgradeById = (id) => UPGRADES.find((u) => u.id === id);

  /** Three different cards the player has not maxed out yet. */
  function pickCards(rng, owned = {}, count = 3) {
    const pool = UPGRADES.filter((u) => (owned[u.id] || 0) < u.max);
    const cards = [];
    while (cards.length < count && pool.length) {
      const i = Math.floor(rng() * pool.length);
      cards.push(pool.splice(i, 1)[0]);
    }
    return cards;
  }

  /** Apply a card. `game` supplies mods, rules, lives, bombs. Returns a short message. */
  function applyUpgrade(game, id) {
    const u = upgradeById(id);
    if (!u) return '';
    game.owned[id] = (game.owned[id] || 0) + 1;
    if (u.apply) { u.apply(game.mods); return u.name; }
    if (u.instant === 'bombs') game.bombs = CONFIG.maxBombs;
    else if (u.instant === 'repair') game.rules.addScore(40);
    else if (u.instant === 'heart') {
      if (game.lives < CONFIG.maxLives) game.lives++;
      else game.rules.addScore(60);
    }
    return u.name;
  }
  return { DEFAULT_MODS, UPGRADES, upgradeById, pickCards, applyUpgrade };
})();

const __mod_mathRules = (() => {
  // =============================================================================
  // mathRules.js  -  the Math Rules Manager.
  //
  // This is the ONLY place that decides how a number changes your running score.
  // Your score IS your health: it hits 0 (or below) -> game over.
  //
  // Each stage applies ITS OWN OPERATION to your score S with the number x you touch:
  //
  //   Addition       S + x   x > 0 raises S, x < 0 lowers S, 0 does nothing
  //   Subtraction    S - x   x > 0 lowers S, x < 0 RAISES S (minus a minus), 0 nothing
  //   Multiplication S x x   x > 1 raises S, a fraction 0<x<1 lowers S,
  //                          x < 0 makes S negative (you die), x = 0 -> S = 0 (you die)
  //   Division       S / x   x > 1 lowers S, a fraction 0<x<1 RAISES S (S / 1/2 = 2S),
  //                          x < 0 makes S negative (you die), x = 0 is undefined: -1 life
  //
  // Token kinds understood here (see entities.js):
  //   'int'       whole-number operand (any sign, including 0)
  //   'frac'      positive fraction num/den (always between 0 and 1)
  //   'subBullet' a "-n" operator fired by enemies/bosses: always S - n
  //
  // Every resolve* method returns a result object:
  //   { delta, label, tone: 'good' | 'bad' | 'neutral', shrink?, lifeLoss?, lethal? }
  // so the Game can show floating text, play sounds and shake the screen.
  // =============================================================================

  const { CONFIG } = __mod_config;
  const { DEFAULT_MODS } = __mod_upgrades;

  const MINUS = '−';

  /** Trial-division primality test (inputs are tiny). Negative numbers use |n|. */
  function isPrime(n) {
    n = Math.abs(Math.trunc(n));
    if (n < 2) return false;
    for (let i = 2; i * i <= n; i++) {
      if (n % i === 0) return false;
    }
    return true;
  }

  /** The plain math: what is S (op) x ? Division by zero returns S unchanged. */
  function applyOp(op, s, x) {
    switch (op) {
      case '+': return s + x;
      case '−': return s - x;
      case '×': return s * x;
      case '÷': return x === 0 ? s : s / x;
      default: return s;
    }
  }

  /**
   * What touching operand x does under an operation:
   *   'up' raises the score, 'down' lowers it, 'none' changes nothing,
   *   'kill' ends the run (score becomes 0 or negative), 'life' costs a life (x / 0).
   */
  function operandEffect(op, x) {
    switch (op) {
      case '+': return x > 0 ? 'up' : x < 0 ? 'down' : 'none';
      case '−': return x > 0 ? 'down' : x < 0 ? 'up' : 'none';
      case '×': return x <= 0 ? 'kill' : x > 1 ? 'up' : x < 1 ? 'down' : 'none';
      case '÷': return x === 0 ? 'life' : x < 0 ? 'kill' : x < 1 ? 'up' : x > 1 ? 'down' : 'none';
      default: return 'none';
    }
  }

  class MathRules {
    /** @param {object} character an entry from CHARACTERS */
    constructor(character) {
      this.character = character;
      this.score = character.startScore;
      this.stageOp = '+';
      this.dangerScale = 1;   // grows every stage: only used for enemy "-n" bullets
      // Seconds remaining for each timed power-up.
      this.fx = { abs: 0, pi: 0, sq: 0 };
      this.mods = DEFAULT_MODS(); // upgrade multipliers (shared with the Player by Game)
    }

    // ---- state queries --------------------------------------------------------

    get absActive() { return this.fx.abs > 0; }
    get magnetActive() { return this.fx.pi > 0; }
    get squareActive() { return this.fx.sq > 0; }

    isDead() { return this.score <= 0; }

    // ---- housekeeping ---------------------------------------------------------

    /** @param {object} stage stage definition   @param {number} stagesCleared 0-based count */
    setStage(stage, stagesCleared = 0) {
      this.stageOp = stage.op;
      this.dangerScale = 1 + CONFIG.dangerPerStage * stagesCleared;
    }

    tick(dt) {
      for (const k of Object.keys(this.fx)) this.fx[k] = Math.max(0, this.fx[k] - dt);
    }

    activatePowerup(kind) {
      this.fx[kind] = CONFIG.powerupDuration[kind] * this.mods.powerTime;
    }

    /** Flat score change (stage bonuses, rewards). */
    addScore(n) { this.score = Math.min(CONFIG.maxScore, this.score + n); }

    // ---- internal helpers -----------------------------------------------------

    /** Incoming enemy "-n" bullet. The Absolute Value Shield turns it into +n. */
    _negative(n) {
      if (this.absActive) {
        this.addScore(n);
        return { delta: n, label: `|${MINUS}${n}|=+${n}`, tone: 'good', absorbed: true };
      }
      // flat n, plus a small share of a big score so bullets still matter late on
      const pct = CONFIG.hazardPercent * Math.min(n, 9) / 9;
      const base = n + Math.ceil(Math.max(0, this.score) * pct);
      const d = Math.max(1, Math.round(base * this.character.lossScale * this.dangerScale * this.mods.loss));
      this.score -= d;
      return { delta: -d, label: `${MINUS}${d}`, tone: 'bad' };
    }

    // ---- public rules ---------------------------------------------------------

    /** The player touched `token`. Applies the stage operation to the score. */
    resolveTouch(token) {
      if (token.kind === 'subBullet') return this._negative(token.value);

      const op = token.op || this.stageOp;
      let x = token.kind === 'frac' ? token.num / token.den : token.value;
      const S = this.score;

      // |x| Absolute Value Shield: use |x| when that is better for you; 0 is nullified.
      if (this.absActive) {
        if (x === 0) return { delta: 0, label: 'NULLIFIED', tone: 'neutral', absorbed: true };
        if (applyOp(op, S, Math.abs(x)) > applyOp(op, S, x)) x = Math.abs(x);
      }

      let eff = operandEffect(op, x);

      // x^2 power-up: a GOOD number is squared (keeping its sign), so it does more.
      if (this.squareActive && eff === 'up') x = Math.sign(x) * x * x;

      if (eff === 'life') {
        return { delta: 0, label: `${token.label}  ERROR`, tone: 'bad', lifeLoss: true };
      }

      let result;
      if (eff === 'kill') {
        result = Math.min(0, Math.round(S * x));      // 0 or negative: the run ends
      } else if (eff === 'none') {
        result = S;
      } else {
        result = Math.round(applyOp(op, S, x));
        if (eff === 'up') result = Math.max(S + 1, result);
        else {
          // a pilot's defense softens every ordinary loss (never a kill)
          const loss = Math.max(1, S - Math.max(1, result));
          result = S - Math.max(1, Math.round(loss * this.character.lossScale * this.mods.loss));
        }
      }
      result = Math.min(CONFIG.maxScore, result);
      this.score = result;
      const delta = result - S;

      if (eff === 'kill') {
        return { delta, label: `${token.label}  DELETED`, tone: 'bad', lethal: true };
      }
      const res = {
        delta,
        label: delta === 0 ? 'NO CHANGE' : `${token.label}  ${delta > 0 ? '+' : MINUS}${Math.abs(delta)}`,
        tone: delta > 0 ? 'good' : delta < 0 ? 'bad' : 'neutral',
        factor: S > 0 ? result / S : 1,
      };
      // Stage 3 and 4: a hit that shrinks your score also shrinks your ship (weaker shots).
      if ((op === '×' || op === '÷') && eff === 'down') res.shrink = Math.max(0.01, result / S);
      return res;
    }

    /** The player shot (or bombed) a hostile token: pay out a flat kill reward. */
    resolveKill(token) {
      const base = token.kind === 'int' ? Math.ceil(Math.abs(token.value) / 2) + 1 : 5;
      this.addScore(base);
      return { delta: base, label: `+${base}`, tone: 'good' };
    }
  }
  return { isPrime, applyOp, operandEffect, MathRules };
})();

  //
  //   Player      the pilot's ship (movement, weapons, shrink effect)
  //   Bullet      player shots and enemy subtraction bullets
  //   Token       falling numbers/operators (pickups AND enemies)

        ctx.fillStyle = 'rgba(40,6,16,0.9)';
        ctx.strokeStyle = COLORS.bad;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(0, 0, this.radius, 0, TAU);
        ctx.fill();
        ctx.stroke();
        ctx.shadowBlur = 0;

  }

  // -----------------------------------------------------------------------------
  // Token: a falling number or operator.
  // -----------------------------------------------------------------------------
  class Token {
    /**
     * spec: { kind, value, num, den, x, y, vy, pattern, amp, freq, vx, hp, shooter }
     * `role` ('good' pickup or 'bad' enemy) and `label` are derived from the kind.
     */
    constructor(spec) {
      this.kind = spec.kind;
      this.value = spec.value ?? 0;
      this.num = spec.num ?? 1;
      this.den = spec.den ?? 1;
      this.x = spec.x;
      this.y = spec.y ?? -30;
      this.vx = spec.vx ?? 0;
      this.vy = spec.vy ?? 90;
      this.pattern = spec.pattern || 'straight'; // 'straight' | 'sine' | 'drift'
      this.amp = spec.amp ?? 0;
      this.freq = spec.freq ?? 0;
      this.hp = spec.hp ?? 1;
      this.shooter = spec.shooter || null; // { interval, volley } -> fires -n bullets
      this.splits = Boolean(spec.splits);  // hostile number that breaks into two smaller ones when shot
      this.orbit = spec.orbit || null;     // { cx, cy, R, ang, w } for the 'orbit' pattern (ring formations)
      this.zdir = spec.zdir || 1;          // 'zigzag' direction
      this.fireTimer = this.shooter ? this.shooter.interval * (0.5 + Math.random() * 0.5) : 0;
      this.t = 0;
      this.flash = 0;
      this.spared = 0;
      this.dead = false;

      // Every token is an OPERAND for its stage's operation (+, −, ×, ÷).
      // Good = the operation RAISES your score. Everything else is an enemy.
      this.op = spec.op || '+';
      const x = this.kind === 'frac' ? this.num / this.den : this.value;
      if (this.kind !== 'int' && this.kind !== 'frac') throw new Error(`Unknown token kind: ${this.kind}`);
      this.effect = operandEffect(this.op, x);   // 'up' | 'down' | 'none' | 'kill' | 'life'
      this.role = this.effect === 'up' ? 'good' : 'bad';
      const operand = this.kind === 'frac' ? `${this.num}/${this.den}` : x < 0 ? `(${MINUS}${Math.abs(x)})` : String(x);
      this.label = `${this.op}${operand}`;
      this.radius = 18;
    }

    update(dt) {
      const prev = this.t;
      this.t += dt;
      if (this.pattern === 'orbit' && this.orbit) {
        // circles around a centre that itself falls down the screen
        const o = this.orbit;
        o.cy += this.vy * dt;
        o.ang += o.w * dt;
        this.x = o.cx + Math.cos(o.ang) * o.R;
        this.y = o.cy + Math.sin(o.ang) * o.R;
        if (this.flash > 0) this.flash -= dt;
        return;
      }
      this.y += this.vy * dt;
      if (this.pattern === 'zigzag') {
        // sharp left-right turns every 0.7 seconds
        this.zdir = Math.floor(this.t / 0.7) % 2 === 0 ? 1 : -1;
        this.x = clamp(this.x + this.zdir * 105 * dt, this.radius, W - this.radius);
      } else if (this.pattern === 'sine') {
        // incremental so the Pi Magnet can nudge x without being overwritten
        this.x += this.amp * (Math.sin(this.t * this.freq) - Math.sin(prev * this.freq));
      } else if (this.pattern === 'drift') {

      if (this.flash > 0) this.flash -= dt;
      if (this.spared > 0) this.spared -= dt;
    }

    /** Returns true on the frame this shooter should fire. */
    tickFire(dt) {
      if (!this.shooter) return false;
      this.fireTimer -= dt;
      if (this.fireTimer <= 0 && this.y > 10 && this.y < H * 0.55) {
        this.fireTimer = this.shooter.interval;
        return true;
      }
      return false;
    }

    draw(ctx) {
      const good = this.role === 'good';
      const color = this.flash > 0 ? '#ffffff' : good ? COLORS.good : COLORS.bad;
      ctx.save();
      ctx.translate(this.x, this.y);

      // Shape + color: pickups are circles, enemies are diamonds (colorblind friendly).
      ctx.shadowColor = color;
      ctx.shadowBlur = 14;
      ctx.lineWidth = 2.5;
      ctx.strokeStyle = color;
      ctx.fillStyle = 'rgba(6,14,30,0.85)';
      ctx.beginPath();
      if (good) {
        ctx.arc(0, 0, this.radius, 0, TAU);
      } else {
        const r = this.radius * 1.3;
        ctx.moveTo(0, -r); ctx.lineTo(r, 0); ctx.lineTo(0, r); ctx.lineTo(-r, 0);
        ctx.closePath();
      }
      ctx.fill();
      ctx.stroke();
      ctx.shadowBlur = 0;

      // Deadly operands (kill / lose a life) get a double outline
      if (!good && (this.effect === 'kill' || this.effect === 'life')) {
        const r2 = this.radius * 1.3 + 6;
        ctx.strokeStyle = this.effect === 'kill' ? '#ffffff' : COLORS.hazard;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, -r2); ctx.lineTo(r2, 0); ctx.lineTo(0, r2); ctx.lineTo(-r2, 0);
        ctx.closePath();
        ctx.stroke();
      }

      // Splitters have a seam: they break in two when shot
      if (this.splits && !good) {
        const r = this.radius * 1.3;
        ctx.strokeStyle = color;
        ctx.lineWidth = 1.5;
        ctx.setLineDash([3, 3]);
        ctx.beginPath();
        ctx.moveTo(0, -r); ctx.lineTo(0, r);
        ctx.stroke();
        ctx.setLineDash([]);
      }

      // Gold ring = "prime, survived the bomb"
      if (this.spared > 0) {
        ctx.strokeStyle = COLORS.gold;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(0, 0, this.radius + 10, 0, TAU);
        ctx.stroke();
      }

      drawText(ctx, this.label, 0, 1, { size: this.label.length > 2 ? 15 : 19, color });

      // HP pips for enemies that take more than one hit
      if (!good && this.hp > 1) {
        const n = Math.ceil(this.hp);
        ctx.fillStyle = color;
        for (let i = 0; i < n; i++) ctx.fillRect(-n * 4 + i * 8 + 1, this.radius + 12, 6, 3);
      }
      ctx.restore();
    }
  }

  // -----------------------------------------------------------------------------
  // PowerUp
  // -----------------------------------------------------------------------------
  const POWERUP_INFO = {
    abs: { glyph: '|x|', color: '#7df9ff', name: 'ABSOLUTE SHIELD' },
    pi: { glyph: 'π', color: '#ffd75e', name: 'PI MAGNET' },
    sq: { glyph: 'x²', color: '#c79bff', name: 'EXPONENT' },
    life: { glyph: '♥', color: '#ff5d8f', name: 'EXTRA LIFE' }, // instant, not timed
  };

  class PowerUp {
    constructor(kind, x) {
      this.kind = kind;
      this.x = x;
      this.y = -30;
      this.vy = 75;
      this.radius = 17;
      this.t = 0;
      this.dead = false;
    }

    update(dt) {
      this.t += dt;
      this.y += this.vy * dt;
      if (this.y > H + 40) this.dead = true;
    }

    draw(ctx) {
      const info = POWERUP_INFO[this.kind];
      ctx.save();
      ctx.translate(this.x, this.y + Math.sin(this.t * 4) * 3);
      ctx.rotate(Math.sin(this.t * 2) * 0.12);
      ctx.shadowColor = info.color;
      ctx.shadowBlur = 18;
      ctx.fillStyle = 'rgba(10,16,34,0.9)';
      ctx.strokeStyle = info.color;
      ctx.lineWidth = 3;
      pathRoundRect(ctx, -20, -20, 40, 40, 10);
      ctx.fill();
      ctx.stroke();
      ctx.shadowBlur = 0;

      else drawText(ctx, info.glyph, 0, 1, { size: 20, color: info.color });
      ctx.restore();
    }
  }

  // -----------------------------------------------------------------------------
  // Obstacle: indestructible hazards that cost a LIFE (not score).
  //   meteor : a spinning orange rock that falls straight down.
  //   wall   : a full-width striped bar with one gap you must fly through.
  // Player shots are absorbed by both. Prime Bombs do not remove them.
  // -----------------------------------------------------------------------------
  class Obstacle {
    /**
     * meteor spec: { kind:'meteor', x, vy, spin, jitter:[9 numbers 0..1] }
     * wall   spec: { kind:'wall', gapX, gapW, vy }
     */
    constructor(spec) {
      this.kind = spec.kind;
      this.vy = spec.vy ?? 120;
      this.t = 0;
      this.dead = false;
      if (this.kind === 'meteor') {
        this.x = spec.x;
        this.y = -40;
        this.radius = CONFIG.obstacles.meteorRadius;
        this.spin = spec.spin ?? 1;

      }
    }

    update(dt) {
      this.t += dt;
      this.y += this.vy * dt;
      if (this.y > H + 60) this.dead = true;
    }

    /** Does a circle (the ship's core, or a bullet) touch this obstacle? */
    touchesCircle(cx, cy, cr) {
      if (this.kind === 'meteor') {
        // slightly forgiving: the hit area is a bit smaller than the drawn rock
        const r = this.radius * 0.85 + cr;
        const dx = cx - this.x;
        const dy = cy - this.y;
        return dx * dx + dy * dy <= r * r;
      }
      const top = this.y - this.h / 2;
      const bottom = this.y + this.h / 2;
      const left = this.gapX - this.gapW / 2;
      const right = this.gapX + this.gapW / 2;
      const nearY = clamp(cy, top, bottom);
      const dy = cy - nearY;
      // two solid bars: [0, left] and [right, W]
      const hitBar = (x0, x1) => {
        const dx = cx - clamp(cx, x0, x1);
        return dx * dx + dy * dy <= cr * cr;
      };
      return hitBar(0, left) || hitBar(right, W);
    }

    draw(ctx) {
      const c = COLORS.hazard;
      if (this.kind === 'meteor') {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.t * this.spin);
        ctx.shadowColor = c;
        ctx.shadowBlur = 16;
        ctx.fillStyle = '#2b1707';
        ctx.strokeStyle = c;
        ctx.lineWidth = 3;
        ctx.beginPath();
        this.pts.forEach(([px, py], i) => (i ? ctx.lineTo(px, py) : ctx.moveTo(px, py)));
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.shadowBlur = 0;
        // cracks
        ctx.strokeStyle = 'rgba(255,159,67,0.55)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(-8, -10); ctx.lineTo(0, 0); ctx.lineTo(9, 7);
        ctx.moveTo(0, 0); ctx.lineTo(-4, 12);
        ctx.stroke();
        ctx.restore();
        drawText(ctx, '!', this.x, this.y + 1, { size: 20, color: c });
        return;
      }

      // wall: two striped bars either side of the gap
      const top = this.y - this.h / 2;
      ctx.shadowColor = c;
      ctx.shadowBlur = 14;
      this._bar(ctx, 0, this.gapX - this.gapW / 2, top);
      this._bar(ctx, this.gapX + this.gapW / 2, W, top);
      ctx.shadowBlur = 0;
    }

    _bar(ctx, x0, x1, top) {
      if (x1 - x0 < 2) return;
      const h = this.h;
      ctx.save();
      ctx.beginPath();
      ctx.rect(x0, top, x1 - x0, h);
      ctx.clip();
      ctx.fillStyle = '#1d1305';
      ctx.fillRect(x0, top, x1 - x0, h);
      ctx.strokeStyle = COLORS.hazard;
      ctx.lineWidth = 7;
      ctx.beginPath();
      const off = (this.t * 30) % 28;
      for (let sx = x0 - h - 28 + off; sx < x1 + 28; sx += 28) {
        ctx.moveTo(sx, top + h);
        ctx.lineTo(sx + h, top);
      }
      ctx.stroke();
      ctx.restore();
      ctx.strokeStyle = '#ffd9a0';
      ctx.lineWidth = 2;
      ctx.strokeRect(x0, top, x1 - x0, h);
    }
  }

  // -----------------------------------------------------------------------------
  // Gate: one of three falling answer boxes for a "MAKE N" puzzle (see gate.js).
  // Which box is right is never shown. Fly through the one equal to the target.
  // -----------------------------------------------------------------------------
  class Gate {
    constructor(o) {
      Object.assign(this, { x: o.x, y: o.y ?? -40, w: o.w, h: o.h, text: o.text, value: o.value, correct: o.correct, setId: o.setId, vy: o.vy });
      this.t = 0;
      this.resolved = ''; // '' | 'right' | 'wrong' | 'gone'
      this.fade = 1;
      this.dead = false;
    }

    update(dt) {
      this.t += dt;
      this.y += this.vy * dt;
      if (this.resolved) this.fade -= dt * 3;
      if (this.y > H + 80 || this.fade <= 0) this.dead = true;
    }

    touchesCircle(cx, cy, cr) {
      const nx = clamp(cx, this.x - this.w / 2, this.x + this.w / 2);
      const ny = clamp(cy, this.y - this.h / 2, this.y + this.h / 2);
      const dx = cx - nx;
      const dy = cy - ny;
      return dx * dx + dy * dy <= cr * cr;
    }

    draw(ctx) {
      const col = this.resolved === 'right' ? COLORS.good : this.resolved === 'wrong' ? COLORS.bad : COLORS.cyan;
      ctx.save();
      ctx.globalAlpha = Math.max(0, this.fade);
      ctx.shadowColor = col;
      ctx.shadowBlur = 16;
      ctx.fillStyle = 'rgba(8,24,52,0.9)';
      ctx.strokeStyle = col;
      ctx.lineWidth = 3;
      pathRoundRect(ctx, this.x - this.w / 2, this.y - this.h / 2, this.w, this.h, 14);
      ctx.fill();
      ctx.stroke();
      ctx.shadowBlur = 0;
      // little "=?" tag so it reads as a question
      drawText(ctx, this.text, this.x, this.y + 1, { size: 26, color: '#ffffff', glow: 6 });
      ctx.restore();
    }
  }

  // -----------------------------------------------------------------------------
  // Ring: an expanding shockwave (bigger explosions).
  // -----------------------------------------------------------------------------
  class Ring {
    constructor(x, y, color, max = 70, speed = 260, width = 4) {
      Object.assign(this, { x, y, color, max, speed, width, r: 6, dead: false });
    }
    update(dt) {
      this.r += this.speed * dt;
      this.speed *= 0.97;
      if (this.r >= this.max) this.dead = true;
    }
    draw(ctx) {
      ctx.globalAlpha = Math.max(0, 1 - this.r / this.max);
      ctx.strokeStyle = this.color;
      ctx.lineWidth = this.width * (1 - this.r / this.max) + 1;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.r, 0, TAU);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }

  // -----------------------------------------------------------------------------
  // Pure visual effects
  // -----------------------------------------------------------------------------
  class Particle {
    constructor(x, y, vx, vy, life, color, size = 3) {
      Object.assign(this, { x, y, vx, vy, life, maxLife: life, color, size, dead: false });
    }
    update(dt) {
      this.x += this.vx * dt;
      this.y += this.vy * dt;
      this.vx *= 0.98;
      this.vy *= 0.98;
      this.life -= dt;
      if (this.life <= 0) this.dead = true;
    }
    draw(ctx) {
      ctx.globalAlpha = Math.max(0, this.life / this.maxLife);
      ctx.fillStyle = this.color;
      ctx.fillRect(this.x - this.size / 2, this.y - this.size / 2, this.size, this.size);
      ctx.globalAlpha = 1;
    }
  }

  class FloatingText {
    constructor(x, y, text, color, size = 18) {
      Object.assign(this, { x, y, text, color, size, life: 0.9, maxLife: 0.9, dead: false });
    }
    update(dt) {
      this.y -= 46 * dt;
      this.life -= dt;
      if (this.life <= 0) this.dead = true;
    }
    draw(ctx) {
      ctx.globalAlpha = Math.max(0, Math.min(1, this.life / (this.maxLife * 0.6)));
      drawText(ctx, this.text, this.x, this.y, { size: this.size, color: this.color, glow: 8 });
      ctx.globalAlpha = 1;
    }
  }

  // -----------------------------------------------------------------------------
  // Player
  // -----------------------------------------------------------------------------
  class Player {
    constructor(character) {
      this.character = character;
      this.x = W / 2;
      this.y = H - 100;
      this.sizeScale = 1; // shrinks when hit by / ÷ fractions: smaller ship = weaker shots
      this.cooldown = 0;
      this.volley = 0;
      this.t = 0;
      this.mods = null;   // shared upgrade multipliers (set by Game)
    }

    /** Tiny core hitbox (shmup convention): hazards must touch the cockpit. */
    get hitRadius() { return 8 * this.sizeScale; }
    /** Pickups are collected with a more generous radius. */
    get collectRadius() { return 20 * this.sizeScale; }

    /** f in (0,1): shrink toward 0.5 + 0.5*f of full size, never below shrinkMin. */
    shrink(f) {
      this.sizeScale = Math.max(CONFIG.shrinkMin, Math.min(this.sizeScale, 0.5 + 0.5 * f));
    }

    update(dt, input) {
      this.t += dt;
      let dx = (input.isDown('right') ? 1 : 0) - (input.isDown('left') ? 1 : 0);
      let dy = (input.isDown('down') ? 1 : 0) - (input.isDown('up') ? 1 : 0);
      if (dx && dy) { dx *= Math.SQRT1_2; dy *= Math.SQRT1_2; } // no diagonal speed boost

      const speed = this.character.speed;
      this.x = clamp(this.x + dx * speed * dt, 22, W - 22);
      this.y = clamp(this.y + dy * speed * dt, 80, H - 34);

      // Touch drag: the ship follows the finger's movement (relative, 1.3x).
      const tc = input.touch;
      if (tc && tc.active) {
        this.x = clamp(this.x + tc.dx * CONFIG.touch.dragSensitivity, 22, W - 22);
        this.y = clamp(this.y + tc.dy * CONFIG.touch.dragSensitivity, 80, H - 34);
        tc.dx = 0;
        tc.dy = 0;
      }

      this.cooldown = Math.max(0, this.cooldown - dt);
      this.sizeScale = Math.min(1, this.sizeScale + CONFIG.shrinkRecoverPerSec * dt);
    }

    /**
     * Try to fire. Returns an array of Bullets, or null while on cooldown.
     *   single: one centered shot.
     *   burst : twin shots, and every Nth volley a 5-way fan with bonus damage.
     */
    tryFire() {
      if (this.cooldown > 0) return null;

      this.cooldown = c.fireCooldown * (this.mods?.cooldown ?? 1);

      const dmg = c.damage * this.sizeScale * (this.mods?.damage ?? 1); // a shrunken ship hits weaker

        x, y: this.y - 20, owner: 'player', damage: d, color,
        vx: Math.sin(angle) * 640, vy: -Math.cos(angle) * 640,
      });

      if (c.weapon === 'single') {
        return [make(this.x, 0, dmg, c.color)];
      }
      if (this.volley % c.burstEvery === 0) {
        const d = dmg * c.burstDamageMult;
        return [-0.3, -0.15, 0, 0.15, 0.3].map((a) => make(this.x, a, d, '#ffffff'));
      }
      return [make(this.x - 8, 0, dmg, c.color), make(this.x + 8, 0, dmg, c.color)];
    }

    draw(ctx) {
      drawShip(ctx, this.character, this.x, this.y, this.sizeScale, this.t);
    }
  }
  return { MINUS, TIMES, DIVIDE, COLORS, Bullet, Token, POWERUP_INFO, PowerUp, Obstacle, Gate, Ring, Particle, FloatingText, Player };

const __mod_spawner = (() => {
  // =============================================================================
  // spawner.js  -  decides WHAT falls from the top and WHEN.
  //
  // Instead of alien sprites, the "enemies" are numbers and operators picked from
  // the current stage's weighted table (stages.js).
  // =============================================================================

  const { Token, PowerUp, Obstacle, Gate } = __mod_entities;
  const { operandEffect } = __mod_mathRules;
  const { makeGate } = __mod_gate;

  const W = CONFIG.width;
  const TAU = Math.PI * 2;

    /** @param {() => number} rng  injectable random source (tests pass a seeded one) */
    constructor(rng = Math.random) {
      this.rng = rng;
      this.reset();
    }

    reset() {
      this.timer = 0.9;
      this.powerTimer = this._nextPowerTime();
      this.obstacleTimer = 7;   // grace period before the first rock or wall
      this.lifeTimer = this._nextLifeTime();
      this.gateSeq = 0;
      this.onStageStart();
    }

    /** Called at the start of every stage: formations and gates come a little later. */
    onStageStart() {
      this.formationTimer = CONFIG.formations.first;
      this.gateTimer = CONFIG.gates.first;
    }

    _nextLifeTime() {
      const [lo, hi] = CONFIG.lifePickupInterval;
      return lo + (hi - lo) * this.rng();
    }

    _nextPowerTime() {
      const [lo, hi] = CONFIG.powerupInterval;
      return lo + (hi - lo) * this.rng();
    }

     * Called every frame.
     * @param {object} stage   current stage definition
     * @param {object} ctx     { intensity: 0..1 progress through the stage, difficulty: >= 1, playerX, lives }
     * @param {Token[]} tokens     output list for new tokens
     * @param {PowerUp[]} powerups output list for new power-ups
     * @param {Obstacle[]} obstacles output list for new rocks and walls
     */
    update(dt, stage, ctx, tokens, powerups, obstacles = [], gates = []) {
      const hold = Boolean(ctx.hold); // true during a boss fight: only power-ups and hearts drop

      // --- tokens: spawn faster as the stage progresses and as loops increase ---
      if (!hold) {
        this.timer -= dt;
        if (this.timer <= 0) {
          const interval = (stage.spawnInterval / ctx.difficulty) * (1 - 0.35 * ctx.intensity);
          this.timer = interval * (0.7 + 0.6 * this.rng());
          tokens.push(this._makeToken(this._pick(stage.table), stage, ctx.difficulty, ctx.playerX));
        }
      }

      // --- power-ups: rare, on their own timer ---------------------------------
      this.powerTimer -= dt;
      if (this.powerTimer <= 0) {
        this.powerTimer = this._nextPowerTime();
        const kinds = ['abs', 'pi', 'sq'];
        const kind = kinds[Math.floor(this.rng() * kinds.length)];
        powerups.push(new PowerUp(kind, 40 + this.rng() * (W - 80)));
      }

      // --- obstacles: orange rocks and walls that cost a life ------------------
      if (stage.obstacles && !hold) {
        this.obstacleTimer -= dt;
        if (this.obstacleTimer <= 0) {
          const [lo, hi] = stage.obstacles.interval;
          this.obstacleTimer = (lo + (hi - lo) * this.rng()) / ctx.difficulty;
          obstacles.push(this._makeObstacle(stage, ctx));
        }
      }

      // --- formations: V, row and ring waves -----------------------------------
      if (!hold) {
        this.formationTimer -= dt;
        if (this.formationTimer <= 0) {
          const [lo, hi] = CONFIG.formations.interval;
          this.formationTimer = (lo + (hi - lo) * this.rng()) / ctx.difficulty;
          if (ctx.intensity < 0.92) this._formation(stage, ctx, tokens);
        }

        // --- "MAKE N" gates: one puzzle at a time, never at the very end ------

        const cx = r(140, W - 140);
        const vy = 64 * speedUp;
        tokens.push(tok(this._operandOf(stage, 'up'), { x: cx, y: -60, vy }));
        const w = (this.rng() < 0.5 ? -1 : 1) * 1.7;

      }

      const aimed = ctx.playerX !== undefined && this.rng() < 0.6;

    _entriesOf(stage, effect) {
      return stage.table.filter((e) => {

const __mod_leaderboard = (() => {
  // =============================================================================
  // leaderboard.js  -  high-score table. No drawing code, so it is easy to test.
  //
  // TWO boards:
  //   * THIS DEVICE : always on. Saved in the browser's localStorage (top 10).
  //   * WORLD       : optional. Turns on when CONFIG.leaderboard.onlineUrl is set
  //                   to a Firebase Realtime Database URL (see README, "Online
  //                   leaderboard"). GitHub Pages can only host static files, so a
  //                   shared board needs an outside database like this one.
  //
  // A score row looks like: { name, score, pilot, stage, t }   (t = timestamp)
  // =============================================================================

  const { CONFIG } = __mod_config;

  /** Make a player-typed name safe and short. Empty names become PLAYER. */
  function cleanName(raw) {
    let s = String(raw ?? '')
      .replace(/[\u0000-\u001f\u007f<>]/g, '') // control characters and angle brackets
      .replace(/\s+/g, ' ')
      .trim();
    s = Array.from(s).slice(0, CONFIG.leaderboard.nameMax).join('');
    return s || 'PLAYER';
  }

  /** Only https:// URLs are accepted; a trailing slash or ".json" is removed. */
  function normalizeUrl(u) {
    const s = String(u ?? '').trim().replace(/\.json$/i, '').replace(/\/+$/, '');
    return /^https:\/\/[^\s]+$/i.test(s) ? s : '';
  }

  function safeStorage() {
    try { return globalThis.localStorage ?? null; } catch { return null; }
  }

  const isRow = (r) => r && typeof r.name === 'string' && Number.isFinite(r.score);
  const byScoreDesc = (a, b) => b.score - a.score || (a.t || 0) - (b.t || 0); // ties: older first
  const tidy = (r) => ({
    name: cleanName(r.name),
    score: Math.round(r.score),
    pilot: typeof r.pilot === 'string' ? r.pilot : '',
    stage: Number.isFinite(r.stage) ? r.stage : 1,
    t: Number.isFinite(r.t) ? r.t : 0,
  });

  class Leaderboard {
    /**
     * @param {{storage?: Storage|null, key?: string, size?: number,
     *          onlineUrl?: string, fetchFn?: Function}} opts   (all optional; tests inject fakes)
     */
    constructor(opts = {}) {
      this.storage = opts.storage !== undefined ? opts.storage : safeStorage();
      this.key = opts.key || CONFIG.leaderboard.storageKey;
      this.size = opts.size || CONFIG.leaderboard.size;
      this.onlineUrl = normalizeUrl(opts.onlineUrl ?? CONFIG.leaderboard.onlineUrl);
      this.fetchFn = opts.fetchFn || (typeof fetch === 'function' ? fetch.bind(globalThis) : null);
      this.memory = []; // fallback when localStorage is blocked (private mode, etc.)
    }

    /** True when the WORLD board is configured and the browser can reach it. */
    get online() { return Boolean(this.onlineUrl && this.fetchFn); }

    // ---- this device ----------------------------------------------------------

    rows() {
      let list = this.memory;
      if (this.storage) {
        try {
          const parsed = JSON.parse(this.storage.getItem(this.key) || '[]');
          if (Array.isArray(parsed)) list = parsed;
        } catch { /* corrupted data: start fresh */ }
      }
      return list.filter(isRow).map(tidy).sort(byScoreDesc).slice(0, this.size);
    }

    /** Would this score earn a place in the top list? */
    qualifies(score) {
      score = Math.round(score);
      if (!(score > 0)) return false;
      const rows = this.rows();
      return rows.length < this.size || score > rows[rows.length - 1].score;
    }

    /**
     * Save a score. Returns the saved row plus `rank` (1 = best, 0 = it did not
     * make the top list).
     */
    add(entry) {
      const row = tidy({ ...entry, t: entry.t ?? Date.now() });
      const rows = this.rows();
      // Insert below existing rows with an equal score (earlier score keeps its place)
      let idx = rows.findIndex((r) => row.score > r.score);
      if (idx === -1) idx = rows.length;
      rows.splice(idx, 0, row);
      const kept = rows.slice(0, this.size);
      this._write(kept);
      return { ...row, rank: idx < this.size ? idx + 1 : 0 };
    }

    _write(rows) {
      this.memory = rows;
      if (!this.storage) return;
      try { this.storage.setItem(this.key, JSON.stringify(rows)); } catch { /* storage full or blocked */ }
    }

    /** The last name this player typed (to pre-fill the box next time). */
    get lastName() {
      try { return this.storage?.getItem(`${this.key}.name`) || ''; } catch { return ''; }
    }

    set lastName(name) {
      try { this.storage?.setItem(`${this.key}.name`, name); } catch { /* ignore */ }
    }

    // ---- world (optional) -----------------------------------------------------

    /** Send one score to the online board. Resolves true/false, never throws. */
    async submitOnline(entry) {
      if (!this.online) return false;
      const body = JSON.stringify(tidy(entry));
      try {
        const res = await this.fetchFn(`${this.onlineUrl}/scores.json`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body,
        });
        return Boolean(res && res.ok);
      } catch {
        return false;
      }
    }

    /** Top scores from the online board. Resolves an array, or null if unreachable. */
    async fetchOnline() {
      if (!this.online) return null;
      try {
        // Firebase REST: ask for the highest `score` values (needs ".indexOn": "score")
        const query = `orderBy=${encodeURIComponent('"score"')}&limitToLast=${this.size}`;
        const res = await this.fetchFn(`${this.onlineUrl}/scores.json?${query}`);
        if (!res || !res.ok) return null;
        const data = await res.json();
        if (!data || typeof data !== 'object') return [];
        return Object.values(data).filter(isRow).map(tidy).sort(byScoreDesc).slice(0, this.size);
      } catch {
        return null;
      }
    }
  }
  return { cleanName, normalizeUrl, Leaderboard };
})();

/* ======================= FILE: ranked.js ======================= */
const __mod_ranked = (() => {
  // =============================================================================
  // ranked.js  -  Ranked mode: weekly seasons, tiers and the one-row-per-name board.
  //
  //   * A SEASON is one ISO week (Monday to Sunday). Everybody in a season gets the
  //     same seed, so the enemy sequence is the same for every player.
  //   * A TIER is decided by your best score this season.
  //   * The RANKED BOARD has ONE row per player NAME (typed by the player): their best
  //     score of the season. It is saved on this phone, and optionally on the world board.
  // =============================================================================

  const { hash53 } = __mod_rng;
  const { cleanName, normalizeUrl } = __mod_leaderboard;

  /** '2026-W43' for the ISO week containing `date`. */
  function seasonId(date = new Date()) {
    const d = new Date(Date.UTC(date.getUTCFullYear(), date.getUTCMonth(), date.getUTCDate()));
    const day = d.getUTCDay() || 7;                 // Monday = 1 ... Sunday = 7
    d.setUTCDate(d.getUTCDate() + 4 - day);         // move to the Thursday of this week
    const yearStart = Date.UTC(d.getUTCFullYear(), 0, 1);
    const week = Math.ceil(((d - yearStart) / 86400000 + 1) / 7);
    return `${d.getUTCFullYear()}-W${String(week).padStart(2, '0')}`;
  }

  function seasonSeed(id) {
    return parseInt(hash53(`season:${id}`).slice(-8), 16) | 0;
  }

  function tierFor(score) {
    const tiers = CONFIG.ranked.tiers;
    let t = tiers[0];
    for (const x of tiers) if (score >= x.min) t = x;
    return t;
  }

  /** The next tier above `score` (or null at the top) - for the "N to go" hint. */
  function nextTier(score) {
    return CONFIG.ranked.tiers.find((t) => t.min > score) || null;
  }

  function safeStorage() {
    try { return globalThis.localStorage ?? null; } catch { return null; }
  }

  const isRow = (r) => r && typeof r.name === 'string' && Number.isFinite(r.score);
  const nameKey = (n) => cleanName(n).toLowerCase();
  const byScore = (a, b) => b.score - a.score || (a.t || 0) - (b.t || 0);
  const tidy = (r) => ({
    name: cleanName(r.name),
    score: Math.round(r.score),
    pilot: typeof r.pilot === 'string' ? r.pilot : '',
    stage: Number.isFinite(r.stage) ? r.stage : 1,
    t: Number.isFinite(r.t) ? r.t : 0,
  });

  class RankedBoard {
    /** @param {{storage?, onlineUrl?, fetchFn?, now?: () => Date}} opts  (tests inject fakes) */
    constructor(opts = {}) {
      this.storage = opts.storage !== undefined ? opts.storage : safeStorage();
      this.key = opts.key || CONFIG.ranked.storageKey;
      this.size = opts.size || CONFIG.ranked.size;
      this.onlineUrl = normalizeUrl(opts.onlineUrl ?? CONFIG.leaderboard.onlineUrl);
      this.fetchFn = opts.fetchFn || (typeof fetch === 'function' ? fetch.bind(globalThis) : null);
      this.now = opts.now || (() => new Date());
      this.memory = {};
    }

    get season() { return seasonId(this.now()); }
    get online() { return Boolean(this.onlineUrl && this.fetchFn); }

    _load() {
      if (this.storage) {
        try {
          const o = JSON.parse(this.storage.getItem(this.key) || '{}');
          if (o && typeof o === 'object' && !Array.isArray(o)) return o;
        } catch { /* corrupted: start fresh */ }
        return {};
      }
      return this.memory;
    }

    _save(data) {
      this.memory = data;
      if (!this.storage) return;
      try { this.storage.setItem(this.key, JSON.stringify(data)); } catch { /* full or blocked */ }
    }

    /** This season's rows on this phone: ONE per name, best first. */
    localRows(season = this.season) {
      const bucket = this._load()[season] || {};
      return Object.entries(bucket)
        .filter(([, r]) => isRow(r))
        .map(([key, r]) => ({ key, ...tidy(r) }))
        .sort(byScore)
        .slice(0, this.size);

      return this._load()[season]?.[nameKey(name)]?.score || 0;

        if (!data || typeof data !== 'object') return [];
        const best = new Map();
        for (const r of Object.values(data).filter(isRow).map(tidy).sort(byScore)) {
          const k = nameKey(r.name);
          if (!best.has(k)) best.set(k, { key: k, ...r });
        }
        return [...best.values()].slice(0, this.size);
      } catch { return null; }
    }
  }
  return { seasonId, seasonSeed, tierFor, nextTier, nameKey, RankedBoard };
})();

/* ======================= FILE: combo.js ======================= */
const __mod_combo = (() => {
  // =============================================================================
  // combo.js  -  chain counter. Kills and pickups within `window` seconds of each
  // other build a combo; every `milestone` hits pays a flat bonus. Taking damage
  // breaks the chain. Bonuses are flat (not multiplied) so they cannot snowball.
  // =============================================================================

  const { CONFIG } = __mod_config;

  class Combo {
    constructor(cfg = CONFIG.combo) {
      this.cfg = cfg;
      this.count = 0;
      this.timer = 0;
      this.best = 0;
    }

    /** One more hit. Returns a flat score bonus (0 unless a milestone was reached). */
    add() {
      this.count++;
      this.timer = this.cfg.window;
      this.best = Math.max(this.best, this.count);
      if (this.count % this.cfg.milestone === 0) {
        return Math.min(this.cfg.maxBonus, this.cfg.bonus * (this.count / this.cfg.milestone));
      }
      return 0;
    }

    tick(dt) {
      if (this.count === 0) return;
      this.timer -= dt;
      if (this.timer <= 0) this.count = 0;
    }

    /** Damage taken: the chain is lost. Returns the count that was lost. */
    reset() {
      const lost = this.count;
      this.count = 0;
      this.timer = 0;
      return lost;
    }
  }
  return { Combo };
})();

/* ======================= FILE: boss.js ======================= */
const __mod_boss = (() => {
  // =============================================================================
  // boss.js  -  one giant number at the end of every stage.
  // You beat a boss by shooting its number down to 0. It only describes WHAT to
  // fire (bullet specs); game.js turns those into real bullets and tokens.
  // =============================================================================

  const { CONFIG } = __mod_config;
  const { drawText } = __mod_draw;

  const W = CONFIG.width;
  const TAU = Math.PI * 2;
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

  /**
   * Attack types:
   *   fan    n bullets aimed at the player        { n, spread }
   *   ring   n bullets in all directions          { n }
   *   spiral a rotating stream for `dur` seconds  { dur }
   *   rain   n bullets dropping from the top      { n }
   *   summon spawn n hostile tokens               { n, kind }
   */
  const BOSSES = [
    {
      name: 'THE SUM', glyph: 'Σ', hue: 200, hp: 45, value: 3, reward: 80,
      attacks: [{ type: 'fan', every: 2.0, n: 3, spread: 0.3 }],
      phase2: [{ type: 'ring', every: 3.4, n: 10 }],
    },
    {
      name: 'THE DIFFERENCE', glyph: '−', hue: 285, hp: 65, value: 4, reward: 120,
      attacks: [{ type: 'fan', every: 1.9, n: 5, spread: 0.24 }],
      phase2: [{ type: 'spiral', every: 5.5, dur: 2.2 }],
    },
    {
      name: 'THE PRODUCT', glyph: '×', hue: 40, hp: 90, value: 4, reward: 160,
      attacks: [{ type: 'summon', every: 3.8, n: 2, kind: 'zero' }, { type: 'fan', every: 2.2, n: 3, spread: 0.3 }],
      phase2: [{ type: 'ring', every: 3.2, n: 12 }],
    },
    {
      name: 'THE QUOTIENT', glyph: '÷', hue: 340, hp: 120, value: 5, reward: 220,
      attacks: [{ type: 'fan', every: 2.0, n: 5, spread: 0.22 }, { type: 'rain', every: 3.0, n: 6 }],
      phase2: [{ type: 'spiral', every: 6, dur: 2.4 }, { type: 'ring', every: 4, n: 14 }],
    },
  ];

  class Boss {
    /**
     * @param {object} def   an entry of BOSSES
     * @param {{difficulty?:number, stagesCleared?:number, rng?:()=>number}} o
     */
    constructor(def, o = {}) {
      this.def = def;
      this.rng = o.rng || Math.random;
      const diff = o.difficulty || 1;
      this.maxHp = Math.round(def.hp * (1 + 0.3 * (diff - 1)));
      this.hp = this.maxHp;
      this.value = def.value + Math.floor((o.stagesCleared || 0) / 2);
      this.speedMul = 1 + 0.12 * (diff - 1);
      this.x = W / 2;
      this.y = -90;
      this.homeY = 150;
      this.radius = 44;
      this.t = 0;
      this.state = 'enter';       // 'enter' (cannot be hurt) -> 'fight'
      this.fightTime = 0;
      this.flash = 0;
      this.dead = false;
      this.phase = 1;
      this.timers = def.attacks.map((a) => a.every * 0.7);
      this.timers2 = def.phase2.map((a) => a.every * 0.5);
      this.spiral = null;
    }

    get label() { return Math.ceil(this.hp); }
    get hurtable() { return this.state === 'fight'; }
    get ratio() { return clamp(this.hp / this.maxHp, 0, 1); }

    /** Returns true if this hit killed the boss. */
    hit(dmg) {
      if (!this.hurtable || this.dead) return false;
      this.hp -= dmg;
      this.flash = 0.07;
      if (this.hp <= 0) { this.hp = 0; this.dead = true; return true; }
      if (this.phase === 1 && this.hp <= this.maxHp * 0.5) this.phase = 2;
      return false;
    }

    /** Advance time. Returns a list of actions: { type:'bullets', list } | { type:'summon', n, kind }. */
    update(dt, player) {
      const actions = [];
      this.t += dt;
      if (this.flash > 0) this.flash -= dt;

      if (this.state === 'enter') {
        this.y += (this.homeY - this.y) * Math.min(1, dt * 2.2);
        if (this.homeY - this.y < 4) { this.y = this.homeY; this.state = 'fight'; }
        return actions;
      }
      this.fightTime += dt;
      const amp = Math.min(150, W / 2 - this.radius - 10);
      this.x = W / 2 + Math.sin(this.t * 0.9 * this.speedMul) * amp;
      this.y = this.homeY + Math.sin(this.t * 1.7) * 14;

      const rate = (this.phase === 2 ? 1.25 : 1) * this.speedMul;
      this.def.attacks.forEach((a, i) => { this.timers[i] -= dt * rate; if (this.timers[i] <= 0) { this.timers[i] = a.every; this._fire(a, player, actions); } });
      if (this.phase === 2) {
        this.def.phase2.forEach((a, i) => { this.timers2[i] -= dt * rate; if (this.timers2[i] <= 0) { this.timers2[i] = a.every; this._fire(a, player, actions); } });
      }

      if (this.spiral) {
        const s = this.spiral;
        s.t -= dt;
        s.acc += dt;
        const list = [];
        while (s.acc >= 0.11) {
          s.acc -= 0.11;
          s.ang += 0.5;
          for (const k of [0, Math.PI]) list.push(this._bullet(s.ang + k, 150));
        }
        if (list.length) actions.push({ type: 'bullets', list });
        if (s.t <= 0) this.spiral = null;
      }
      return actions;
    }

    _bullet(angle, speed) {
      return { x: this.x, y: this.y + 20, vx: Math.sin(angle) * speed, vy: Math.cos(angle) * speed, value: this.value };
    }

    _fire(a, player, actions) {
      const speed = 165 * (0.9 + 0.1 * this.speedMul);
      switch (a.type) {
        case 'fan': {
          const aim = Math.atan2(player.x - this.x, player.y - this.y);
          const list = [];
          for (let i = 0; i < a.n; i++) list.push(this._bullet(aim + (i - (a.n - 1) / 2) * a.spread, speed));
          actions.push({ type: 'bullets', list });
          break;
        }
        case 'ring': {
          const off = this.rng() * TAU;
          const list = [];
          for (let i = 0; i < a.n; i++) list.push(this._bullet(off + (i / a.n) * TAU, 135));
          actions.push({ type: 'bullets', list });
          break;
        }
        case 'spiral':
          this.spiral = { t: a.dur, acc: 0, ang: this.rng() * TAU };
          break;
        case 'rain': {
          const list = [];
          for (let i = 0; i < a.n; i++) {
            list.push({ x: 30 + this.rng() * (W - 60), y: 70, vx: 0, vy: 175 + this.rng() * 40, value: this.value });
          }
          actions.push({ type: 'bullets', list });
          break;
        }
        case 'summon':
          actions.push({ type: 'summon', n: a.n, kind: a.kind });
          break;
      }
    }

    draw(ctx) {
      const d = this.def;
      const hue = d.hue;
      const col = this.flash > 0 ? '#ffffff' : `hsl(${hue},95%,62%)`;
      ctx.save();
      ctx.translate(this.x, this.y);
      if (this.state === 'enter') ctx.globalAlpha = 0.6;

      // giant faint glyph behind the body
      drawText(ctx, d.glyph, 0, 4, { size: 130, color: `hsla(${hue},90%,60%,0.16)` });

      // hexagon body
      ctx.shadowColor = col;
      ctx.shadowBlur = 24;
      ctx.fillStyle = 'rgba(8,12,30,0.92)';
      ctx.strokeStyle = col;
      ctx.lineWidth = 4;
      ctx.beginPath();
      for (let i = 0; i < 6; i++) {
        const a = (i / 6) * TAU + this.t * 0.4;
        const r = this.radius + (this.phase === 2 ? 4 * Math.sin(this.t * 9) : 0);
        i ? ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r) : ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r);
      }
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.shadowBlur = 0;

      // inner ring (a second ring appears in phase 2)
      ctx.lineWidth = 2;
      ctx.strokeStyle = `hsla(${hue},90%,70%,0.6)`;
      ctx.beginPath();
      ctx.arc(0, 0, this.radius * 0.72, 0, TAU);
      ctx.stroke();

      drawText(ctx, String(this.label), 0, 2, { size: this.label > 99 ? 28 : 34, color: '#ffffff', glow: 8 });
      ctx.restore();
    }
  }
  return { BOSSES, Boss };
})();

/* ======================= FILE: inapp.js ======================= */
const __mod_inapp = (() => {
  // =============================================================================
  // inapp.js  -  detect "in-app browsers" (the mini browser inside Messenger,
  // Facebook, Instagram ...). When someone taps a link in Messenger, the game
  // opens in that mini browser, where sound, fullscreen and saved scores can be
  // unreliable. main.js shows a "open in your browser" prompt when this matches.
  // No DOM code here, so it is easy to test.
  // =============================================================================

  // Order matters: Messenger's user-agent also contains Facebook markers.
  const IN_APP_BROWSERS = [
    ['Messenger', /FB_IAB\/MESSENGER|MessengerForiOS|MessengerLite|Orca-Android|\bMESSENGER\b/i],
    ['Facebook', /FBAN|FBAV|FB_IAB|FBIOS/i],
    ['Instagram', /Instagram/i],
    ['TikTok', /musical_ly|BytedanceWebview|TikTok/i],
    ['Snapchat', /Snapchat/i],
    ['LINE', /\bLine\//i],
    ['WeChat', /MicroMessenger/i],
    ['Viber', /Viber/i],
  ];

  /** Returns the app's name (for example "Messenger"), or null for a normal browser. */
  function detectInAppBrowser(ua = '') {
    for (const [name, re] of IN_APP_BROWSERS) {
      if (re.test(ua)) return name;
    }
    return null;
  }

  /** 'android' | 'ios' | 'other' */
  function detectPlatform(ua = '') {
    if (/android/i.test(ua)) return 'android';
    if (/iphone|ipad|ipod/i.test(ua)) return 'ios';
    return 'other';
  }

  /**
   * Android only: a link that asks the phone to open this page in Chrome.
   * `loc` is window.location (or any object with protocol, host, pathname, search).
   */
  function chromeIntentUrl(loc) {
    const scheme = String(loc.protocol || 'https:').replace(':', '');
    return `intent://${loc.host}${loc.pathname}${loc.search || ''}#Intent;scheme=${scheme};package=com.android.chrome;end`;
  }

  /** Plain-language steps for the prompt. */
  function inAppHelp(platform) {
    if (platform === 'ios') return 'Tap the ••• or share button, then choose "Open in Safari".';
    if (platform === 'android') return 'Tap the ⋮ menu (top right), then choose "Open in Chrome" or "Open in browser".';
    return 'Open this link in your phone’s normal browser (Chrome or Safari).';
  }
  return { detectInAppBrowser, detectPlatform, chromeIntentUrl, inAppHelp };
})();
