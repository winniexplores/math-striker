const __mod_ui = (() => {
  // =============================================================================
  // ui.js  -  HUD, menu and overlay screens. Pure drawing, no game logic.
  // Each function receives the 2D context and the Game to read state from.
  // =============================================================================

  const { CONFIG, CHARACTERS } = __mod_config;
  const { STAGES } = __mod_stages;
  const { drawText, drawShip, drawHeart, pathRoundRect } = __mod_draw;
  const { POWERUP_INFO, COLORS } = __mod_entities;
  const { tierFor, nextTier } = __mod_ranked;

  const W = CONFIG.width;
  const H = CONFIG.height;
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

  /** A tappable rounded button. Returns its rect so the caller can register it. */
  function drawButton(ctx, rect, label, color = '#4dd2ff') {
    ctx.fillStyle = 'rgba(10,20,44,0.88)';
    ctx.strokeStyle = color;
    ctx.lineWidth = 2.5;
    ctx.shadowColor = color;
    ctx.shadowBlur = 10;
    pathRoundRect(ctx, rect.x, rect.y, rect.w, rect.h, 12);
    ctx.fill();
    ctx.stroke();
    ctx.shadowBlur = 0;
    drawText(ctx, label, rect.x + rect.w / 2, rect.y + rect.h / 2 + 1, { size: 17, color });
    return rect;
  }

  /** A little speaker icon: waves when sound is on, a cross when it is muted. */
  function drawSpeaker(ctx, cx, cy, on, color) {
    ctx.fillStyle = color;
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(cx - 9, cy - 4); ctx.lineTo(cx - 4, cy - 4); ctx.lineTo(cx + 2, cy - 9);
    ctx.lineTo(cx + 2, cy + 9); ctx.lineTo(cx - 4, cy + 4); ctx.lineTo(cx - 9, cy + 4);
    ctx.closePath();
    ctx.fill();
    if (on) {
      ctx.beginPath(); ctx.arc(cx + 3, cy, 6, -0.9, 0.9); ctx.stroke();
      ctx.beginPath(); ctx.arc(cx + 3, cy, 11, -0.9, 0.9); ctx.stroke();
    } else {
      ctx.beginPath();
      ctx.moveTo(cx + 6, cy - 6); ctx.lineTo(cx + 14, cy + 6);
      ctx.moveTo(cx + 14, cy - 6); ctx.lineTo(cx + 6, cy + 6);
      ctx.stroke();

  }

  // -----------------------------------------------------------------------------
  // In-game HUD
  // -----------------------------------------------------------------------------

    const r = game.rules;

    // Top panel

    const prog = clamp(game.stageTime / CONFIG.stageDuration, 0, 1);

    }

    drawText(ctx, 'Your SCORE is your health. Beat a boss to level up.', W / 2, 670, { size: 12, color: COLORS.gold, weight: 'normal' });

  // -----------------------------------------------------------------------------

  // -----------------------------------------------------------------------------

  /** "Pick 1 of 3" upgrade cards after a boss. */
  function drawUpgrade(ctx, game) {
    ctx.fillStyle = 'rgba(2,6,16,0.82)';

    drawText(ctx, 'BOSS DEFEATED', W / 2, 92, { size: 30, color: COLORS.gold, glow: 16 });

      ctx.translate(rect.x + rect.w / 2, rect.y + rect.h / 2);
      ctx.scale(wobble, wobble);

      drawText(ctx, card.name, rect.x + 110, rect.y + 40, { size: 22, align: 'left', color: '#ffffff' });
      drawText(ctx, card.desc, rect.x + 110, rect.y + 74, { size: 13, align: 'left', color: '#b9c9e6', weight: 'normal' });
      const have = game.owned[card.id] || 0;
      if (have > 0 && card.max < 99) {
        drawText(ctx, `LEVEL ${have} → ${have + 1}`, rect.x + rect.w - 16, rect.y + 20, { size: 11, align: 'right', color: col });
      }
      ctx.restore();
      game.upgradeRects.push(rect);
    });
    drawText(ctx, 'tap a card', W / 2, 588, { size: 13, color: '#9fb6d8', weight: 'normal' });
  }

  function drawGameOver(ctx, game) {
    ctx.fillStyle = 'rgba(2,6,16,0.84)';
    ctx.fillRect(0, 0, W, H);
    const ranked = game.mode === 'ranked';

    if (game.deathReason === 'lives') {
      drawText(ctx, 'OUT OF LIVES', W / 2, 150, { size: 20, color: COLORS.hazard });
      for (let i = 0; i < CONFIG.maxLives; i++) drawHeart(ctx, W / 2 + (i - 1) * 30, 186, 8, COLORS.heart, false);
    } else {
      drawText(ctx, 'SCORE = 0', W / 2, 165, { size: 20, color: COLORS.bad });
    }
    drawText(ctx, 'GAME OVER', W / 2, 232, { size: 46, color: COLORS.bad, glow: 20 });

    drawText(ctx, ranked ? `RANKED RUN  ·  ${game.season}` : 'BEST SCORE REACHED', W / 2, 288, { size: 12, color: ranked ? COLORS.gold : '#8fb3d9' });
    drawText(ctx, String(Math.round(game.peakScore)), W / 2, 326, { size: 38, color: '#ffffff', glow: 10 });

    const mins = Math.floor(game.runTime / 60);
    const secs = Math.floor(game.runTime % 60).toString().padStart(2, '0');

    if (ranked) {
      const r = game.rankedResult;
      if (!r) {
        drawText(ctx, game.nameEntry ? 'Type your name…' : 'Score not saved (no name entered).', W / 2, 372, { size: 14, color: '#9fb6d8' });
      } else {
        drawText(ctx, r.tier.name, W / 2, 368, { size: 26, color: r.tier.color, glow: 14 });
        drawText(ctx, `${r.name}  ·  SEASON BEST ${r.best}${r.improved ? '  NEW!' : ''}`, W / 2, 396, { size: 14, color: r.improved ? COLORS.gold : '#cfe0ff' });
        const nt = nextTier(r.best);
        if (nt) drawText(ctx, `${nt.min - r.best} more for ${nt.name}`, W / 2, 418, { size: 12, color: nt.color, weight: 'normal' });
        else drawText(ctx, 'TOP TIER REACHED', W / 2, 418, { size: 12, color: COLORS.gold });
        if (r.rank > 0) drawText(ctx, `#${r.rank} this season on this phone`, W / 2, 442, { size: 11, color: '#9fb6d8', weight: 'normal' });
      }
    } else {
      if (game.newBest) drawText(ctx, 'NEW HIGH SCORE!', W / 2, 368, { size: 16, color: COLORS.gold, glow: 10 });
      else drawText(ctx, `HIGH SCORE  ${game.highScore}`, W / 2, 368, { size: 13, color: '#8fb3d9' });
      drawText(ctx, `survived ${mins}:${secs}  ·  reached stage ${game.stageIndex + 1}  ·  bosses ${game.bossesDefeated}`, W / 2, 396, {
        size: 12, color: '#9fb6d8', weight: 'normal',
      });
      if (game.lastRow && game.lastRow.rank > 0) {
        drawText(ctx, `You are #${game.lastRow.rank} on this phone`, W / 2, 420, { size: 13, color: COLORS.gold });

    }

    game.goButtons = [];
    if (game.stateTime > 0.8 && !game.nameEntry) {
      const bx = W / 2 - 120;
      game.goButtons = [
        { id: 'again', ...drawButton(ctx, { x: bx, y: 466, w: 240, h: 46 }, 'PLAY AGAIN', '#ffffff') },
        { id: 'board', ...drawButton(ctx, { x: bx, y: 524, w: 240, h: 46 }, 'LEADERBOARD', COLORS.gold) },
        { id: 'menu', ...drawButton(ctx, { x: bx, y: 582, w: 240, h: 46 }, 'MENU', '#8fb3d9') },
      ];
    }
  }

  // -----------------------------------------------------------------------------
  // Leaderboard screen. Tabs:
  //   CLASSIC classic top 10 (shared worldwide when the online database is set up)
  //   RANKED  this season, ONE row per name, with tiers
  // -----------------------------------------------------------------------------
  function drawLeaderboard(ctx, game) {
    const v = game.lbView;
    const lb = game.leaderboard;
    game.lbButtons = [];

    drawText(ctx, 'LEADERBOARD', W / 2, 52, { size: 30, color: COLORS.gold, glow: 16 });

    const tabs = [['world', 'CLASSIC'], ['ranked', 'RANKED']];
    const tab = v.tab === 'ranked' ? 'ranked' : 'world';
    const tw = (W - 44 - 10 * (tabs.length - 1)) / tabs.length;
    tabs.forEach(([id, label], i) => {
      const rect = { x: 22 + i * (tw + 10), y: 80, w: tw, h: 34 };
      const active = id === tab;
      ctx.fillStyle = active ? 'rgba(255,215,94,0.2)' : 'rgba(10,20,44,0.7)';
      ctx.strokeStyle = active ? COLORS.gold : 'rgba(255,255,255,0.2)';
      ctx.lineWidth = 2;
      pathRoundRect(ctx, rect.x, rect.y, rect.w, rect.h, 10);
      ctx.fill();
      ctx.stroke();
      drawText(ctx, label, rect.x + rect.w / 2, rect.y + 18, { size: 14, color: active ? COLORS.gold : '#8fb3d9' });
      game.lbButtons.push({ id: `tab-${id}`, ...rect });
    });

    let rows;
    let status = 'ok';
    let caption = '';
    if (tab === 'world') {
      if (lb.online) { rows = v.online.rows; status = v.online.status; caption = 'classic  ·  everybody, all time'; }
      else { rows = lb.rows(); caption = 'classic  ·  this phone only (shared board not connected)'; }
    }
    else if (tab === 'ranked') {
      const rb = game.rankedBoard;
      if (rb.online) { rows = v.ranked.rows; status = v.ranked.status; caption = `season ${rb.season}  ·  one row per name`; }
      else { rows = rb.localRows(); caption = `season ${rb.season}  ·  one row per name  ·  this phone only (shared board not connected)`; }
    }
    drawText(ctx, caption, W / 2, 134, { size: 11, color: '#8fb3d9', weight: 'normal' });

    const y0 = 170;
    const step = 40;
    if (status === 'off') {
      drawText(ctx, 'WORLD BOARD NOT CONNECTED', W / 2, 270, { size: 17, color: COLORS.hazard });
      ['Scores are only saved on each phone', 'until the game owner adds a database', 'address (onlineUrl in the settings).', 'See the README: "Turn on the shared boards".'].forEach((l, i) => {
        drawText(ctx, l, W / 2, 306 + i * 22, { size: 13, color: '#b9c9e6', weight: 'normal' });
      });
    } else if (status === 'loading' || status === 'idle') {
      drawText(ctx, 'Loading...', W / 2, 300, { size: 18, color: '#9fb6d8' });
    } else if (status === 'error') {
      drawText(ctx, 'Could not reach the online board.', W / 2, 290, { size: 16, color: COLORS.bad });
      drawText(ctx, 'Check your internet and try again later.', W / 2, 318, { size: 12, color: '#9fb6d8', weight: 'normal' });
    } else if (rows.length === 0) {
      drawText(ctx, 'No scores yet.', W / 2, 290, { size: 20, color: '#e8f0ff' });
      drawText(ctx, tab === 'ranked' ? 'Play RANKED to claim the first spot!' : 'Be the first on the board!', W / 2, 322, { size: 13, color: '#9fb6d8', weight: 'normal' });
    } else {
      rows.forEach((r, i) => {
        const y = y0 + i * step;
        const mine = tab === 'ranked'
          ? Boolean(game.rankedResult) && r.key === game.rankedResult.row?.key
          : Boolean(v.highlight) && r.t === v.highlight.t && r.score === v.highlight.score && r.name === v.highlight.name;
        if (mine) {
          ctx.fillStyle = 'rgba(255,215,94,0.2)';
          ctx.strokeStyle = COLORS.gold;
          ctx.lineWidth = 2;
          pathRoundRect(ctx, 22, y - 18, W - 44, 36, 9);
          ctx.fill();
          ctx.stroke();
        } else if (i % 2 === 0) {
          ctx.fillStyle = 'rgba(255,255,255,0.045)';
          pathRoundRect(ctx, 22, y - 18, W - 44, 36, 9);
          ctx.fill();
        }
        const medal = ['#ffd75e', '#d6dde8', '#d79b64'][i] || '#8fb3d9';
        drawText(ctx, String(i + 1), 52, y, { size: 18, color: medal, align: 'right' });
        if (tab === 'ranked') {
          const tier = tierFor(r.score);
          ctx.fillStyle = tier.color;
          ctx.beginPath();
          ctx.arc(72, y, 6, 0, Math.PI * 2);
          ctx.fill();
          drawText(ctx, r.name, 90, y - 6, { size: 16, color: mine ? COLORS.gold : '#e8f0ff', align: 'left' });
          drawText(ctx, CHARACTERS.find((c) => c.id === r.pilot)?.name || '', 90, y + 10, { size: 10, color: '#7f94b8', align: 'left', weight: 'normal' });
          drawText(ctx, String(r.score), W - 40, y - 6, { size: 18, color: mine ? COLORS.gold : '#ffffff', align: 'right' });
          drawText(ctx, tier.name, W - 40, y + 10, { size: 10, color: tier.color, align: 'right' });
        } else {
          const dot = CHARACTERS.find((c) => c.id === r.pilot)?.color || '#8fb3d9';
          ctx.fillStyle = dot;
          ctx.beginPath();
          ctx.arc(72, y, 6, 0, Math.PI * 2);
          ctx.fill();
          drawText(ctx, r.name, 90, y, { size: 17, color: mine ? COLORS.gold : '#e8f0ff', align: 'left' });
          drawText(ctx, String(r.score), W - 40, y, { size: 18, color: mine ? COLORS.gold : '#ffffff', align: 'right' });
        }
      });
    }

    if (v.from === 'gameover') {
      game.lbButtons.push(
        { id: 'again', ...drawButton(ctx, { x: W / 2 - 175, y: 606, w: 170, h: 48 }, 'PLAY AGAIN', '#ffffff') },
        { id: 'menu', ...drawButton(ctx, { x: W / 2 + 5, y: 606, w: 170, h: 48 }, 'MENU', '#8fb3d9') },
      );
    } else {
      game.lbButtons.push({ id: 'back', ...drawButton(ctx, { x: W / 2 - 100, y: 606, w: 200, h: 48 }, 'BACK', '#ffffff') });
    }
  }
  return { drawHUD, drawBanner, drawMenu, drawPause, drawUpgrade, drawGameOver, drawLeaderboard };
})();

/* ======================= FILE: game.js ======================= */
const __mod_game = (() => {
  // =============================================================================
  // game.js  -  the core game loop.
  //
  // States:  menu -> playing <-> paused -> dying -> gameover -> (playing | menu)
  //          playing -> upgrade (pick 1 of 3 cards after a boss) -> playing
  //          and 'leaderboard' (opened from the menu or the game-over screen)
  // Modes:   CLASSIC  relaxed endless run, saved to the classic boards
  //          RANKED   weekly season, same enemy sequence for everyone, tiers, and
  //                   a board with ONE row per player name (see ranked.js)
  // Stage flow: stage timer runs out -> BOSS -> boss dies -> upgrade card -> next stage
  //
  // update(dt) advances the simulation; render() draws it. They are separate so
  // the headless smoke test can run thousands of frames without a browser.
  //
  // Per-frame order while playing:
  //   input -> player -> spawn -> move everything -> collisions -> cleanup -> death check
  // =============================================================================

  const { CONFIG, CHARACTERS } = __mod_config;
  const { STAGES } = __mod_stages;
  const { MathRules, isPrime } = __mod_mathRules;
  const { Spawner } = __mod_spawner;
  const { Player, Bullet, Token, PowerUp, Particle, FloatingText, Ring, COLORS, POWERUP_INFO } = __mod_entities;
  const { Boss, BOSSES } = __mod_boss;
  const { Combo } = __mod_combo;
  const { pickCards, applyUpgrade } = __mod_upgrades;
  const { RankedBoard, seasonSeed } = __mod_ranked;
  const { mulberry32 } = __mod_rng;
  const { drawText } = __mod_draw;
  const { Leaderboard, cleanName } = __mod_leaderboard;
  const { drawHUD, drawMenu, drawBanner, drawPause, drawGameOver, drawLeaderboard, drawUpgrade } = __mod_ui;

  const W = CONFIG.width;
  const H = CONFIG.height;

  /** Circle-vs-circle overlap test used for every collision in the game. */
  function hits(ax, ay, ar, bx, by, br) {
    const dx = ax - bx;
    const dy = ay - by;
    const r = ar + br;
    return dx * dx + dy * dy <= r * r;
  }

  class Game {
    /**
     * @param {HTMLCanvasElement} canvas
     * @param {Input} input
     * @param {Sfx} sfx
     * @param {{dpr?: number, rng?: () => number, leaderboard?: Leaderboard, rankedBoard?: RankedBoard,
     *          askName?: (lastName: string, score: number) => Promise<string|null>,
     *          music?: Music}} options
     */
    constructor(canvas, input, sfx, options = {}) {
      this.canvas = canvas;
      this.ctx = canvas.getContext('2d');
      this.input = input;
      this.sfx = sfx;
      this.dpr = options.dpr || 1;
      this.rng = options.rng || Math.random;
      this.leaderboard = options.leaderboard || new Leaderboard();
      this.rankedBoard = options.rankedBoard || new RankedBoard({ onlineUrl: CONFIG.leaderboard.onlineUrl });
      this.askName = options.askName || null; // main.js shows the "enter your name" box
      this.music = options.music || null;
      this.mode = 'classic';
      this.lbView = { tab: 'device', from: 'menu', highlight: null, online: { status: 'idle', rows: [] }, ranked: { status: 'idle', rows: [] } };
      this.lbButtons = []; // tap targets, filled in while drawing each screen
      this.menuButtons = [];
      this.goButtons = [];
      this.upgradeRects = [];
      this.upgradeCards = [];
      this.pauseButtons = [];

      this.state = 'menu';
      this.stateTime = 0;
      this.touchMode = true;  // mobile-only game: always show the on-screen buttons
      this.menuIndex = 0;
      this.cardRects = [];
      this.time = 0;
      this.highScore = this._loadHigh();
      this.bgGlyphs = this._makeGlyphs();

      this.startRun(CHARACTERS[0].id); // initialise all fields, then go back to the menu
      this.state = 'menu';
    }

    // ===========================================================================
    // Run lifecycle
    // ===========================================================================

    get stage() { return STAGES[this.stageIndex % STAGES.length]; }
    get character() { return this.rules.character; }

    /** The MAKE-N target on screen right now (or null). */
    get gateTarget() {
      const g = this.gates.find((x) => !x.resolved && !x.dead && x.y > -20);
      return g ? g.target : null;
    }

    /** Begin a fresh run with the given character id (and mode: 'classic' | 'ranked'). */
    startRun(characterId, mode = this.mode) {
      const character = CHARACTERS.find((c) => c.id === characterId) || CHARACTERS[0];
      this.mode = mode === 'ranked' ? 'ranked' : 'classic';
      this.season = this.rankedBoard.season;
      // Ranked: everything random that affects the game comes from a season seed, so
      // every player faces the same enemy sequence. Looks (particles) use this.rng.
      this.runRng = this.mode === 'ranked' ? mulberry32(seasonSeed(this.season)) : this.rng;
      this.rules = new MathRules(character);
      this.player = new Player(character);
      this.mods = this.rules.mods;     // upgrade multipliers, shared by rules and player
      this.player.mods = this.mods;
      this.owned = {};                 // upgrade id -> times taken
      this.spawner = new Spawner(this.runRng);
      this.combo = new Combo();
      this.boss = null;
      this.phase = 'stage';            // 'stage' | 'boss' | 'clear' (boss dead, waiting for the cards)
      this.upgradeDelay = 0;
      this.bossesDefeated = 0;
      this.gates = [];
      this.rings = [];
      this.grazeCd = 0;
      this.grazes = 0;
      this.slowmo = { t: 0, scale: 1 };
      this.multPulse = 0;
      this.rankedResult = null;
      this.rankedSend = null;

      this.tokens = [];
      this.bullets = [];
      this.powerups = [];
      this.obstacles = [];
      this.particles = [];
      this.texts = [];

      this.lives = CONFIG.startLives;
      this.invuln = 0;        // seconds of protection left after losing a life
      this.deathReason = '';  // 'score' or 'lives'
      this.nameEntry = false; // true while the "enter your name" box is open
      this.lastRow = null;    // the score row just saved (highlighted on the leaderboard)
      this.bombs = character.bombs;
      this.stageIndex = 0;
      this.stageTime = 0;
      this.runTime = 0;
      this.difficulty = 1;
      this.rules.setStage(this.stage, 0);

      this.displayScore = character.startScore;
      this.peakScore = character.startScore;
      this.shake = 0;
      this.flash = null;     // { color, t }
      this.bombRing = null;  // { r }
      this.deathTimer = 0;
      this.banner = { t: 0, dur: 2.8 };
      this.newBest = false;

      this._setState('playing');
      this.sfx.play('stage');
    }

    _setState(s) {
      this.state = s;
      this.stateTime = 0;
    }

    /** The stage timer ran out: the stage boss arrives. Spawning pauses until it is beaten. */
    startBoss() {
      const def = BOSSES[this.stageIndex % BOSSES.length];
      this.boss = new Boss(def, { difficulty: this.difficulty, stagesCleared: this.stageIndex, rng: this.runRng });
      this.phase = 'boss';
      this.gates.forEach((g) => { g.dead = true; });
      this.bullets = this.bullets.filter((b) => b.owner === 'player');
      this.banner = { t: 0, dur: 2.6, boss: def };
      this.shake = Math.max(this.shake, 0.4);
      this.sfx.play('boss');
    }

    /** The boss number reached 0. */
    bossDefeated() {
      const b = this.boss;
      if (!b) return;
      this.boss = null;
      this.phase = 'clear';
      this.bossesDefeated++;
      this.rules.addScore(b.def.reward);
      this.explode(b.x, b.y, `hsl(${b.def.hue},95%,62%)`, 5);
      this.explode(b.x, b.y, '#ffffff', 3);
      this.addText(b.x, b.y - 10, `${b.def.name} DOWN  +${b.def.reward}`, COLORS.gold, 22);
      // everything hostile pops (no kill rewards), enemy bullets vanish
      for (const t of this.tokens) if (t.role === 'bad' && !t.dead) { t.dead = true; this.explode(t.x, t.y, COLORS.bad, 0.7); }
      for (const q of this.bullets) if (q.owner === 'enemy') q.dead = true;
      if (this.lives < CONFIG.maxLives) this.powerups.push(new PowerUp('life', b.x));
      this.shake = 1;
      this.flash = { color: 'rgba(255,255,255,0.55)', t: 0.4 };
      this.triggerSlowmo(0.7, 0.3);
      this.sfx.play('explode');
      this.upgradeDelay = 1.6;
    }

    /** The boss ran out of patience (CONFIG.bossTimeout): no reward, no cards. */
    bossEscapes() {
      this.addText(this.boss.x, this.boss.y, 'THE BOSS ESCAPED', COLORS.hazard, 20);
      this.boss = null;
      this.phase = 'stage';
      this.advanceStage();
    }

    /** Show the "pick 1 of 3" cards. */
    openUpgrade() {
      this.upgradeCards = pickCards(this.runRng, this.owned, 3);
      this.upgradeRects = [];
      this._setState('upgrade');
      this.input.touchEnd(this.input.touch.id);
      this.sfx.play('stage');
    }

    /** The player picked card number i (0..2). */
    chooseUpgrade(i) {
      const card = this.upgradeCards[i];
      if (!card || this.state !== 'upgrade') return;
      applyUpgrade(this, card.id);
      this.addText(this.player.x, this.player.y - 40, card.name, COLORS.cyan, 20);
      this.sfx.play('card');
      this.upgradeCards = [];
      this._setState('playing');
      this.advanceStage();
    }

    advanceStage() {
      const cleared = this.stageIndex % STAGES.length;
      this.phase = 'stage';
      this.boss = null;
      this.gates = [];
      this.combo.reset();
      const bonus = CONFIG.stageClearBonus * (cleared + 1);
      this.rules.addScore(bonus);
      this.bombs = Math.min(CONFIG.maxBombs, this.bombs + 1);
      this.addText(W / 2, H / 2 - 40, `STAGE CLEAR  +${bonus}`, COLORS.gold, 24);
      this.addText(W / 2, H / 2 - 12, '+1 PRIME BOMB', COLORS.violet, 16);

      this.bullets = this.bullets.filter((b) => b.owner === 'player'); // wipe hostile fire
      this.stageIndex++;
      this.stageTime = 0;
      this.difficulty = 1 + 0.3 * Math.floor(this.stageIndex / STAGES.length); // endless loops get harder
      this.rules.setStage(this.stage, this.stageIndex);
      this.spawner.onStageStart();
      this.banner = { t: 0, dur: 2.8 };
      this.sfx.play('stage');
    }

    /** Slow motion for `secs` real seconds at `scale` speed (0.3 = very slow). */
    triggerSlowmo(secs, scale) {
      if (this.slowmo.t > 0 && this.slowmo.scale < scale) return; // keep the stronger one
      this.slowmo = { t: secs, scale };
    }

    beginDeath(reason = 'score') {
      this.deathReason = reason;
      this._setState('dying');
      this.deathTimer = 0.9;
      this.triggerSlowmo(CONFIG.slowmo.deathSecs + 0.5, CONFIG.slowmo.deathScale);
      this.explode(this.player.x, this.player.y, this.character.color, 3);
      this.burst(this.player.x, this.player.y, this.character.color, 60, 320);
      this.burst(this.player.x, this.player.y, '#ffffff', 25, 200);
      this.shake = 0.6;
      this.sfx.play('gameover');
      if (this.peakScore > this.highScore) {
        this.highScore = this.peakScore;
        this.newBest = true;
        this._saveHigh();
      }
    }

    pauseIfPlaying() {
      if (this.state === 'playing') this._setState('paused');
    }

    // ===========================================================================
    // Update
    // ===========================================================================

    update(dt) {
      dt = Math.min(dt, 1 / 30); // never let a long frame tunnel through everything
      // Slow motion: the world runs at `scale` speed for a moment (last life, boss kill, death).
      if (this.slowmo.t > 0) {
        this.slowmo.t -= dt;
        dt *= this.slowmo.scale;
        if (this.slowmo.t <= 0) this.slowmo = { t: 0, scale: 1 };
      }
      this.time += dt;
      this.stateTime += dt;
      if (this.input.wasPressed('mute')) this.sfx.toggleMute();

      switch (this.state) {
        case 'menu': this.updateMenu(); break;
        case 'playing': this.updatePlaying(dt); break;
        case 'paused':
          if (this.input.wasPressed('pause')) this._setState('playing');
          break;
        case 'upgrade':
          this.updateEffects(dt);
          if (this.stateTime > 0.5) {
            ['pick1', 'pick2', 'pick3'].forEach((k, i) => { if (this.input.wasPressed(k)) this.chooseUpgrade(i); });
          }
          break;
        case 'dying': this.updateDying(dt); break;
        case 'gameover':
          if (this.stateTime > 0.8 && !this.nameEntry) {
            if (this.input.wasPressed('confirm')) this.startRun(this.character.id);
            else if (this.input.wasPressed('back')) this._setState('menu');
          }
          break;
        case 'leaderboard':
          if (this.input.wasPressed('back') || this.input.wasPressed('confirm')) this.closeLeaderboard();
          break;
      }
      this._syncMusic();
      this.input.endFrame();
    }

    /** Tell the music which tune should be playing right now. */
    _syncMusic() {
      if (!this.music) return;
      let theme = null;
      if (this.state === 'menu' || this.state === 'leaderboard') theme = 'menu';
      else if (this.state === 'playing' || this.state === 'paused' || this.state === 'upgrade') {
        theme = this.phase === 'boss' ? 'boss' : `s${this.stageIndex % STAGES.length}`;
      }
      this.music.setTheme(theme);
    }

    updateMenu() {
      const inp = this.input;
      if (inp.wasPressed('left') || inp.wasPressed('up')) this.menuIndex = 0;
      if (inp.wasPressed('right') || inp.wasPressed('down')) this.menuIndex = 1;
      if (inp.wasPressed('pick1')) this.menuIndex = 0;
      if (inp.wasPressed('pick2')) this.menuIndex = 1;
      if (inp.wasPressed('confirm')) this.beginFromMenu(this.menuIndex);
    }

    /** Start a run from the menu in the selected mode. */
    beginFromMenu(i) {
      this.menuIndex = i;
      this.startRun(CHARACTERS[i].id, this.mode);
    }

    /**
     * Tap / click at canvas coordinates. Returns true if the tap was used by a
     * button or screen (so main.js should NOT start a drag-to-move with it).
     */
    handlePointer(x, y, pointerType = 'mouse') {
      if (pointerType === 'touch') this.touchMode = true;
      const inRect = (r) => x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;

      const buttonAt = (list) => list.find(inRect);

      switch (this.state) {
        case 'menu': {
          const btn = buttonAt(this.menuButtons);
          if (btn?.id === 'board') { this.openLeaderboard('menu'); return true; }
          if (btn?.id === 'mode-classic') { this.mode = 'classic'; return true; }
          if (btn?.id === 'mode-ranked') { this.mode = 'ranked'; return true; }
          if (btn?.id === 'mute') { this.sfx.toggleMute(); return true; }
          let used = false;
          this.cardRects.forEach((r, i) => {
            if (inRect(r)) { this.beginFromMenu(i); used = true; }
          });
          return used;
        }
        case 'playing':
          // Buttons act through the same "just pressed" path as the keyboard.
          if (inRect(CONFIG.touch.bomb)) { this.input.justPressed.add('KeyB'); return true; }
          if (inRect(CONFIG.touch.pause)) { this.input.justPressed.add('KeyP'); return true; }
          if (inRect(CONFIG.touch.mute)) { this.sfx.toggleMute(); return true; }
          return false;
        case 'upgrade': {
          if (this.stateTime <= 0.5) return true; // ignore the tap that was still shooting
          this.upgradeRects.forEach((r, i) => { if (inRect(r)) this.chooseUpgrade(i); });
          return true;
        }
        case 'paused': {
          const btn = buttonAt(this.pauseButtons || []);
          if (btn?.id === 'resume') this._setState('playing');
          else if (btn?.id === 'restart') this.startRun(this.character.id);
          else if (btn?.id === 'home') { this.input.touchEnd(this.input.touch.id); this._setState('menu'); }
          return true;
        }
        case 'gameover': {
          if (this.stateTime <= 0.8 || this.nameEntry) return true; // ignore accidental taps
          const btn = buttonAt(this.goButtons);
          if (btn?.id === 'again') this.startRun(this.character.id);
          else if (btn?.id === 'board') this.openLeaderboard('gameover', this.lastRow);
          else if (btn?.id === 'menu') this._setState('menu');
          return true;
        }
        case 'leaderboard': {
          const btn = buttonAt(this.lbButtons);
          if (btn?.id === 'tab-device') this.lbView.tab = 'world';
          else if (btn?.id === 'tab-world') this.lbView.tab = 'world';
          else if (btn?.id === 'tab-ranked') this.lbView.tab = 'ranked';
          else if (btn?.id === 'again') this.startRun(this.character.id);
          else if (btn?.id === 'menu') this._setState('menu');
          else if (btn?.id === 'back') this.closeLeaderboard();
          return true;
        }
      }
      return false;
    }

    // ===========================================================================
    // Game over -> name box -> leaderboard
    // ===========================================================================

    _enterGameOver() {
      this._setState('gameover');
      const score = Math.round(this.peakScore);
      const ranked = this.mode === 'ranked';
      const wantsName = score > 0 && (ranked || this.leaderboard.qualifies(score) || this.leaderboard.online);
      if (!this.askName || !wantsName) return;

      const entry = { score, pilot: this.character.id, stage: this.stageIndex + 1 };
      this.nameEntry = true; // blocks the game-over buttons until the box is closed
      Promise.resolve()
        .then(() => this.askName(this.leaderboard.lastName, score))
        .catch(() => null)
        .then((name) => (ranked ? this._finishRanked(entry, name) : this._finishNameEntry(entry, name)));
    }

    _finishNameEntry(entry, name) {
      this.nameEntry = false;
      if (name == null || this.state !== 'gameover') return; // skipped
      const clean = cleanName(name);
      this.leaderboard.lastName = clean;
      const saved = this.leaderboard.add({ ...entry, name: clean });
      this.lastRow = saved;
      const sent = this.leaderboard.online ? this.leaderboard.submitOnline(saved) : null;
      this.openLeaderboard('gameover', saved, sent);
    }

    /** Ranked run finished and the player typed a name: keep the best score for that name. */
    _finishRanked(entry, name) {
      this.nameEntry = false;
      if (name == null || this.state !== 'gameover') return;
      const clean = cleanName(name);
      this.leaderboard.lastName = clean;
      const res = this.rankedBoard.submitLocal({ ...entry, name: clean });
      this.rankedResult = { ...res, score: entry.score, name: clean, season: this.season };
      if (this.rankedBoard.online && res.improved) {
        this.rankedSend = this.rankedBoard.submitOnline(res.row).catch(() => false);
      }
      this.openLeaderboard('gameover', res.row);
    }

    /** Show the leaderboard. `from` = 'menu' | 'gameover'. `after` = a promise to wait for before loading WORLD scores. */
    openLeaderboard(from, highlight = null, after = null) {
      const tab = this.mode === 'ranked' ? 'ranked' : 'world';
      const view = { tab, from, highlight, online: { status: 'idle', rows: [] }, ranked: { status: 'idle', rows: [] } };
      this.lbView = view;
      this._setState('leaderboard');
      if (this.leaderboard.online) {
        view.online.status = 'loading';
        Promise.resolve(after)
          .then(() => this.leaderboard.fetchOnline())
          .then((rows) => { view.online = rows ? { status: 'ok', rows } : { status: 'error', rows: [] }; })
          .catch(() => { view.online = { status: 'error', rows: [] }; });
      }
      if (this.rankedBoard.online) {
        view.ranked.status = 'loading';
        Promise.resolve(this.rankedSend)
          .then(() => this.rankedBoard.fetchOnline())
          .then((rows) => { view.ranked = rows ? { status: 'ok', rows } : { status: 'error', rows: [] }; })
          .catch(() => { view.ranked = { status: 'error', rows: [] }; });
      }
    }

    closeLeaderboard() {
      this._setState(this.lbView.from === 'gameover' ? 'gameover' : 'menu');
      this.stateTime = 1; // buttons work straight away
    }

    updatePlaying(dt) {
      if (this.input.wasPressed('pause')) { this._setState('paused'); return; }

      this.stageTime += dt;
      this.runTime += dt;
      this.banner.t += dt;
      this.rules.tick(dt);
      this.combo.tick(dt);
      this.invuln = Math.max(0, this.invuln - dt);
      this.grazeCd = Math.max(0, this.grazeCd - dt);
      this.multPulse = Math.max(0, this.multPulse - dt);

      // --- player input -------------------------------------------------------
      this.player.update(dt, this.input);
      if (this.input.isDown('shoot') || this.input.touch.active) { // touching = auto-fire
        const shots = this.player.tryFire();
        if (shots) {
          this.bullets.push(...shots);
          this.sfx.play('shoot');
        }
      }
      if (this.input.wasPressed('bomb')) this.detonateBomb();

      // --- stage progression: timer -> boss -> cards -> next stage ------------
      if (this.phase === 'stage' && this.stageTime >= CONFIG.stageDuration) this.startBoss();
      if (this.phase === 'clear') {
        this.upgradeDelay -= dt;
        if (this.upgradeDelay <= 0) { this.openUpgrade(); return; }
      }
      if (this.boss) this.updateBoss(dt);

      this.spawner.update(
        dt, this.stage,
        {
          intensity: Math.min(1, this.stageTime / CONFIG.stageDuration), difficulty: this.difficulty,
          playerX: this.player.x, lives: this.lives, hold: this.phase !== 'stage',
          stagesCleared: this.stageIndex,
        },
        this.tokens, this.powerups, this.obstacles, this.gates,
      );

      this.updateEntities(dt);
      this.updateCollisions();
      this.cleanup();

      // --- bookkeeping & death ------------------------------------------------
      this.peakScore = Math.max(this.peakScore, this.rules.score);
      this.displayScore += (this.rules.score - this.displayScore) * Math.min(1, dt * 10);
      if (this.lives <= 0) {
        this.beginDeath('lives');
      } else if (this.rules.isDead()) {
        if (CONFIG.scoreZeroCostsLife && this.lives > 1) this.scoreWipeout();
        else this.beginDeath('score');
      }
    }

    /** Move the boss and turn its attacks into real bullets and tokens. */
    updateBoss(dt) {
      const boss = this.boss;
      for (const act of boss.update(dt, this.player)) {
        if (act.type === 'bullets') {
          for (const s of act.list) {
            this.bullets.push(new Bullet({ x: s.x, y: s.y, vx: s.vx, vy: s.vy, owner: 'enemy', kind: 'subBullet', value: s.value, radius: 11 }));
          }
        } else if (act.type === 'summon') {
          for (let i = 0; i < act.n; i++) {
            this.tokens.push(new Token({ kind: 'int', value: 0, op: this.stage.op, x: boss.x + (i - (act.n - 1) / 2) * 56, y: boss.y + 30, vy: 115, hp: 2 }));
          }
        }
      }
      if (boss.fightTime > CONFIG.bossTimeout) this.bossEscapes();
    }

    updateDying(dt) {
      this.deathTimer -= dt;
      this.updateEffects(dt);
      this.gates.forEach((g) => g.update(dt));
      this.tokens.forEach((t) => t.update(dt));
      this.obstacles.forEach((o) => o.update(dt));
      this.bullets.forEach((b) => b.update(dt));
      this.displayScore += (Math.max(0, this.rules.score) - this.displayScore) * Math.min(1, dt * 10);
      this.cleanup();
      if (this.deathTimer <= 0) this._enterGameOver();
    }

    updateEntities(dt) {
      const p = this.player;
      const magnet = this.rules.magnetActive;

      for (const t of this.tokens) {
        t.update(dt);

        // Hostile shooters fire subtraction operators at the player.
        if (t.tickFire(dt)) this.enemyFire(t);

        // Pi Magnet: pull every positive pickup toward the player.
        if (magnet && t.role === 'good') {
          const dx = p.x - t.x;
          const dy = p.y - t.y;
          const d = Math.hypot(dx, dy);
          if (d < CONFIG.piMagnet.radius && d > 1) {
            const pull = CONFIG.piMagnet.pull * (1 - d / CONFIG.piMagnet.radius) * dt;
            t.x += (dx / d) * pull;
            t.y += (dy / d) * pull;
          }
        } else if (this.mods.magnet > 0 && t.role === 'good' && t.pattern !== 'orbit') {
          // LUCKY MAGNET upgrade: a gentle pull with a short reach
          const dx = p.x - t.x;
          const dy = p.y - t.y;
          const d = Math.hypot(dx, dy);
          if (d < this.mods.magnet && d > 1) {
            const pull = CONFIG.piMagnet.pull * 0.5 * (1 - d / this.mods.magnet) * dt;
            t.x += (dx / d) * pull;
            t.y += (dy / d) * pull;
          }
        }
      }
      this.bullets.forEach((b) => b.update(dt));
      this.powerups.forEach((u) => u.update(dt));
      this.obstacles.forEach((o) => o.update(dt));
      this.gates.forEach((g) => g.update(dt));
      this.updateEffects(dt);
    }

    updateEffects(dt) {
      this.particles.forEach((q) => q.update(dt));
      this.texts.forEach((q) => q.update(dt));
      this.rings.forEach((q) => q.update(dt));
      this.shake = Math.max(0, this.shake - dt * 2.2);
      if (this.flash) {
        this.flash.t -= dt;
        if (this.flash.t <= 0) this.flash = null;
      }
      if (this.bombRing) {
        this.bombRing.r += 1500 * dt;
        if (this.bombRing.r > H * 1.2) this.bombRing = null;
      }
    }

    /** A hostile shooter fires `volley` subtraction bullets aimed at the player. */
    enemyFire(token) {
      const n = Math.min(9, Math.abs(token.value));
      const aim = Math.atan2(this.player.x - token.x, this.player.y - token.y); // 0 = straight down
      const vol = token.shooter.volley;
      const speed = 170 + 15 * this.difficulty;
      for (let i = 0; i < vol; i++) {
        const a = aim + (i - (vol - 1) / 2) * 0.28;
        this.bullets.push(new Bullet({
          x: token.x, y: token.y + 14, owner: 'enemy', kind: 'subBullet',
          value: n, radius: 11, vx: Math.sin(a) * speed, vy: Math.cos(a) * speed,
        }));
      }
    }

    // ===========================================================================
    // Collisions
    // ===========================================================================

    updateCollisions() {
      const p = this.player;

      // 0) Obstacles cannot be destroyed: they swallow player shots.
      for (const b of this.bullets) {
        if (b.dead || b.owner !== 'player') continue;
        for (const o of this.obstacles) {
          if (o.touchesCircle(b.x, b.y, b.radius)) {
            b.dead = true;
            this.burst(b.x, b.y, COLORS.hazard, 3, 80);
            break;
          }
        }
      }

      // 0b) Player shots vs the boss.
      if (this.boss) {
        const bs = this.boss;
        for (const b of this.bullets) {
          if (b.dead || b.owner !== 'player') continue;
          if (hits(b.x, b.y, b.radius, bs.x, bs.y, bs.radius)) {
            b.dead = true;
            if (!bs.hurtable) { this.burst(b.x, b.y, '#ffffff', 2, 60); continue; } // still arriving: shielded
            const killed = bs.hit(b.damage);
            this.burst(b.x, b.y, '#ffffff', 3, 110);
            if (killed) { this.bossDefeated(); break; }
            this.sfx.play('kill');
          }
        }
      }

      // 1) Player shots vs hostile tokens (shots pass straight through pickups).
      for (const b of this.bullets) {
        if (b.dead || b.owner !== 'player') continue;
        for (const t of this.tokens) {
          if (t.dead || t.role !== 'bad') continue;
          if (hits(b.x, b.y, b.radius, t.x, t.y, t.radius * 1.15)) {
            b.dead = true;
            t.hp -= b.damage;
            t.flash = 0.08;
            if (t.hp <= 0.0001) this.killToken(t);
            else this.sfx.play('kill');
            break;
          }
        }
      }

      // 2) Tokens touching the player: pickups use a bigger radius than hazards.
      for (const t of this.tokens) {
        if (t.dead) continue;
        const r = t.role === 'good' ? p.collectRadius : p.hitRadius;
        if (hits(p.x, p.y, r, t.x, t.y, t.radius)) {
          t.dead = true;
          const before = this.rules.score;
          this.applyResult(this.rules.resolveTouch(t), t.x, t.y, t);
          this.checkBigGain(before);
        }
      }

      // 3) Enemy subtraction bullets vs the player.
      for (const b of this.bullets) {
        if (b.dead || b.owner !== 'enemy') continue;
        if (hits(p.x, p.y, p.hitRadius, b.x, b.y, b.radius)) {
          b.dead = true;
          this.applyResult(this.rules.resolveTouch(b), b.x, b.y, b);
        }
      }

      // 4) Power-ups (timed ones go to MathRules; the heart gives a life straight away).
      for (const u of this.powerups) {
        if (u.dead) continue;
        if (hits(p.x, p.y, p.collectRadius + 6, u.x, u.y, u.radius)) {
          u.dead = true;
          const info = POWERUP_INFO[u.kind];
          if (u.kind === 'life') {
            this.gainLife(u.x, u.y);
          } else {
            this.rules.activatePowerup(u.kind);
            this.addText(u.x, u.y - 10, info.name, info.color, 15);
          }
          this.burst(u.x, u.y, info.color, 16, 160);
          this.sfx.play('power');
        }
      }

      // 5) Obstacles and the boss's body vs the player: costs one life, then 2 seconds of protection.
      if (this.invuln <= 0) {
        for (const o of this.obstacles) {
          if (!o.dead && o.touchesCircle(p.x, p.y, p.hitRadius)) {
            this.loseLife(o);
            break;
          }
        }
        if (this.invuln <= 0 && this.boss && hits(p.x, p.y, p.hitRadius, this.boss.x, this.boss.y, this.boss.radius * 0.8)) {
          this.loseLife(this.boss, 'BOSS HIT');
        }
      }

      // 6) MAKE-N gates: fly through the box that equals the target.
      for (const g of this.gates) {
        if (g.resolved || g.dead) continue;
        if (g.touchesCircle(p.x, p.y, p.hitRadius + 2)) { this.resolveGate(g); break; }
      }

      // 7) Near misses: passing close to danger without touching it pays a small bonus.
      if (this.invuln <= 0) this.checkGraze();
    }

    /** CLOSE CALL: an enemy bullet, hostile number or rock passed within a hair of the ship. */
    checkGraze() {
      if (this.grazeCd > 0) return;
      const p = this.player;
      const margin = CONFIG.graze.margin;
      const near = (o, r) => {
        if (o.grazed || o.dead) return false;
        const d = Math.hypot(o.x - p.x, o.y - p.y);
        return d > p.hitRadius + r && d <= p.hitRadius + r + margin;
      };
      const target =
        this.bullets.find((b) => b.owner === 'enemy' && near(b, b.radius)) ||
        this.tokens.find((t) => t.role === 'bad' && near(t, t.radius * 1.1)) ||
        this.obstacles.find((o) => o.kind === 'meteor' && near(o, o.radius * 0.85));
      if (!target) return;
      target.grazed = true;
      this.grazeCd = CONFIG.graze.cooldown;
      this.grazes++;
      const reward = Math.max(1, Math.round(CONFIG.graze.reward * this.mods.graze));
      this.rules.addScore(reward);
      this.addText(p.x, p.y - 30, `CLOSE CALL +${reward}`, COLORS.cyan, 13);
      this.sfx.play('graze');
      this.chain();
    }

    /** One more hit in the combo chain; pays the milestone bonus when there is one. */
    chain() {
      const bonus = this.combo.add();
      if (bonus > 0) {
        this.rules.addScore(bonus);
        this.addText(this.player.x, this.player.y - 56, `COMBO ×${this.combo.count}  +${bonus}`, COLORS.gold, 18);
        this.sfx.play('combo');
      }
    }

    /** The player flew into a gate. Right answer: bonus. Wrong answer: lose a life. */
    resolveGate(g) {
      const set = this.gates.filter((x) => x.setId === g.setId);
      set.forEach((o) => { if (o !== g) o.resolved = 'gone'; });
      if (g.correct) {
        g.resolved = 'right';
        const reward = Math.round(CONFIG.gates.reward * (1 + 0.25 * this.stageIndex));
        this.rules.addScore(reward);
        const kinds = ['abs', 'pi', 'sq'];
        const kind = kinds[Math.floor(this.runRng() * kinds.length)];
        this.rules.activatePowerup(kind);
        this.addText(g.x, g.y - 30, `${g.text} = ${g.value}  CORRECT!  +${reward}`, COLORS.good, 18);
        this.addText(g.x, g.y - 8, POWERUP_INFO[kind].name, POWERUP_INFO[kind].color, 15);
        this.explode(g.x, g.y, COLORS.good, 1.5);
        this.flash = { color: 'rgba(93,255,176,0.3)', t: 0.25 };
        this.sfx.play('gate');
        this.chain();
      } else {
        g.resolved = 'wrong';
        this.addText(g.x, g.y - 30, `${g.text} = ${g.value}  WRONG`, COLORS.bad, 18);
        this.sfx.play('wrong');
        if (this.invuln <= 0) this.loseLife(g, 'WRONG ANSWER');
      }
    }

    /** Big gold flash when one touch multiplies your score by 2 or more (a lucky ×3 or ÷½). */
    checkBigGain(before) {
      const now = this.rules.score;
      if (before > 0 && now >= before * CONFIG.bigGainFactor && now - before >= 20) {
        const f = now / before;
        this.flash = { color: 'rgba(255,215,94,0.5)', t: 0.4 };
        this.addText(W / 2, H / 2 - 20, `×${f >= 10 ? Math.round(f) : f.toFixed(1).replace(/\.0$/, '')}!`, COLORS.gold, 60);
        this.explode(this.player.x, this.player.y, COLORS.gold, 2.5);
        this.multPulse = 1.2;
        this.sfx.play('mult');
      }
    }

    /** An obstacle hit the ship. Death itself is decided later in updatePlaying. */
    loseLife(source, why = '') {
      const p = this.player;
      this.lives = Math.max(0, this.lives - 1);
      this.invuln = CONFIG.invulnSecs;
      if (source?.kind === 'meteor') source.dead = true; // the rock shatters
      this.combo.reset();
      this.shake = 0.7;
      this.flash = { color: 'rgba(255,159,67,0.4)', t: 0.25 };
      this.explode(p.x, p.y, COLORS.hazard, 1.6);
      const msg = this.lives > 0 ? (why ? `${why}  -1 LIFE` : '-1 LIFE') : 'NO LIVES LEFT';
      this.addText(p.x, p.y - 34, msg, COLORS.hazard, 22);
      this.sfx.play('hit');
      if (this.lives === 1) {
        // LAST LIFE: the world slows down for a moment so you can breathe
        this.triggerSlowmo(CONFIG.slowmo.lastLifeSecs, CONFIG.slowmo.lastLifeScale);
        this.addText(W / 2, H / 2 + 20, 'LAST LIFE!', COLORS.bad, 34);
      }
    }

    /** A heart was collected. Lives can never go above CONFIG.maxLives. */
    gainLife(x, y) {
      if (this.lives < CONFIG.maxLives) {
        this.lives++;
        this.addText(x, y - 10, '+1 LIFE', COLORS.heart, 18);
      } else {
        this.rules.addScore(25);
        this.addText(x, y - 10, 'LIVES FULL +25', COLORS.heart, 15);
      }
    }

    /** Optional rule (CONFIG.scoreZeroCostsLife): score hit 0, so lose a life and refill half. */
    scoreWipeout() {
      this.lives--;
      this.rules.score = Math.ceil(this.character.startScore / 2);
      this.invuln = CONFIG.invulnSecs;
      this.shake = 0.6;
      this.flash = { color: 'rgba(255,40,80,0.4)', t: 0.3 };
      this.addText(this.player.x, this.player.y - 34, 'SCORE 0: -1 LIFE', COLORS.bad, 20);
      this.sfx.play('hit');
    }

    /** Show feedback for whatever MathRules decided happened. */
    applyResult(res, x, y, source) {
      if (!res) return;
      const color = res.tone === 'good' ? COLORS.good : res.tone === 'bad' ? COLORS.bad : '#c8d6ee';
      if (res.label) this.addText(x, y - 12, res.label, color, res.delta < 0 ? 20 : 17);

      if (res.lifeLoss) {
        if (this.invuln <= 0) this.loseLife(null, '÷0 ERROR');
        this.sfx.play('wrong');
        return;
      }
      if (res.lethal) { this.shake = 0.8; this.flash = { color: 'rgba(255,255,255,0.6)', t: 0.3 }; }
      if (res.tone === 'bad') {
        this.shake = Math.max(this.shake, 0.35);
        this.flash = { color: 'rgba(255,40,80,0.35)', t: 0.18 };
        this.explode(x, y, COLORS.bad, 1.1);
        this.sfx.play('hit');
        this.combo.reset();
      } else if (res.tone === 'good') {
        this.burst(x, y, COLORS.good, 10, 120);
        this.sfx.play('pickup');
        this.chain();
      }
      if (res.shrink !== undefined) this.player.shrink(res.shrink);
    }

    /** Destroy a hostile token and pay the kill reward. Splitters break in two unless `split` is false. */
    killToken(token, split = true) {
      token.dead = true;
      const res = this.rules.resolveKill(token);
      this.addText(token.x, token.y - 6, res.label, COLORS.gold, 16);
      this.explode(token.x, token.y, COLORS.bad, split ? 1 : 0.8);
      this.sfx.play('kill');
      this.chain();
      if (split && token.splits) {
        // a -8 splits into -4 and -4 (the pieces always add back up to the original)
        const total = Math.abs(token.value);
        const a = Math.floor(total / 2);
        const parts = [a, total - a];
        parts.forEach((n, i) => {
          this.tokens.push(new Token({
            kind: 'int', op: token.op, value: Math.sign(token.value || -1) * n, x: token.x + (i ? 16 : -16), y: token.y, vy: 100, hp: 1,
            pattern: 'drift', vx: i ? 80 : -80,
          }));
        });
        this.addText(token.x, token.y + 16, `SPLIT ${parts[0]}+${parts[1]}`, '#ffb3c1', 12);
      }
    }

    /** A bigger explosion: sparks plus expanding shockwave rings. `size` 1 = a normal kill. */
    explode(x, y, color, size = 1) {
      this.burst(x, y, color, Math.round(14 * size), 150 + 70 * size);
      this.rings.push(new Ring(x, y, color, 34 + 26 * size, 230 + 40 * size, 3 + size));
      if (size >= 2) {
        this.rings.push(new Ring(x, y, '#ffffff', 60 + 40 * size, 360 + 60 * size, 5));
        this.shake = Math.max(this.shake, Math.min(0.9, 0.2 * size));
      }
      if (this.rings.length > 40) this.rings.splice(0, this.rings.length - 40);
    }

    // ===========================================================================
    // Prime Bomb
    // ===========================================================================

    /**
     * Eliminates every hostile token whose value is NOT prime, plus enemy bullets.
     * Prime-valued enemies (2,3,5,7...) shrug it off and get a gold ring.
     */
    detonateBomb() {
      if (this.bombs <= 0) return;
      this.bombs--;
      this.bombRing = { r: 0 };
      this.flash = { color: 'rgba(255,255,255,0.5)', t: 0.3 };
      this.shake = 0.5;
      this.sfx.play('bomb');

      let sparedAny = false;
      for (const t of this.tokens) {
        if (t.dead || t.role !== 'bad') continue;
        if (t.kind === 'int' && isPrime(t.value)) {
          t.spared = 1.5;
          sparedAny = true;
        } else {
          this.killToken(t, false);
        }
      }
      if (this.boss && this.boss.hurtable) {
        // the bomb also hurts a boss (and rattles a shielded one)
        this.addText(this.boss.x, this.boss.y + 50, `-${CONFIG.bombBossDamage}`, COLORS.violet, 22);
        if (this.boss.hit(CONFIG.bombBossDamage)) this.bossDefeated();
      }
      if (sparedAny) this.addText(this.player.x, this.player.y - 50, 'PRIMES SURVIVE', COLORS.gold, 15);

      for (const b of this.bullets) {
        if (b.owner !== 'enemy') continue;
        if (CONFIG.bombSparesPrimeBullets && isPrime(b.value)) continue;
        b.dead = true;
        this.burst(b.x, b.y, COLORS.bad, 4, 90);
      }
    }

    // ===========================================================================
    // Helpers
    // ===========================================================================

    cleanup() {
      this.tokens = this.tokens.filter((t) => !t.dead && t.y < H + 60);
      this.bullets = this.bullets.filter((b) => !b.dead);
      this.powerups = this.powerups.filter((u) => !u.dead);
      this.obstacles = this.obstacles.filter((o) => !o.dead);
      this.gates = this.gates.filter((g) => !g.dead);
      this.particles = this.particles.filter((q) => !q.dead);
      this.rings = this.rings.filter((q) => !q.dead);
      this.texts = this.texts.filter((q) => !q.dead);
      if (this.particles.length > 500) this.particles.splice(0, this.particles.length - 500);
    }

    addText(x, y, text, color, size) {
      this.texts.push(new FloatingText(x, y, text, color, size));
    }

    burst(x, y, color, n, speed) {
      for (let i = 0; i < n; i++) {
        const a = this.rng() * Math.PI * 2;
        const s = speed * (0.3 + 0.7 * this.rng());
        this.particles.push(new Particle(x, y, Math.cos(a) * s, Math.sin(a) * s, 0.35 + 0.5 * this.rng(), color, 2 + this.rng() * 3));
      }
    }

    _loadHigh() {
      try { return Number(globalThis.localStorage?.getItem(CONFIG.storageKey)) || 0; } catch { return 0; }
    }

    _saveHigh() {
      try { globalThis.localStorage?.setItem(CONFIG.storageKey, String(this.highScore)); } catch { /* private mode */ }
    }

    _makeGlyphs() {
      const syms = ['+', '−', '×', '÷', '=', 'π', 'Σ', '√', '∞', '0', '1', '2', '3', '5', '7', 'x²'];
      return Array.from({ length: 26 }, () => ({
        s: syms[Math.floor(this.rng() * syms.length)],
        x: this.rng() * W,
        y: this.rng() * H,
        v: 12 + this.rng() * 30,
        size: 12 + this.rng() * 22,
      }));
    }

    // ===========================================================================
    // Render
    // ===========================================================================

    render() {
      const ctx = this.ctx;
      ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);

      ctx.save();
      if (this.shake > 0) {
        const m = this.shake * 10;
        ctx.translate((this.rng() - 0.5) * m, (this.rng() - 0.5) * m);
      }

      this.drawBackground(ctx);

      if (this.state === 'menu') drawMenu(ctx, this);
      else if (this.state === 'leaderboard') drawLeaderboard(ctx, this);
      else this.drawWorld(ctx);
      ctx.restore();

      // Full-screen overlays are drawn outside the shake transform.
      if (this.state !== 'menu' && this.state !== 'leaderboard') {
        if (this.flash) {
          ctx.fillStyle = this.flash.color;
          ctx.fillRect(0, 0, W, H);
        }
        this.drawLowScoreVignette(ctx);
        if (this.slowmo.t > 0 && this.slowmo.scale < 0.6) this.drawSlowmoTint(ctx);
        drawHUD(ctx, this);
        if (this.state === 'playing') drawBanner(ctx, this);
        if (this.state === 'paused') drawPause(ctx, this);
        if (this.state === 'upgrade') drawUpgrade(ctx, this);
        if (this.state === 'gameover') drawGameOver(ctx, this);
      }
    }

    drawBackground(ctx) {
      const hue = this.state === 'menu' || this.state === 'leaderboard' ? 215 : this.stage.hue;
      const g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, `hsl(${hue}, 55%, 9%)`);
      g.addColorStop(1, `hsl(${hue + 20}, 60%, 4%)`);
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);

      // Scrolling "quantum grid"
      ctx.strokeStyle = `hsla(${hue}, 80%, 60%, 0.10)`;
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (let x = 0; x <= W; x += 40) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
      const off = (this.time * 40) % 40;
      for (let y = -40 + off; y <= H; y += 40) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
      ctx.stroke();

      // Drifting math glyphs give parallax depth
      for (const gl of this.bgGlyphs) {
        gl.y += gl.v * 0.016;
        if (gl.y > H + 30) { gl.y = -30; gl.x = this.rng() * W; }
        ctx.globalAlpha = 0.07 + gl.v / 600;
        drawText(ctx, gl.s, gl.x, gl.y, { size: gl.size, color: `hsl(${hue}, 80%, 70%)` });
      }
      ctx.globalAlpha = 1;
    }

    drawWorld(ctx) {
      this.obstacles.forEach((o) => o.draw(ctx));
      this.gates.forEach((g) => g.draw(ctx));
      this.powerups.forEach((u) => u.draw(ctx));
      this.tokens.forEach((t) => t.draw(ctx));
      if (this.boss) this.boss.draw(ctx);
      this.bullets.forEach((b) => b.draw(ctx));

      if (this.state === 'playing' || this.state === 'paused' || this.state === 'upgrade') {
        this.drawPlayerAuras(ctx);
        // blink while protected after losing a life
        if (this.invuln > 0 && Math.floor(this.time * 14) % 2 === 0) ctx.globalAlpha = 0.3;
        this.player.draw(ctx);
        ctx.globalAlpha = 1;
      }

      this.rings.forEach((q) => q.draw(ctx));
      this.particles.forEach((q) => q.draw(ctx));
      this.texts.forEach((q) => q.draw(ctx));

      if (this.bombRing) {
        ctx.strokeStyle = 'rgba(255,255,255,0.8)';
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.arc(this.player.x, this.player.y, this.bombRing.r, 0, Math.PI * 2);
        ctx.stroke();
      }
    }

    /** Visual rings for the three timed power-ups. */
    drawPlayerAuras(ctx) {
      const p = this.player;
      const fx = this.rules.fx;

      if (fx.abs > 0) {
        ctx.strokeStyle = POWERUP_INFO.abs.color;
        ctx.lineWidth = 2.5;
        ctx.setLineDash([7, 6]);
        ctx.lineDashOffset = -this.time * 40;
        ctx.globalAlpha = fx.abs < 2 && Math.floor(this.time * 8) % 2 ? 0.3 : 0.9; // blink when expiring
        ctx.beginPath();
        ctx.arc(p.x, p.y, 34, 0, Math.PI * 2);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.globalAlpha = 1;
      }
      if (fx.pi > 0) {
        ctx.strokeStyle = 'rgba(255,215,94,0.18)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(p.x, p.y, CONFIG.piMagnet.radius, 0, Math.PI * 2);
        ctx.stroke();
        drawText(ctx, 'π', p.x + 30, p.y - 26, { size: 16, color: POWERUP_INFO.pi.color, glow: 8 });
      }
      if (fx.sq > 0) {
        ctx.fillStyle = `rgba(199,155,255,${0.12 + 0.06 * Math.sin(this.time * 8)})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 42, 0, Math.PI * 2);
        ctx.fill();
        drawText(ctx, 'x²', p.x - 32, p.y - 28, { size: 14, color: POWERUP_INFO.sq.color, glow: 8 });
      }
    }

    /** Slow-motion look: a cool blue edge glow. */
    drawSlowmoTint(ctx) {
      const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 0.75);
      g.addColorStop(0, 'rgba(80,140,255,0)');
      g.addColorStop(1, 'rgba(80,140,255,0.28)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);
    }

    drawLowScoreVignette(ctx) {
      if (this.state !== 'playing' || this.rules.score >= CONFIG.lowScoreWarning) return;
      const a = 0.18 + 0.12 * Math.sin(this.time * 9);
      const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.25, W / 2, H / 2, H * 0.7);
      g.addColorStop(0, 'rgba(255,0,40,0)');
      g.addColorStop(1, `rgba(255,0,40,${a})`);
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);
    }
  }
  return { Game };
})();

/* ======================= FILE: main.js ======================= */
const __mod_main = (() => {
  // =============================================================================
  // main.js  -  browser entry point. Math Striker is a MOBILE game driven by touch:
  //   * on a computer we show a "use your phone" screen instead
  //   * inside Messenger / Facebook / Instagram's built-in browser we first ask
  //     the player to open the page in their normal browser
  //   * after a game, a box asks for the player's name (leaderboard)
  // Test helpers: add ?desktop=1 to play on a computer (mouse drag = finger),
  //               add ?inapp=1 to preview the "open in your browser" prompt.
  // =============================================================================

  const { CONFIG } = __mod_config;
  const { Input } = __mod_input;
  const { Sfx, Music } = __mod_audio;
  const { Game } = __mod_game;
  const { detectInAppBrowser, detectPlatform, chromeIntentUrl, inAppHelp } = __mod_inapp;

  const $ = (id) => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const session = {
    get(k) { try { return sessionStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { sessionStorage.setItem(k, v); } catch { /* ignore */ } },
  };

  const isTouchDevice = navigator.maxTouchPoints > 0 || window.matchMedia('(pointer: coarse)').matches;
  const forceDesktop = params.has('desktop');
  const inApp = params.has('inapp') ? 'Messenger' : detectInAppBrowser(navigator.userAgent);

  if (!isTouchDevice && !forceDesktop) {
    $('desktop-notice').hidden = false;
    $('game').hidden = true;
  } else if (inApp && (params.has('inapp') || !session.get('ms.inapp.ok'))) {
    showInAppPrompt(inApp);
  } else {
    startGame();
  }

  // -----------------------------------------------------------------------------
  // "Open in your browser" prompt
  // -----------------------------------------------------------------------------
  function showInAppPrompt(appName) {
    const platform = detectPlatform(navigator.userAgent);
    $('game').hidden = true;
    $('inapp-app').textContent = appName;
    $('inapp-help').textContent = inAppHelp(platform);

    if (platform === 'android') {
      $('inapp-open').href = chromeIntentUrl(location); // asks Android to open Chrome
      $('inapp-open').hidden = false;
    }

    const plainLink = location.origin + location.pathname; // without ?inapp=1
    $('inapp-copy').onclick = async () => {
      const ok = await copyText(plainLink);
      $('inapp-copy').textContent = ok ? 'LINK COPIED - PASTE IT IN YOUR BROWSER' : 'PRESS AND HOLD THE LINK BELOW TO COPY';
      $('inapp-link').textContent = plainLink;
      $('inapp-link').hidden = false;
    };
    $('inapp-continue').onclick = () => {
      session.set('ms.inapp.ok', '1');
      $('inapp-notice').hidden = true;
      $('game').hidden = false;
      startGame();
    };
    $('inapp-notice').hidden = false;
  }

  async function copyText(text) {
    try {
      await navigator.clipboard.writeText(text);
      return true;
    } catch {
      try { // older webviews: select a temporary text box and copy
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        const ok = document.execCommand('copy');
        ta.remove();
        return ok;
      } catch { return false; }
    }
  }

  // -----------------------------------------------------------------------------
  // Leaderboard name box. Resolves the typed name, or null if the player skips.
  // -----------------------------------------------------------------------------
  function askName(lastName, score) {
    return new Promise((resolve) => {
      const box = $('name-entry');
      const input = $('name-input');
      $('name-score').textContent = String(score);
      input.value = lastName || '';
      input.maxLength = CONFIG.leaderboard.nameMax;
      box.hidden = false;
      setTimeout(() => input.focus(), 60);

      const done = (value) => {
        box.hidden = true;
        $('name-form').onsubmit = null;
        $('name-skip').onclick = null;
        resolve(value);
      };
      $('name-form').onsubmit = (e) => { e.preventDefault(); done(input.value); };
      $('name-skip').onclick = () => done(null);
    });
  }

  // -----------------------------------------------------------------------------
  // The game
  // -----------------------------------------------------------------------------
  function startGame() {
    const canvas = $('game');

    // Render at the screen's pixel density (capped at 2x) so text stays crisp.
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = CONFIG.width * dpr;
    canvas.height = CONFIG.height * dpr;

    const input = new Input(window);
    const sfx = new Sfx();
    const music = new Music(sfx);
    const game = new Game(canvas, input, sfx, { dpr, askName, music });

    // Browsers only allow audio and fullscreen after a tap, so do it on the first one.
    let firstTap = true;
    window.addEventListener('pointerdown', () => {
      sfx.unlock();
      music.start(); // background music (needs the first tap)
      if (!firstTap) return;
      firstTap = false;
      try {
        document.documentElement.requestFullscreen?.()
          .then(() => screen.orientation?.lock?.('portrait'))
          .catch(() => {}); // not supported (e.g. iPhone Safari): that is fine
      } catch { /* ignore */ }
    });

    // Taps on menus/buttons go to game.handlePointer(); otherwise, while playing,
    // dragging moves the ship (see Input.touch*).
    const toCanvas = (e) => {
      const rect = canvas.getBoundingClientRect();
      return [
        ((e.clientX - rect.left) / rect.width) * CONFIG.width,
        ((e.clientY - rect.top) / rect.height) * CONFIG.height,
      ];
    };
    canvas.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      const [x, y] = toCanvas(e);
      const used = game.handlePointer(x, y, e.pointerType);
      if (!used && game.state === 'playing') {
        canvas.setPointerCapture?.(e.pointerId);
        input.touchStart(e.pointerId, x, y);
      }
    });
    canvas.addEventListener('pointermove', (e) => {
      const [x, y] = toCanvas(e);
      input.touchMove(e.pointerId, x, y);
    });
    for (const type of ['pointerup', 'pointercancel', 'lostpointercapture']) {
      canvas.addEventListener(type, (e) => input.touchEnd(e.pointerId));
    }

    // Auto-pause when the app is backgrounded so you do not lose points off-screen.
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) game.pauseIfPlaying();
    });

    let last = performance.now();
    function frame(now) {
      const dt = (now - last) / 1000;
      last = now;
      game.update(dt);
      game.render();
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);

    window.__game = game; // handy for poking at the game from a desktop console (?desktop=1)
  }
})();

  </script>
</body>
</html>
