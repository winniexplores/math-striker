<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Math Striker</title>
  <meta name="description" content="A vertical arcade shooter where your score is your health and the enemies are numbers.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-fullscreen">
  <meta name="theme-color" content="#02060f">
  <style>
/* Center the portrait canvas and scale it to the window, keeping 2:3 aspect. */
* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: #02060f;
  overflow: hidden;
  overscroll-behavior: none;       /* no pull-to-refresh while dragging */
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}

main {
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
}

canvas {
  display: block;
  height: min(100dvh, 150vw);
  aspect-ratio: 2 / 3;
  background: #040a18;
  box-shadow: 0 0 60px rgba(77, 210, 255, 0.18);
  touch-action: none; /* stop page scroll/zoom gestures on the canvas */
}

noscript {
  position: fixed;
  inset: 0;
  display: grid;
  place-items: center;
  color: #fff;
  font-family: monospace;
}

/* "Use your phone" screen shown on computers */
#desktop-notice {
  text-align: center;
  color: #d3e0f5;
  font-family: "Courier New", ui-monospace, monospace;
  padding: 24px;
}
#desktop-notice[hidden] { display: none; }
#desktop-notice h1 { font-size: 40px; margin: 0 0 24px; color: #4dd2ff; text-shadow: 0 0 18px #4dd2ff; }
#desktop-notice h1 span { color: #ff6bd6; text-shadow: 0 0 18px #ff6bd6; }
#desktop-notice p { font-size: 18px; margin: 8px 0; }
canvas[hidden] { display: none; }

/* Overlays: "open in your browser" prompt and leaderboard name box */
input { -webkit-user-select: text; user-select: text; } /* body blocks selection; typing needs it */

.overlay {
  position: fixed;
  inset: 0;
  z-index: 10;
  display: grid;
  place-items: center;
  padding: 20px;
  background: rgba(2, 6, 15, 0.94);
  color: #d3e0f5;
  font-family: "Courier New", ui-monospace, monospace;
  overflow-y: auto;
}
.overlay[hidden] { display: none; }

.card {
  width: min(420px, 100%);
  padding: 24px 20px;
  text-align: center;
  background: #07142a;
  border: 2px solid #4dd2ff;
  border-radius: 16px;
  box-shadow: 0 0 30px rgba(77, 210, 255, 0.25);
}
.card h2 { margin: 0 0 12px; font-size: 21px; letter-spacing: 1px; color: #ffd75e; text-shadow: 0 0 12px #ffd75e; }
.card p { margin: 10px 0; font-size: 15px; line-height: 1.45; }
.card p.big { margin: 4px 0 12px; font-size: 44px; font-weight: bold; color: #fff; text-shadow: 0 0 14px #4dd2ff; }
.card p.link { word-break: break-all; font-size: 13px; color: #5dffb0; -webkit-user-select: text; user-select: text; }
.card p.link[hidden] { display: none; }

.btn {
  display: block;
  width: 100%;
  margin: 12px 0 0;
  padding: 14px 10px;
  font: bold 16px "Courier New", ui-monospace, monospace;
  color: #fff;
  text-align: center;
  text-decoration: none;
  background: #0c2142;
  border: 2px solid #4dd2ff;
  border-radius: 12px;
  cursor: pointer;
}
.btn[hidden] { display: none; }
.btn.primary { color: #5dffb0; border-color: #5dffb0; }
.btn.ghost { color: #9fb6d8; border-color: #5b7497; background: transparent; }

.card input {
  width: 100%;
  padding: 14px 10px;
  font: bold 20px "Courier New", ui-monospace, monospace; /* 16px+ stops iPhone zooming in */
  text-align: center;
  color: #fff;
  background: #020a18;
  border: 2px solid #4dd2ff;
  border-radius: 12px;
  outline: none;
}
.card input:focus { border-color: #ffd75e; }

  </style>
</head>
<body>
  <main>
    <canvas id="game" width="480" height="720" aria-label="Math Striker game canvas"></canvas>
    <section id="desktop-notice" hidden>
      <h1>MATH <span>STRIKER</span></h1>
      <p>This game is built for <strong>phones</strong>.</p>
      <p>Open this page on your phone to play.</p>
    </section>
  </main>
  <!-- Shown inside Messenger / Facebook / Instagram's built-in browser -->
  <section id="inapp-notice" class="overlay" hidden>
    <div class="card">
      <h2>OPEN IN YOUR BROWSER</h2>
      <p>You opened this link inside <strong id="inapp-app">Messenger</strong>. Its built-in browser can break sound, fullscreen and your saved scores.</p>
      <p id="inapp-help"></p>
      <a id="inapp-open" class="btn primary" href="#" hidden>OPEN IN CHROME</a>
      <button id="inapp-copy" class="btn" type="button">COPY LINK</button>
      <p id="inapp-link" class="link" hidden></p>
      <button id="inapp-continue" class="btn ghost" type="button">CONTINUE ANYWAY</button>
    </div>
  </section>

  <!-- Shown after a game when the score makes the leaderboard -->
  <section id="name-entry" class="overlay" hidden>
    <form id="name-form" class="card" autocomplete="off">
      <h2>NEW LEADERBOARD SCORE!</h2>
      <p class="big" id="name-score">0</p>
      <p>Type your name for the leaderboard:</p>
      <input id="name-input" type="text" maxlength="12" placeholder="YOUR NAME" autocomplete="off" autocapitalize="words" spellcheck="false" enterkeyhint="done">
      <button class="btn primary" type="submit">SAVE SCORE</button>
      <button id="name-skip" class="btn ghost" type="button">SKIP</button>
    </form>
  </section>

  <noscript>Math Striker needs JavaScript enabled.</noscript>
  <script>
/* ====================================================================
   MATH STRIKER - everything in one file.
   Tip: use Ctrl+F (or the search icon) to jump to a "FILE:" marker below.
   FILE: config.js   = numbers, pilots, lives, obstacles, leaderboard settings
   FILE: stages.js   = the 4 stages
   FILE: entities.js = how numbers/bullets/power-ups look
   FILE: draw.js     = ship shapes
   FILE: ui.js       = menu, score bar, buttons, leaderboard screen
   FILE: leaderboard.js = high-score saving (and the optional online board)
   FILE: inapp.js    = the open-in-your-browser check for Messenger etc.
   ==================================================================== */
/* ======================= FILE: config.js ======================= */
const __mod_config = (() => {
  // =============================================================================
  // config.js  -  every tunable number in one place.
  // Change values here to rebalance the game without touching any logic.
  // =============================================================================

  const CONFIG = {
    // --- Canvas (logical resolution; CSS scales it to fit the window) ----------
    width: 480,
    height: 720,
    font: '"Courier New", ui-monospace, monospace',

    // --- Stage flow -------------------------------------------------------------
    stageDuration: 45,        // seconds per stage
    stageClearBonus: 20,      // bonus score = this * stage number (1..4)
    maxBombs: 5,

    // --- Math rules -------------------------------------------------------------
    maxMultiplier: 16,        // cap for the running multiplier
    maxEffectiveMultiplier: 64, // cap after the x^2 power-up squares it
    multiplierDecaySecs: 10,  // multiplier halves every N seconds unless you grab another xk
    dangerPerStage: 0.35,     // every hazard hurts (1 + this*stagesCleared) times more
    hazardPercent: 0.04,      // a size-9 hazard also takes this share of your CURRENT score
                              // (smaller hazards take proportionally less). Keeps big scores fragile.
    zeroPercent: 0.03,        // extra share of current score lost to a 0
    aimedSpawnChance: 0.35,   // chance a hostile number spawns right above the player
    zeroPenalty: 12,          // score lost when you touch a 0 (also resets multiplier)
    negMultRate: 0.10,        // touching x(-k) costs score * rate * k ...
    negMultMaxFraction: 0.40, // ... but never more than this share of your score
    divSeverity: 0.40,        // touching a divisor/fraction f costs score*(1-f)*severity
    shrinkMin: 0.6,           // ship never shrinks below 60% size
    shrinkRecoverPerSec: 0.12,

    // --- Prime Bomb -------------------------------------------------------------
    // false: bomb wipes ALL enemy bullets, only prime-valued enemies survive.
    // true : prime-valued bullets survive too (the strictest reading of the spec).
    bombSparesPrimeBullets: false,

    // --- Power-ups --------------------------------------------------------------
    powerupDuration: { abs: 8, pi: 8, sq: 8 }, // seconds
    powerupInterval: [14, 22],                 // random gap between power-up drops
    piMagnet: { radius: 230, pull: 560 },

    // --- Touch controls (rectangles are in canvas coordinates) -----------------
    touch: {
      dragSensitivity: 1.3,                      // ship moves this much per pixel dragged
      bomb: { x: 8, y: 660, w: 130, h: 50 },
      pause: { x: 420, y: 66, w: 52, h: 40 },
    },

    // --- Lives & obstacles --------------------------------------------------------
    // Obstacles are orange METEORS and striped WALLS. They cannot be shot and they
    // cost one life. Your score is still your health: score 0 = game over too.
    startLives: 3,
    maxLives: 3,              // lives can never go above this (heart pickups stop here)
    invulnSecs: 2,            // after losing a life you cannot lose another for this long
    scoreZeroCostsLife: false,// true: score hitting 0 costs a life and refills half your
                              //       starting score, instead of ending the run at once
    lifePickupInterval: [30, 45], // seconds between heart drops (only when below max lives)
    obstacles: {
      meteorRadius: 24,
      wallHeight: 22,
      wallGap: 150,           // width of the safe gap in a wall (your ship is ~40 wide)
    },

    // --- Leaderboard --------------------------------------------------------------
    leaderboard: {
      size: 10,               // rows kept and shown
      nameMax: 12,            // longest name
      storageKey: 'mathStriker.leaderboard.v1',
      // Paste a Firebase Realtime Database URL here to turn on the shared WORLD
      // board, for example 'https://my-game-default-rtdb.firebaseio.com'
      // Leave it empty ('') for a this-device-only leaderboard.
      onlineUrl: '',
    },

    // --- Misc -------------------------------------------------------------------
    lowScoreWarning: 25,      // red pulse when score is below this
    storageKey: 'mathStriker.highScore',
  };

  // -----------------------------------------------------------------------------
  // Playable pilots.
  //   startScore  : your running score IS your health, so this is starting HP
  //   lossScale   : multiplies every point you lose (0.7 = take 30% less damage)
  //   weapon      : 'single' | 'burst' (see Player.tryFire in entities.js)
  // -----------------------------------------------------------------------------
  const CHARACTERS = [
    {
      id: 'axiom',
      name: 'AXIOM',
      role: 'Male Pilot',
      color: '#4dd2ff',
      blurb: ['Steady and reliable.', 'Takes 35% less damage', 'and starts with a', 'bigger score buffer.'],
      stats: { Defense: 5, Mobility: 2, Burst: 2 },
      startScore: 150,
      lossScale: 0.65,
      speed: 280,
      fireCooldown: 0.16,
      damage: 1,
      weapon: 'single',
      bombs: 3,
    },
    {
      id: 'calcula',
      name: 'CALCULA',
      role: 'Female Pilot',
      color: '#ff6bd6',
      blurb: ['Fast and fierce.', 'Twin shots plus a', '5-way burst with 2x', 'damage every 6th volley.'],
      stats: { Defense: 2, Mobility: 5, Burst: 5 },
      startScore: 100,
      lossScale: 1.0,
      speed: 340,
      fireCooldown: 0.15,
      damage: 1,
      weapon: 'burst',
      burstEvery: 6,
      burstDamageMult: 2,
      bombs: 2,
    },
  ];
  return { CONFIG, CHARACTERS };
})();

/* ======================= FILE: stages.js ======================= */
const __mod_stages = (() => {
  // =============================================================================
  // stages.js  -  data-driven stage definitions.
  //
  // To add a stage or rebalance one, edit this table. No game logic changes.
  //
  // Each `table` entry describes something that can spawn:
  //   { kind: 'int',     sign: +1|-1, min, max, weight }   signed integer
  //   { kind: 'mult',    values: [2,3,5],         weight } good multiplier
  //   { kind: 'negmult', values: [2,3],           weight } bad  multiplier
  //   { kind: 'zero',                             weight } bad  zero
  //   { kind: 'div',     values: [2,3,4],         weight } bad  divisor
  //   { kind: 'frac',    pairs: [[1,2],[3,4]],    weight } bad  fraction
  //
  // shooterChance : chance a hostile integer carries a gun (fires -n bullets)
  // shooterVolley : bullets per shot (fan spread)
  // fallSpeed     : [min, max] pixels per second

  const STAGES = [

      spawnInterval: 0.62,

      shooterVolley: 1,
      obstacles: { interval: [9, 13], wallChance: 0 }, // seconds between rocks/walls, share that are walls
      table: [
        { kind: 'int', sign: +1, min: 1, max: 9, weight: 5 },
        { kind: 'int', sign: -1, min: 1, max: 9, weight: 3.5 },
      ],
    },
    {
      id: 2,
      op: '−',
      name: 'SUBTRACTION',
      hue: 285,
      tagline: 'Enemies fire − operators. Negatives drain you.',
      spawnInterval: 0.56,
      fallSpeed: [75, 125],
      shooterChance: 0.55,
      shooterVolley: 3,
      obstacles: { interval: [8, 12], wallChance: 0.2 }, // seconds between rocks/walls, share that are walls
      table: [
        { kind: 'int', sign: +1, min: 1, max: 6, weight: 3 },
        { kind: 'int', sign: -1, min: 2, max: 9, weight: 4 },
      ],
    },
    {
      id: 3,
      op: '×',
      name: 'MULTIPLICATION',
      hue: 40,
      tagline: 'Grab ×2 ×3 ×5. Zeros and ×negatives hurt.',
      spawnInterval: 0.54,
      fallSpeed: [80, 135],
      shooterChance: 0.15,
      shooterVolley: 1,
      obstacles: { interval: [7, 11], wallChance: 0.3 }, // seconds between rocks/walls, share that are walls
      table: [
        { kind: 'int', sign: +1, min: 1, max: 9, weight: 3 },
        { kind: 'int', sign: -1, min: 1, max: 9, weight: 1.2 },
        { kind: 'mult', values: [2, 2, 3, 5], weight: 1.4 },
        { kind: 'zero', weight: 1.6 },
        { kind: 'negmult', values: [2, 3], weight: 1.1 },
      ],
    },
    {
      id: 4,
      op: '÷',
      name: 'DIVISION & FRACTIONS',
      hue: 340,
      tagline: 'Divisors and fractions shrink your score and your ship.',
      spawnInterval: 0.52,
      fallSpeed: [85, 140],
      shooterChance: 0.22,
      shooterVolley: 2,
      obstacles: { interval: [6.5, 10], wallChance: 0.35 }, // seconds between rocks/walls, share that are walls
      table: [
        { kind: 'int', sign: +1, min: 1, max: 9, weight: 3 },
        { kind: 'int', sign: -1, min: 1, max: 9, weight: 1.5 },
        { kind: 'mult', values: [2, 3], weight: 0.8 },
        { kind: 'div', values: [2, 3, 4], weight: 2 },
        { kind: 'frac', pairs: [[1, 2], [1, 3], [2, 3], [3, 4]], weight: 1.6 },
        { kind: 'zero', weight: 0.5 },
      ],
    },

  return { STAGES };
})();

/* ======================= FILE: draw.js ======================= */
const __mod_draw = (() => {
  // =============================================================================
  // draw.js  -  small canvas helpers shared by entities and UI.
  // =============================================================================

  const { CONFIG } = __mod_config;

  /**
   * Draw centered/aligned text with an optional neon glow.
   * opts: size, color, align, baseline, weight, glow (blur radius, 0 = none)
   */
  function drawText(ctx, str, x, y, opts = {}) {
    const { size = 16, color = '#ffffff', align = 'center', baseline = 'middle', weight = 'bold', glow = 0 } = opts;
    ctx.font = `${weight} ${size}px ${CONFIG.font}`;
    ctx.textAlign = align;
    ctx.textBaseline = baseline;
    ctx.fillStyle = color;
    if (glow > 0) {
      ctx.shadowColor = color;
      ctx.shadowBlur = glow;
    }
    ctx.fillText(str, x, y);
    ctx.shadowBlur = 0;
  }

  /** A heart shape centred on (x, y). `s` is its size; filled = life left, outline = life lost. */
  function drawHeart(ctx, x, y, s, color, filled = true) {
    ctx.save();
    ctx.translate(x, y);
    ctx.beginPath();
    ctx.moveTo(0, s * 0.95);
    ctx.bezierCurveTo(-s * 1.7, -s * 0.1, -s * 0.8, -s * 1.3, 0, -s * 0.4);
    ctx.bezierCurveTo(s * 0.8, -s * 1.3, s * 1.7, -s * 0.1, 0, s * 0.95);
    ctx.closePath();
    if (filled) {
      ctx.shadowColor = color;
      ctx.shadowBlur = 10;
      ctx.fillStyle = color;
      ctx.fill();
    } else {
      ctx.strokeStyle = color;
      ctx.globalAlpha = 0.4;
      ctx.lineWidth = 1.8;
      ctx.stroke();
    }
    ctx.restore();
  }

  /** Trace (but do not fill) a rounded rectangle path. Works in every browser. */
  function pathRoundRect(ctx, x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  /**
   * Draw a pilot's ship. Used for the in-game player and the character-select cards.
   * Axiom = broad armored fighter, Calcula = sleek swept-wing fighter.
   */
  function drawShip(ctx, character, x, y, scale = 1, t = 0) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);

    // engine flame (flickers with time)
    const flame = 10 + 6 * Math.sin(t * 40);
    ctx.fillStyle = '#ffb347';
    ctx.shadowColor = '#ff7b00';
    ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.moveTo(-5, 12);
    ctx.lineTo(0, 12 + flame);
    ctx.lineTo(5, 12);
    ctx.closePath();
    ctx.fill();

    // hull
    ctx.shadowColor = character.color;
    ctx.shadowBlur = 14;
    ctx.fillStyle = character.color;
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    if (character.id === 'axiom') {
      ctx.moveTo(0, -24); ctx.lineTo(9, -6); ctx.lineTo(20, 8); ctx.lineTo(20, 16);
      ctx.lineTo(8, 10); ctx.lineTo(0, 14); ctx.lineTo(-8, 10); ctx.lineTo(-20, 16);
      ctx.lineTo(-20, 8); ctx.lineTo(-9, -6);
    } else {
      ctx.moveTo(0, -26); ctx.lineTo(6, -4); ctx.lineTo(22, 18); ctx.lineTo(7, 11);
      ctx.lineTo(0, 16); ctx.lineTo(-7, 11); ctx.lineTo(-22, 18); ctx.lineTo(-6, -4);
    }
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.stroke();

    // cockpit
    ctx.fillStyle = '#0b1b33';
    ctx.beginPath();
    ctx.ellipse(0, -4, 3.5, 6, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }
  return { drawText, drawHeart, pathRoundRect, drawShip };
})();

/* ======================= FILE: audio.js ======================= */
const __mod_audio = (() => {
  // =============================================================================
  // audio.js  -  tiny synthesized sound effects (no audio files needed).
  // Browsers only allow audio after a user gesture, so main.js calls unlock()
  // on the first key press / click. Everything is a no-op if WebAudio is missing
  // (for example when the smoke test runs in Node).
  // =============================================================================

  // name -> oscillator recipe. `slide` is the pitch change (Hz) over the duration.
  const PRESETS = {
    shoot:    { freq: 880, slide: -420, dur: 0.05, type: 'square',   gain: 0.20 },
    kill:     { freq: 320, slide: -140, dur: 0.09, type: 'triangle', gain: 0.45 },
    pickup:   { freq: 620, slide: 420,  dur: 0.10, type: 'sine',     gain: 0.55 },
    hit:      { freq: 150, slide: -90,  dur: 0.20, type: 'sawtooth', gain: 0.55 },
    power:    { freq: 480, slide: 720,  dur: 0.28, type: 'sine',     gain: 0.60 },
    bomb:     { freq: 110, slide: -70,  dur: 0.55, type: 'sawtooth', gain: 0.70 },
    stage:    { freq: 440, slide: 440,  dur: 0.40, type: 'triangle', gain: 0.55 },
    gameover: { freq: 220, slide: -170, dur: 0.80, type: 'sawtooth', gain: 0.60 },
  };

  class Sfx {
    constructor() {
      this.ctx = null;
      this.muted = false;
      this.master = 0.12;   // overall volume
      this.lastPlayed = {}; // name -> timestamp, used to throttle rapid sounds
    }

    unlock() {
      if (this.ctx) return;
      const AC = globalThis.AudioContext || globalThis.webkitAudioContext;
      if (!AC) return;
      try { this.ctx = new AC(); } catch { this.ctx = null; }
    }

    toggleMute() {
      this.muted = !this.muted;
    }

    play(name) {
      if (!this.ctx || this.muted) return;
      const p = PRESETS[name];
      if (!p) return;

      const now = this.ctx.currentTime;
      if (now - (this.lastPlayed[name] ?? -1) < 0.03) return; // throttle
      this.lastPlayed[name] = now;

      const osc = this.ctx.createOscillator();
      const amp = this.ctx.createGain();
      osc.type = p.type;
      osc.frequency.setValueAtTime(p.freq, now);
      osc.frequency.linearRampToValueAtTime(Math.max(30, p.freq + p.slide), now + p.dur);
      amp.gain.setValueAtTime(this.master * p.gain, now);
      amp.gain.exponentialRampToValueAtTime(0.0001, now + p.dur);
      osc.connect(amp).connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + p.dur + 0.02);
    }
  }
  return { Sfx };
})();

/* ======================= FILE: input.js ======================= */
const __mod_input = (() => {
  // =============================================================================
  // input.js  -  keyboard handling with "held" and "just pressed" queries.
  //
  //   input.isDown('left')      -> true every frame the key is held
  //   input.wasPressed('bomb')  -> true only on the frame the key went down
  //
  // Game.update() calls input.endFrame() once per frame to clear the edge set.
  // =============================================================================

  // Logical action -> physical key codes (KeyboardEvent.code, layout independent)
  const KEYMAP = {
    left: ['ArrowLeft', 'KeyA'],
    right: ['ArrowRight', 'KeyD'],
    up: ['ArrowUp', 'KeyW'],
    down: ['ArrowDown', 'KeyS'],
    shoot: ['Space'],
    bomb: ['KeyB'],
    confirm: ['Enter', 'Space'],
    pause: ['KeyP', 'Escape'],
    back: ['Escape'],
    mute: ['KeyM'],
    pick1: ['Digit1'],
    pick2: ['Digit2'],
  };

  // Keys whose default browser behaviour (page scroll) must be suppressed.
  const PREVENT_DEFAULT = new Set(['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space']);

  /** True when a key event comes from a text box (the leaderboard name field). */
  const isTyping = (e) => /^(INPUT|TEXTAREA)$/.test(e.target?.tagName || '');

  class Input {
    /** @param {EventTarget} target  usually `window`; any EventTarget works (tests pass a stub) */
    constructor(target = globalThis) {
      this.held = new Set();
      this.justPressed = new Set();
      // One-finger drag state, fed by main.js. dx/dy accumulate until the Player uses them.

  // =============================================================================
  // mathRules.js  -  the Math Rules Manager.
  //
  // This is the ONLY place that decides how a number/operator changes your
  // running score. Your score IS your health: it hits 0 -> game over.
  //
  // Token kinds understood here (see entities.js / stages.js):
  //   'int'       signed integer. +n is a pickup, -n is a hazard.
  //   'subBullet' a subtraction operator fired by enemies: touching it does -n.
  //   'mult'      xk  (k > 1)  good: raises your multiplier.
  //   'negmult'   x(-k)        bad : costs a share of your score, resets multiplier.
  //   'zero'      0            bad : flat penalty AND resets the multiplier.
  //   'div'       /n           bad : score is divided (softened), ship shrinks.
  //   'frac'      p/q  (<1)    bad : same as div with factor p/q.
  //
  // Every resolve* method returns a result object:
  //   { delta, label, tone: 'good' | 'bad' | 'neutral', shrink? }
  // so the Game can show floating text, play sounds and shake the screen.
  // =============================================================================

  const { CONFIG } = __mod_config;

  const MINUS = '−';
  const TIMES = '×';

  /** Trial-division primality test (inputs are tiny). Negative numbers use |n|. */
  function isPrime(n) {
    n = Math.abs(Math.trunc(n));
    if (n < 2) return false;
    for (let i = 2; i * i <= n; i++) {
      if (n % i === 0) return false;
    }
    return true;
  }

  class MathRules {
    /** @param {object} character an entry from CHARACTERS */
    constructor(character) {
      this.character = character;
      this.score = character.startScore;
      this.multiplier = 1;
      this.stageOp = '+';
      this.dangerScale = 1;   // grows every stage so late hazards bite harder
      this.multTimer = 0;     // seconds since the multiplier was last refreshed
      // Seconds remaining for each timed power-up.
      this.fx = { abs: 0, pi: 0, sq: 0 };
    }

    // ---- state queries --------------------------------------------------------

    get absActive() { return this.fx.abs > 0; }
    get magnetActive() { return this.fx.pi > 0; }
    get squareActive() { return this.fx.sq > 0; }

    /** Multiplier actually used for gains. x^2 power-up squares it (min x2). */
    get effectiveMultiplier() {
      const m = this.squareActive ? Math.max(2, this.multiplier * this.multiplier) : this.multiplier;
      return Math.min(m, CONFIG.maxEffectiveMultiplier);
    }

    isDead() { return this.score <= 0; }

    // ---- housekeeping ---------------------------------------------------------

    /** @param {object} stage stage definition   @param {number} stagesCleared 0-based count */
    setStage(stage, stagesCleared = 0) {
      this.stageOp = stage.op;
      this.dangerScale = 1 + CONFIG.dangerPerStage * stagesCleared;
    }

    tick(dt) {
      for (const k of Object.keys(this.fx)) this.fx[k] = Math.max(0, this.fx[k] - dt);

      if (this.multiplier > 1) {

    }

    activatePowerup(kind) {
      this.fx[kind] = CONFIG.powerupDuration[kind];
    }

    /** Flat score change that ignores multipliers and defense (stage bonuses). */
    addScore(n) { this.score += n; }

    /** Apply a positive gain (scaled by the multiplier). */
    _gain(base) {

      this.score += d;

    }

    /** Apply a loss (scaled by pilot defense and stage danger). Returns a result object. */
    _loss(raw, prefix = '', pct = 0) {
      // `pct` adds a share of the CURRENT score on top of the flat amount, so the
      // more you are carrying, the more a hit costs (score is health, after all).
      const base = raw + Math.ceil(Math.max(0, this.score) * pct);

    }

     * Incoming negative value of size n (negative integer or subtraction bullet).
     * The Absolute Value Shield turns it into a positive bonus: |-n| = n.
     */
    _negative(n) {

      }
      const res = this._loss(n, '', CONFIG.hazardPercent * Math.min(n, 9) / 9);

      if (this.stageOp === '÷') this.multiplier = Math.max(1, Math.floor(this.multiplier / 2));

    /** The player touched (or was hit by) `token`. Mutates score/multiplier. */

        }

        case 'subBullet':
          return this._negative(token.value);

        case 'mult': {

          this.multiplier = Math.min(CONFIG.maxMultiplier, this.multiplier * token.value);
          return { delta: 0, label: `MULT ${TIMES}${this.multiplier}`, tone: 'good' };
        }

        case 'negmult': {
          const k = token.value;
          if (this.absActive) {
            // |x(-k)| = xk : the shield converts the hazard into a real multiplier
            this.multiplier = Math.min(CONFIG.maxMultiplier, this.multiplier * k);
            return { delta: 0, label: `|${TIMES}${MINUS}${k}|=${TIMES}${k}`, tone: 'good', absorbed: true };

          // would be an instant game over, so we charge a capped share instead.

        }

        case 'zero': {
          if (this.absActive) {

            return { delta: 0, label: 'NULLIFIED', tone: 'neutral', absorbed: true };
          }
          this.multiplier = 1;
          return this._loss(CONFIG.zeroPenalty, '0 ', CONFIG.zeroPercent);
        }

        case 'div':
        case 'frac': {
          // factor f in (0,1). Real division would halve your score at /2, which is
          // brutal, so the loss is softened by CONFIG.divSeverity. NOTE: the shield
          // does NOT help here, because these are not negative numbers.
          const f = token.kind === 'div' ? 1 / token.value : token.num / token.den;
          const raw = Math.max(1, Math.floor(this.score * (1 - f) * CONFIG.divSeverity));
          this.multiplier = Math.max(1, Math.floor(this.multiplier * f));
          const res = this._loss(raw, `${token.label} `);
          res.shrink = f; // Game shrinks the ship (weaker shots) by this factor
          return res;
        }

        default:
          return { delta: 0, label: '', tone: 'neutral' };
      }
    }

    /** The player shot (or bombed) a hostile token: pay out a kill reward. */
    resolveKill(token) {
      let base;
      switch (token.kind) {
        case 'int': base = Math.ceil(Math.abs(token.value) / 2) + 1; break;
        case 'zero': base = 3; break;
        default: base = 5; // negmult, div, frac

      // standing still and farming kills cannot snowball.
      this.score += base;
      return { delta: base, label: `+${base}`, tone: 'good' };
    }
  }
  return { isPrime, MathRules };
})();

      ctx.beginPath();
      const off = (this.t * 30) % 28;
      for (let sx = x0 - h - 28 + off; sx < x1 + 28; sx += 28) {
        ctx.moveTo(sx, top + h);
        ctx.lineTo(sx + h, top);
      }
      ctx.stroke();
      ctx.restore();
      ctx.strokeStyle = '#ffd9a0';
      ctx.lineWidth = 2;
      ctx.strokeRect(x0, top, x1 - x0, h);
    }
  }

  // -----------------------------------------------------------------------------
  // Pure visual effects
  // -----------------------------------------------------------------------------
  class Particle {
    constructor(x, y, vx, vy, life, color, size = 3) {
      Object.assign(this, { x, y, vx, vy, life, maxLife: life, color, size, dead: false });
    }
    update(dt) {
      this.x += this.vx * dt;
      this.y += this.vy * dt;
      this.vx *= 0.98;
      this.vy *= 0.98;
      this.life -= dt;
      if (this.life <= 0) this.dead = true;
    }
    draw(ctx) {
      ctx.globalAlpha = Math.max(0, this.life / this.maxLife);
      ctx.fillStyle = this.color;
      ctx.fillRect(this.x - this.size / 2, this.y - this.size / 2, this.size, this.size);
      ctx.globalAlpha = 1;
    }
  }

  class FloatingText {
    constructor(x, y, text, color, size = 18) {
      Object.assign(this, { x, y, text, color, size, life: 0.9, maxLife: 0.9, dead: false });
    }
    update(dt) {
      this.y -= 46 * dt;
      this.life -= dt;
      if (this.life <= 0) this.dead = true;
    }
    draw(ctx) {
      ctx.globalAlpha = Math.max(0, Math.min(1, this.life / (this.maxLife * 0.6)));
      drawText(ctx, this.text, this.x, this.y, { size: this.size, color: this.color, glow: 8 });
      ctx.globalAlpha = 1;
    }
  }

  // -----------------------------------------------------------------------------
  // Player
  // -----------------------------------------------------------------------------
  class Player {
    constructor(character) {
      this.character = character;
      this.x = W / 2;
      this.y = H - 100;
      this.sizeScale = 1; // shrinks when hit by / ÷ fractions: smaller ship = weaker shots
      this.cooldown = 0;
      this.volley = 0;
      this.t = 0;
    }

    /** Tiny core hitbox (shmup convention): hazards must touch the cockpit. */
    get hitRadius() { return 8 * this.sizeScale; }
    /** Pickups are collected with a more generous radius. */
    get collectRadius() { return 20 * this.sizeScale; }

    /** f in (0,1): shrink toward 0.5 + 0.5*f of full size, never below shrinkMin. */
    shrink(f) {
      this.sizeScale = Math.max(CONFIG.shrinkMin, Math.min(this.sizeScale, 0.5 + 0.5 * f));
    }

    update(dt, input) {
      this.t += dt;
      let dx = (input.isDown('right') ? 1 : 0) - (input.isDown('left') ? 1 : 0);
      let dy = (input.isDown('down') ? 1 : 0) - (input.isDown('up') ? 1 : 0);
      if (dx && dy) { dx *= Math.SQRT1_2; dy *= Math.SQRT1_2; } // no diagonal speed boost

      const speed = this.character.speed;
      this.x = clamp(this.x + dx * speed * dt, 22, W - 22);
      this.y = clamp(this.y + dy * speed * dt, 80, H - 34);

      // Touch drag: the ship follows the finger's movement (relative, 1.3x).
      const tc = input.touch;
      if (tc && tc.active) {
        this.x = clamp(this.x + tc.dx * CONFIG.touch.dragSensitivity, 22, W - 22);
        this.y = clamp(this.y + tc.dy * CONFIG.touch.dragSensitivity, 80, H - 34);
        tc.dx = 0;
        tc.dy = 0;
      }

      this.cooldown = Math.max(0, this.cooldown - dt);
      this.sizeScale = Math.min(1, this.sizeScale + CONFIG.shrinkRecoverPerSec * dt);
    }

    /**
     * Try to fire. Returns an array of Bullets, or null while on cooldown.
     *   single: one centered shot.
     *   burst : twin shots, and every Nth volley a 5-way fan with bonus damage.
     */
    tryFire() {
      if (this.cooldown > 0) return null;
      const c = this.character;
      this.cooldown = c.fireCooldown;
      this.volley++;

      const dmg = c.damage * this.sizeScale; // a shrunken ship hits weaker
      const make = (x, angle, d, color) => new Bullet({
        x, y: this.y - 20, owner: 'player', damage: d, color,
        vx: Math.sin(angle) * 640, vy: -Math.cos(angle) * 640,
      });

      if (c.weapon === 'single') {
        return [make(this.x, 0, dmg, c.color)];
      }
      if (this.volley % c.burstEvery === 0) {
        const d = dmg * c.burstDamageMult;
        return [-0.3, -0.15, 0, 0.15, 0.3].map((a) => make(this.x, a, d, '#ffffff'));
      }
      return [make(this.x - 8, 0, dmg, c.color), make(this.x + 8, 0, dmg, c.color)];
    }

    draw(ctx) {
      drawShip(ctx, this.character, this.x, this.y, this.sizeScale, this.t);
    }
  }
  return { MINUS, TIMES, DIVIDE, COLORS, Bullet, Token, POWERUP_INFO, PowerUp, Obstacle, Particle, FloatingText, Player };
})();

/* ======================= FILE: spawner.js ======================= */
const __mod_spawner = (() => {
  // =============================================================================
  // spawner.js  -  decides WHAT falls from the top and WHEN.
  //
  // Instead of alien sprites, the "enemies" are numbers and operators picked from
  // the current stage's weighted table (stages.js).
  // =============================================================================

  const { CONFIG } = __mod_config;
  const { Token, PowerUp, Obstacle } = __mod_entities;

  const W = CONFIG.width;

  class Spawner {
    /** @param {() => number} rng  injectable random source (tests pass a seeded one) */
    constructor(rng = Math.random) {
      this.rng = rng;
      this.reset();
    }

    reset() {
      this.timer = 0.9;
      this.powerTimer = this._nextPowerTime();
      this.obstacleTimer = 7;   // grace period before the first rock or wall
      this.lifeTimer = this._nextLifeTime();
    }

    _nextLifeTime() {
      const [lo, hi] = CONFIG.lifePickupInterval;
      return lo + (hi - lo) * this.rng();
    }

    _nextPowerTime() {
      const [lo, hi] = CONFIG.powerupInterval;
      return lo + (hi - lo) * this.rng();
    }

    /**
     * Called every frame.
     * @param {object} stage   current stage definition
     * @param {object} ctx     { intensity: 0..1 progress through the stage, difficulty: >= 1, playerX, lives }
     * @param {Token[]} tokens     output list for new tokens
     * @param {PowerUp[]} powerups output list for new power-ups
     * @param {Obstacle[]} obstacles output list for new rocks and walls
     */
    update(dt, stage, ctx, tokens, powerups, obstacles = []) {
      // --- tokens: spawn faster as the stage progresses and as loops increase ---
      this.timer -= dt;
      if (this.timer <= 0) {
        const interval = (stage.spawnInterval / ctx.difficulty) * (1 - 0.35 * ctx.intensity);
        this.timer = interval * (0.7 + 0.6 * this.rng());
        tokens.push(this._makeToken(this._pick(stage.table), stage, ctx.difficulty, ctx.playerX));
      }

      // --- power-ups: rare, on their own timer ---------------------------------
      this.powerTimer -= dt;
      if (this.powerTimer <= 0) {
        this.powerTimer = this._nextPowerTime();
        const kinds = ['abs', 'pi', 'sq'];
        const kind = kinds[Math.floor(this.rng() * kinds.length)];
        powerups.push(new PowerUp(kind, 40 + this.rng() * (W - 80)));
      }

      // --- obstacles: orange rocks and walls that cost a life ------------------
      if (stage.obstacles) {
        this.obstacleTimer -= dt;
        if (this.obstacleTimer <= 0) {
          const [lo, hi] = stage.obstacles.interval;
          this.obstacleTimer = (lo + (hi - lo) * this.rng()) / ctx.difficulty;
          obstacles.push(this._makeObstacle(stage, ctx));
        }
      }

      // --- hearts: only drop while the player is missing a life ----------------
      this.lifeTimer -= dt;
      if (this.lifeTimer <= 0) {
        this.lifeTimer = this._nextLifeTime();
        if ((ctx.lives ?? CONFIG.maxLives) < CONFIG.maxLives) {
          powerups.push(new PowerUp('life', 40 + this.rng() * (W - 80)));
        }
      }
    }

    _makeObstacle(stage, ctx) {
      const r = (a, b) => a + (b - a) * this.rng();
      const speedUp = 0.9 + 0.1 * ctx.difficulty;

      if (this.rng() < (stage.obstacles.wallChance || 0)) {
        const gapW = CONFIG.obstacles.wallGap;
        const margin = gapW / 2 + 15;
        return new Obstacle({ kind: 'wall', gapX: r(margin, W - margin), gapW, vy: r(80, 100) * speedUp });
      }

      // Rocks are often aimed at where the player is right now, so hiding is not an option.
      const aimed = ctx.playerX !== undefined && this.rng() < 0.6;
      const x = aimed ? Math.max(30, Math.min(W - 30, ctx.playerX + r(-30, 30))) : r(30, W - 30);
      return new Obstacle({
        kind: 'meteor', x, vy: r(130, 180) * speedUp, spin: r(-2, 2),
        jitter: Array.from({ length: 9 }, () => this.rng()),
      });
    }

    /** Weighted random pick from a stage table. */
    _pick(table) {
      const total = table.reduce((s, e) => s + e.weight, 0);
      let roll = this.rng() * total;
      for (const entry of table) {
        roll -= entry.weight;
        if (roll <= 0) return entry;
      }
      return table[table.length - 1];
    }

    _choice(list) {
      return list[Math.floor(this.rng() * list.length)];
    }

    _makeToken(entry, stage, difficulty, playerX) {
      const r = (a, b) => a + (b - a) * this.rng();
      const ri = (a, b) => Math.floor(r(a, b + 1));

      const spec = {
        kind: entry.kind,
        x: r(36, W - 36),
        y: -30,
        vy: r(stage.fallSpeed[0], stage.fallSpeed[1]) * (0.9 + 0.1 * difficulty),
        hp: 1,
      };

      // What number/operator is it? Hostile ones take more hits to destroy.
      switch (entry.kind) {
        case 'int':
          spec.value = entry.sign * ri(entry.min, entry.max);
          if (spec.value < 0) spec.hp = 1 + Math.floor(-spec.value / 4); // 1..3
          break;
        case 'mult':
          spec.value = this._choice(entry.values);
          break;
        case 'negmult':
        case 'div':
          spec.value = this._choice(entry.values);
          spec.hp = 2;
          break;
        case 'frac': {
          const [num, den] = this._choice(entry.pairs);
          spec.num = num;
          spec.den = den;
          spec.hp = 2;
          break;
        }
        case 'zero':
          spec.hp = 2;
          break;
      }

      // Hostile numbers sometimes spawn right above the player, so parking in one
      // spot is not a winning strategy.
      const hostile = (entry.kind === 'int' && spec.value < 0) || ['zero', 'negmult', 'div', 'frac'].includes(entry.kind);
      const aimed = hostile && playerX !== undefined && this.rng() < CONFIG.aimedSpawnChance;
      if (aimed) spec.x = Math.max(36, Math.min(W - 36, playerX + r(-40, 40)));

      // Movement pattern
      const roll = aimed ? 1 : this.rng();
      if (roll < 0.3) {
        spec.pattern = 'sine';
        spec.amp = r(30, 70);
        spec.freq = r(1.2, 2.4);
        spec.x = r(spec.amp + 30, W - spec.amp - 30); // keep the whole wave on screen
      } else if (roll < 0.45) {
        spec.pattern = 'drift';
        spec.vx = (this.rng() < 0.5 ? -1 : 1) * r(35, 80);
      }

      // Some hostile integers carry a gun and fire "-n" subtraction bullets.
      if (entry.kind === 'int' && spec.value < 0 && this.rng() < stage.shooterChance * difficulty) {
        spec.shooter = { interval: r(1.3, 2.1) / Math.sqrt(difficulty), volley: stage.shooterVolley };
        spec.vy *= 0.65;           // shooters linger so you can see them
        spec.pattern = 'straight';
      }

      return new Token(spec);
    }
  }
  return { Spawner };
})();

/* ======================= FILE: leaderboard.js ======================= */
const __mod_leaderboard = (() => {
  // =============================================================================
  // leaderboard.js  -  high-score table. No drawing code, so it is easy to test.
  //
  // TWO boards:
  //   * THIS DEVICE : always on. Saved in the browser's localStorage (top 10).
  //   * WORLD       : optional. Turns on when CONFIG.leaderboard.onlineUrl is set
  //                   to a Firebase Realtime Database URL (see README, "Online
  //                   leaderboard"). GitHub Pages can only host static files, so a
  //                   shared board needs an outside database like this one.
  //
  // A score row looks like: { name, score, pilot, stage, t }   (t = timestamp)
  // =============================================================================

  const { CONFIG } = __mod_config;

  /** Make a player-typed name safe and short. Empty names become PLAYER. */
  function cleanName(raw) {
    let s = String(raw ?? '')
      .replace(/[\u0000-\u001f\u007f<>]/g, '') // control characters and angle brackets
      .replace(/\s+/g, ' ')
      .trim();
    s = Array.from(s).slice(0, CONFIG.leaderboard.nameMax).join('');
    return s || 'PLAYER';
  }

  /** Only https:// URLs are accepted; a trailing slash or ".json" is removed. */
  function normalizeUrl(u) {
    const s = String(u ?? '').trim().replace(/\.json$/i, '').replace(/\/+$/, '');
    return /^https:\/\/[^\s]+$/i.test(s) ? s : '';
  }

  function safeStorage() {
    try { return globalThis.localStorage ?? null; } catch { return null; }
  }

  const isRow = (r) => r && typeof r.name === 'string' && Number.isFinite(r.score);
  const byScoreDesc = (a, b) => b.score - a.score || (a.t || 0) - (b.t || 0); // ties: older first
  const tidy = (r) => ({
    name: cleanName(r.name),
    score: Math.round(r.score),
    pilot: typeof r.pilot === 'string' ? r.pilot : '',
    stage: Number.isFinite(r.stage) ? r.stage : 1,
    t: Number.isFinite(r.t) ? r.t : 0,
  });

  class Leaderboard {
    /**
     * @param {{storage?: Storage|null, key?: string, size?: number,
     *          onlineUrl?: string, fetchFn?: Function}} opts   (all optional; tests inject fakes)
     */
    constructor(opts = {}) {
      this.storage = opts.storage !== undefined ? opts.storage : safeStorage();
      this.key = opts.key || CONFIG.leaderboard.storageKey;
      this.size = opts.size || CONFIG.leaderboard.size;
      this.onlineUrl = normalizeUrl(opts.onlineUrl ?? CONFIG.leaderboard.onlineUrl);
      this.fetchFn = opts.fetchFn || (typeof fetch === 'function' ? fetch.bind(globalThis) : null);
      this.memory = []; // fallback when localStorage is blocked (private mode, etc.)
    }

    /** True when the WORLD board is configured and the browser can reach it. */
    get online() { return Boolean(this.onlineUrl && this.fetchFn); }

    // ---- this device ----------------------------------------------------------

    rows() {
      let list = this.memory;
      if (this.storage) {
        try {
          const parsed = JSON.parse(this.storage.getItem(this.key) || '[]');
          if (Array.isArray(parsed)) list = parsed;
        } catch { /* corrupted data: start fresh */ }
      }
      return list.filter(isRow).map(tidy).sort(byScoreDesc).slice(0, this.size);
    }

    /** Would this score earn a place in the top list? */
    qualifies(score) {
      score = Math.round(score);
      if (!(score > 0)) return false;
      const rows = this.rows();
      return rows.length < this.size || score > rows[rows.length - 1].score;
    }

    /**
     * Save a score. Returns the saved row plus `rank` (1 = best, 0 = it did not
     * make the top list).
     */
    add(entry) {
      const row = tidy({ ...entry, t: entry.t ?? Date.now() });
      const rows = this.rows();
      // Insert below existing rows with an equal score (earlier score keeps its place)
      let idx = rows.findIndex((r) => row.score > r.score);
      if (idx === -1) idx = rows.length;
      rows.splice(idx, 0, row);
      const kept = rows.slice(0, this.size);
      this._write(kept);
      return { ...row, rank: idx < this.size ? idx + 1 : 0 };
    }

    _write(rows) {
      this.memory = rows;
      if (!this.storage) return;
      try { this.storage.setItem(this.key, JSON.stringify(rows)); } catch { /* storage full or blocked */ }
    }

    /** The last name this player typed (to pre-fill the box next time). */
    get lastName() {
      try { return this.storage?.getItem(`${this.key}.name`) || ''; } catch { return ''; }
    }

    set lastName(name) {
      try { this.storage?.setItem(`${this.key}.name`, name); } catch { /* ignore */ }
    }

    // ---- world (optional) -----------------------------------------------------

    /** Send one score to the online board. Resolves true/false, never throws. */
    async submitOnline(entry) {
      if (!this.online) return false;
      const body = JSON.stringify(tidy(entry));
      try {
        const res = await this.fetchFn(`${this.onlineUrl}/scores.json`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body,
        });
        return Boolean(res && res.ok);
      } catch {
        return false;
      }
    }

    /** Top scores from the online board. Resolves an array, or null if unreachable. */
    async fetchOnline() {
      if (!this.online) return null;
      try {
        // Firebase REST: ask for the highest `score` values (needs ".indexOn": "score")
        const query = `orderBy=${encodeURIComponent('"score"')}&limitToLast=${this.size}`;
        const res = await this.fetchFn(`${this.onlineUrl}/scores.json?${query}`);
        if (!res || !res.ok) return null;
        const data = await res.json();
        if (!data || typeof data !== 'object') return [];
        return Object.values(data).filter(isRow).map(tidy).sort(byScoreDesc).slice(0, this.size);
      } catch {
        return null;
      }
    }
  }
  return { cleanName, normalizeUrl, Leaderboard };
})();

/* ======================= FILE: inapp.js ======================= */
const __mod_inapp = (() => {
  // =============================================================================
  // inapp.js  -  detect "in-app browsers" (the mini browser inside Messenger,
  // Facebook, Instagram ...). When someone taps a link in Messenger, the game
  // opens in that mini browser, where sound, fullscreen and saved scores can be
  // unreliable. main.js shows a "open in your browser" prompt when this matches.
  // No DOM code here, so it is easy to test.
  // =============================================================================

  // Order matters: Messenger's user-agent also contains Facebook markers.
  const IN_APP_BROWSERS = [
    ['Messenger', /FB_IAB\/MESSENGER|MessengerForiOS|MessengerLite|Orca-Android|\bMESSENGER\b/i],
    ['Facebook', /FBAN|FBAV|FB_IAB|FBIOS/i],
    ['Instagram', /Instagram/i],
    ['TikTok', /musical_ly|BytedanceWebview|TikTok/i],
    ['Snapchat', /Snapchat/i],
    ['LINE', /\bLine\//i],
    ['WeChat', /MicroMessenger/i],
    ['Viber', /Viber/i],
  ];

  /** Returns the app's name (for example "Messenger"), or null for a normal browser. */
  function detectInAppBrowser(ua = '') {
    for (const [name, re] of IN_APP_BROWSERS) {
      if (re.test(ua)) return name;
    }
    return null;
  }

  /** 'android' | 'ios' | 'other' */
  function detectPlatform(ua = '') {
    if (/android/i.test(ua)) return 'android';
    if (/iphone|ipad|ipod/i.test(ua)) return 'ios';
    return 'other';
  }

  /**
   * Android only: a link that asks the phone to open this page in Chrome.
   * `loc` is window.location (or any object with protocol, host, pathname, search).
   */
  function chromeIntentUrl(loc) {
    const scheme = String(loc.protocol || 'https:').replace(':', '');
    return `intent://${loc.host}${loc.pathname}${loc.search || ''}#Intent;scheme=${scheme};package=com.android.chrome;end`;
  }

  /** Plain-language steps for the prompt. */
  function inAppHelp(platform) {
    if (platform === 'ios') return 'Tap the ••• or share button, then choose "Open in Safari".';
    if (platform === 'android') return 'Tap the ⋮ menu (top right), then choose "Open in Chrome" or "Open in browser".';
    return 'Open this link in your phone’s normal browser (Chrome or Safari).';
  }
  return { detectInAppBrowser, detectPlatform, chromeIntentUrl, inAppHelp };
})();

const __mod_ui = (() => {
  // =============================================================================
  // ui.js  -  HUD, menu and overlay screens. Pure drawing, no game logic.
  // Each function receives the 2D context and the Game to read state from.
  // =============================================================================

  const { CONFIG, CHARACTERS } = __mod_config;
  const { STAGES } = __mod_stages;
  const { drawText, drawShip, drawHeart, pathRoundRect } = __mod_draw;
  const { POWERUP_INFO, COLORS } = __mod_entities;

  const W = CONFIG.width;
  const H = CONFIG.height;
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

  /** A tappable rounded button. Returns its rect so the caller can register it. */
  function drawButton(ctx, rect, label, color = '#4dd2ff') {
    ctx.fillStyle = 'rgba(10,20,44,0.88)';
    ctx.strokeStyle = color;
    ctx.lineWidth = 2.5;
    ctx.shadowColor = color;
    ctx.shadowBlur = 10;
    pathRoundRect(ctx, rect.x, rect.y, rect.w, rect.h, 12);
    ctx.fill();
    ctx.stroke();
    ctx.shadowBlur = 0;
    drawText(ctx, label, rect.x + rect.w / 2, rect.y + rect.h / 2 + 1, { size: 17, color });
    return rect;
  }

  // -----------------------------------------------------------------------------
  // In-game HUD
  // -----------------------------------------------------------------------------
  function drawHUD(ctx, game) {
    const r = game.rules;
    const stage = game.stage;

    // Top panel
    ctx.fillStyle = 'rgba(4,10,24,0.62)';
    ctx.fillRect(0, 0, W, 58);

    drawText(ctx, 'SCORE = HEALTH', 14, 13, { size: 10, align: 'left', color: '#8fb3d9' });
    const low = r.score < CONFIG.lowScoreWarning;
    drawText(ctx, String(Math.max(0, Math.round(game.displayScore))), 14, 37, {
      size: 28, align: 'left', color: low ? COLORS.bad : '#ffffff', glow: 8,
    });

    drawText(ctx, `${stage.op}  ${stage.name}`, W / 2 + 10, 13, { size: 11, color: `hsl(${stage.hue},90%,70%)` });
    const prog = clamp(game.stageTime / CONFIG.stageDuration, 0, 1);
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    ctx.fillRect(W / 2 - 60, 24, 140, 4);
    ctx.fillStyle = `hsl(${stage.hue},90%,60%)`;
    ctx.fillRect(W / 2 - 60, 24, 140 * prog, 4);

    // Lives: filled heart = life left, faint outline = life lost
    for (let i = 0; i < CONFIG.maxLives; i++) {
      drawHeart(ctx, W / 2 + 10 + (i - (CONFIG.maxLives - 1) / 2) * 26, 41, 6.5, COLORS.heart, i < game.lives);
    }

    const m = r.effectiveMultiplier;
    drawText(ctx, 'MULT', W - 14, 13, { size: 10, align: 'right', color: '#8fb3d9' });
    drawText(ctx, `×${m}`, W - 14, 37, {
      size: 26, align: 'right', color: m > 1 ? COLORS.gold : '#5b7497', glow: m > 1 ? 10 : 0,
    });
    if (r.squareActive) {
      drawText(ctx, `(${r.multiplier}²)`, W - 80, 37, { size: 12, align: 'right', color: POWERUP_INFO.sq.color });
    }

    // Health bar: green when comfortable, red when close to zero
    const ratio = clamp(r.score / (r.character.startScore * 1.5), 0, 1);
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    ctx.fillRect(0, 52, W, 6);
    ctx.fillStyle = `hsl(${ratio * 120},85%,55%)`;
    ctx.fillRect(0, 52, W * ratio, 6);

    // Bottom-left: bombs
    const bombColor = game.bombs > 0 ? COLORS.violet : '#4a5a78';
    if (game.touchMode) {
      // On-screen buttons for touch players
      const b = CONFIG.touch.bomb;
      ctx.fillStyle = 'rgba(20,10,50,0.75)';
      ctx.strokeStyle = bombColor;
      ctx.lineWidth = 2;
      pathRoundRect(ctx, b.x, b.y, b.w, b.h, 12);
      ctx.fill();
      ctx.stroke();

  // -----------------------------------------------------------------------------

  function drawBanner(ctx, game) {

    const loop = Math.floor(game.stageIndex / STAGES.length);

    drawText(ctx, stage.name, W / 2, H / 2 + 40, { size: 24, color: '#ffffff', glow: 10 });
    drawText(ctx, stage.tagline, W / 2, H / 2 + 72, { size: 13, color: '#b9c9e6' });
    ctx.globalAlpha = 1;
  }

  // -----------------------------------------------------------------------------
  // Title / character select
  // -----------------------------------------------------------------------------
  function drawMenu(ctx, game) {
    drawText(ctx, 'MATH', W / 2, 78, { size: 52, color: '#4dd2ff', glow: 24 });
    drawText(ctx, 'STRIKER', W / 2, 128, { size: 52, color: '#ff6bd6', glow: 24 });
    drawText(ctx, 'a shoot-’em-up inside a quantum computer', W / 2, 160, { size: 12, color: '#8fb3d9', weight: 'normal' });

    game.cardRects = [];
    const cw = 205;
    const ch = 330;
    const gap = 20;
    const x0 = (W - (cw * 2 + gap)) / 2;
    const y0 = 190;

      const x = x0 + i * (cw + gap);
      const selected = game.menuIndex === i;
      game.cardRects.push({ x, y: y0, w: cw, h: ch });

      ctx.fillStyle = selected ? 'rgba(20,34,66,0.92)' : 'rgba(10,18,38,0.75)';
      ctx.strokeStyle = selected ? c.color : 'rgba(255,255,255,0.15)';

      ctx.fill();
      ctx.stroke();
      ctx.shadowBlur = 0;

      drawShip(ctx, c, x + cw / 2, y0 + 78, selected ? 1.5 + 0.05 * Math.sin(game.time * 4) : 1.3, game.time);
      drawText(ctx, c.name, x + cw / 2, y0 + 138, { size: 22, color: c.color, glow: selected ? 10 : 0 });
      drawText(ctx, c.role, x + cw / 2, y0 + 160, { size: 11, color: '#8fb3d9', weight: 'normal' });

      c.blurb.forEach((line, li) => {
        drawText(ctx, line, x + cw / 2, y0 + 186 + li * 16, { size: 12, color: '#d3e0f5', weight: 'normal' });

      });

    const pulse = 0.65 + 0.35 * Math.sin(game.time * 4);
    ctx.globalAlpha = pulse;
    drawText(ctx, 'TAP A PILOT TO START', W / 2, 543, { size: 14, color: '#ffffff', glow: 8 });
    ctx.globalAlpha = 1;

    game.menuButtons = [
      { id: 'board', ...drawButton(ctx, { x: W / 2 - 105, y: 558, w: 210, h: 42 }, 'LEADERBOARD', COLORS.gold) },

    drawText(ctx, 'DRAG to fly  ·  auto-fire  ·  tap BOMB for a Prime Bomb', W / 2, 624, { size: 12, color: '#b9c9e6', weight: 'normal' });
    drawText(ctx, `Orange rocks and walls cost a LIFE. You have ${CONFIG.maxLives}.`, W / 2, 644, { size: 12, color: COLORS.hazard, weight: 'normal' });
    drawText(ctx, 'Your SCORE is your health. Hit 0 and you are deleted.', W / 2, 666, { size: 12, color: COLORS.gold, weight: 'normal' });
    if (game.highScore > 0) {

  // -----------------------------------------------------------------------------
  // Overlays
  // -----------------------------------------------------------------------------
  function drawPause(ctx) {
    ctx.fillStyle = 'rgba(2,6,16,0.7)';
    ctx.fillRect(0, 0, W, H);
    drawText(ctx, 'PAUSED', W / 2, H / 2 - 20, { size: 42, color: '#ffffff', glow: 16 });
    drawText(ctx, 'tap anywhere to resume', W / 2, H / 2 + 22, { size: 14, color: '#9fb6d8', weight: 'normal' });
  }

  function drawGameOver(ctx, game) {
    ctx.fillStyle = 'rgba(2,6,16,0.84)';
    ctx.fillRect(0, 0, W, H);

    if (game.deathReason === 'lives') {
      drawText(ctx, 'OUT OF LIVES', W / 2, 150, { size: 20, color: COLORS.hazard });

    }

    drawText(ctx, 'BEST SCORE REACHED', W / 2, 296, { size: 12, color: '#8fb3d9' });
    drawText(ctx, String(Math.round(game.peakScore)), W / 2, 334, { size: 38, color: '#ffffff', glow: 10 });
    if (game.newBest) drawText(ctx, 'NEW HIGH SCORE!', W / 2, 368, { size: 16, color: COLORS.gold, glow: 10 });
    else drawText(ctx, `HIGH SCORE  ${game.highScore}`, W / 2, 368, { size: 13, color: '#8fb3d9' });

    });
